apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: app
spec:
  # Remove this line when you turn on the HPA (examples/hpa), or Argo CD and
  # the autoscaler will keep resetting each other.
  replicas: 2
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: app
          ports:
            - name: http
              containerPort: 8080
          # Secrets (ES, OpenAI, Typesafe, OTLP, Dash0, token signing) come only
          # from the app-credentials Secret, which is kept outside git.
          envFrom:
            - secretRef:
                name: app-credentials
          env:
            - name: TEAM_NAME
              value: "lanyard"
            - name: ROLE
              value: "app"
            - name: PORT
              value: "8080"
            - name: PUBLIC_BASE_URL
              value: "https://lanyard.cnh.radarhq.io"
            - name: EVENT_TZ
              value: "America/Denver"
            - name: VALKEY_URL
              value: "redis://valkey:6379"
            - name: OTEL_SERVICE_NAME
              value: "lanyard-app"
            # Set by kustomize from the image tag (the git SHA); see
            # replacements in kustomization.yaml.
            - name: SERVICE_VERSION
              value: "dev"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=hackathon,service.version=$(SERVICE_VERSION)"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
