apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: app
spec:
  # No `replicas`: the HPA in hpa.yaml owns the count (min 2, max 4).
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      # Radar Checks: the app never calls the Kubernetes API.
      automountServiceAccountToken: false
      # Radar Checks: spread replicas across nodes when possible (soft, so a
      # small cluster still schedules them).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: app
      containers:
        - name: app
          image: app
          ports:
            - name: http
              containerPort: 8080
          env:
            # Secrets (contracts §7, starred): one secretKeyRef per key from
            # app-credentials, which is kept outside git. Not optional: a
            # missing key should fail the rollout loudly, not start a broken app.
            - name: ES_URL
              valueFrom:
                secretKeyRef: {name: app-credentials, key: ES_URL}
            - name: ES_API_KEY
              valueFrom:
                secretKeyRef: {name: app-credentials, key: ES_API_KEY}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef: {name: app-credentials, key: OPENAI_API_KEY}
            - name: TYPESAFE_API_KEY
              valueFrom:
                secretKeyRef: {name: app-credentials, key: TYPESAFE_API_KEY}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                secretKeyRef: {name: app-credentials, key: OTEL_EXPORTER_OTLP_ENDPOINT}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef: {name: app-credentials, key: OTEL_EXPORTER_OTLP_HEADERS}
            - name: DASH0_RUM_AUTH_TOKEN
              valueFrom:
                secretKeyRef: {name: app-credentials, key: DASH0_RUM_AUTH_TOKEN}
            - name: TOKEN_SIGNING_KEY
              valueFrom:
                secretKeyRef: {name: app-credentials, key: TOKEN_SIGNING_KEY}
            # Non-secret config.
            - name: TEAM_NAME
              value: "lanyard"
            - name: ROLE
              value: "app"
            - name: PORT
              value: "8080"
            - name: PUBLIC_BASE_URL
              value: "https://lanyard.cnh.radarhq.io"
            - name: EVENT_TZ
              value: "America/Denver"
            - name: VALKEY_URL
              value: "redis://valkey:6379"
            - name: WORKER_URL
              value: "http://worker"
            - name: LLM_MODEL_CHAT
              value: "gpt-6.1-sol"
            - name: LLM_MODEL_FAST
              value: "gpt-5.4-mini"
            - name: DASH0_RUM_ENDPOINT
              value: "https://ingress.us-west-2.aws.dash0.com"
            - name: OTEL_SERVICE_NAME
              value: "lanyard-app"
            # Set by kustomize from the image tag (the git SHA); see
            # replacements in kustomization.yaml.
            - name: SERVICE_VERSION
              value: "dev"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=hackathon,service.version=$(SERVICE_VERSION)"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              # Incident A (Radar issue dd66c0ce35d63e27): a pod hit 0.489 of a
              # 0.5 CPU limit. 650m is the most that fits the 4 CPU limits budget
              # even at HPA max + 1 rollout surge: 5 x 650m + worker 500m + valkey 250m = 4.0.
              cpu: 650m
              memory: 512Mi
          # Radar investigation chat_RjOgOymzUJCDCUUF: during rollouts, readiness
          # and liveness fired before the app bound :8080 ("connection
          # refused"). Hold them until /healthz answers (up to 60 s).
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          # Incident A (Radar issue dd66c0ce35d63e27, 22:56-23:01Z): under load a
          # busy-but-alive pod missed the 1 s liveness timeout 3 times and was
          # killed, which pushed its clients onto the other pod, which then died
          # too. Liveness now tolerates 6 x 10 s of a slow /healthz before a
          # restart; readiness gets 3 s so a busy pod sheds traffic instead.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            # Radar Checks: read-only root; only /tmp is writable.
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
