apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: app
spec:
  # Remove this line when you turn on the HPA (examples/hpa), or Argo CD and
  # the autoscaler will keep resetting each other.
  replicas: 2
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: app
          ports:
            - name: http
              containerPort: 8080
          env:
            # Secrets (contracts §7, starred): one secretKeyRef per key from
            # app-credentials, which is kept outside git. Not optional: a
            # missing key should fail the rollout loudly, not start a broken app.
            - name: ES_URL
              valueFrom:
                secretKeyRef: {name: app-credentials, key: ES_URL}
            - name: ES_API_KEY
              valueFrom:
                secretKeyRef: {name: app-credentials, key: ES_API_KEY}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef: {name: app-credentials, key: OPENAI_API_KEY}
            - name: TYPESAFE_API_KEY
              valueFrom:
                secretKeyRef: {name: app-credentials, key: TYPESAFE_API_KEY}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                secretKeyRef: {name: app-credentials, key: OTEL_EXPORTER_OTLP_ENDPOINT}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef: {name: app-credentials, key: OTEL_EXPORTER_OTLP_HEADERS}
            - name: DASH0_RUM_AUTH_TOKEN
              valueFrom:
                secretKeyRef: {name: app-credentials, key: DASH0_RUM_AUTH_TOKEN}
            - name: TOKEN_SIGNING_KEY
              valueFrom:
                secretKeyRef: {name: app-credentials, key: TOKEN_SIGNING_KEY}
            # Non-secret config.
            - name: TEAM_NAME
              value: "lanyard"
            - name: ROLE
              value: "app"
            - name: PORT
              value: "8080"
            - name: PUBLIC_BASE_URL
              value: "https://lanyard.cnh.radarhq.io"
            - name: EVENT_TZ
              value: "America/Denver"
            - name: VALKEY_URL
              value: "redis://valkey:6379"
            - name: OTEL_SERVICE_NAME
              value: "lanyard-app"
            # Set by kustomize from the image tag (the git SHA); see
            # replacements in kustomization.yaml.
            - name: SERVICE_VERSION
              value: "dev"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=hackathon,service.version=$(SERVICE_VERSION)"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
