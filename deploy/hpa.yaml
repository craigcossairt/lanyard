# Scales app on CPU. The app Deployment has no `replicas` field, so Argo CD
# and the autoscaler don't fight over it.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: app
  # Incident A: during the crash loop the HPA was blind ("did not receive
  # metrics for targeted pods (pods might be unready)") and never scaled past
  # 2. Start the demo with 3 pods of headroom instead of relying on scale-out.
  minReplicas: 3
  # 4 pods x 650m CPU limit = 2.6 CPU; + worker 0.5 + valkey 0.25 = 3.35 of the
  # team's 4 CPU of limits (4.0 with one rollout surge pod). No load Jobs at max.
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      # Hold capacity for 3 minutes after a surge so a demo room that
      # reconnects doesn't land on freshly removed pods.
      stabilizationWindowSeconds: 180
