# Argo CD deploys this folder to your team's namespace. The GitHub Action
# sets the image below on every push to main; don't edit newName or newTag
# by hand.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: team-lanyard
resources:
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - valkey.yaml
# Copy the image tag (the git SHA the deploy bot sets below) into each
# workload's SERVICE_VERSION env var, which feeds OTEL_RESOURCE_ATTRIBUTES.
replacements:
  - source:
      kind: Deployment
      name: app
      fieldPath: spec.template.spec.containers.[name=app].image
      options:
        delimiter: ":"
        index: 1
    targets:
      - select:
          kind: Deployment
          name: app
        fieldPaths:
          - spec.template.spec.containers.[name=app].env.[name=SERVICE_VERSION].value
images:
  - name: app
    newName: ghcr.io/craigcossairt/lanyard
    newTag: 51317cf
