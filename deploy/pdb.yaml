# Radar Checks: keep at least one app pod through voluntary disruptions
# (node drains, upgrades). The HPA keeps 2 to 4 replicas, so one can always go.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: app
  labels:
    app: app
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: app
