:root {
  /* Type */
  --font-sans:
    'Atkinson Hyperlegible Next', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --text-xs: 0.75rem;
  --text-sm: 0.875rem;
  --text-md: 1rem;
  --text-lg: 1.25rem;
  --text-xl: 1.5rem;
  --text-2xl: 2rem;
  --text-3xl: 2.75rem;
  --leading: 1.5;
  --caption-leading: 1.35;
  /* Speaker stage mode: captions and questions read from 10 m on a projector. */
  --stage-size: clamp(2.5rem, 4.6vw, 5.5rem);

  /* Space (4 px base) */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;

  /* Shape */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-pill: 999px;
  --border-w: 1px;
  --target-min: 44px;

  /* Motion */
  --dur-fast: 120ms;
  --dur-base: 220ms;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);

  /* Layers */
  --z-sticky: 10;
  --z-sheet: 40;
  --z-toast: 50;

  /* Layout */
  --side-w: 400px;
  --sheet-w: 420px;
}

/* Dark is the default: the stage and the room are dim, projectors glare. */
:root,
[data-theme='dark'] {
  color-scheme: dark;
  --color-bg: #0b0d12;
  --color-surface: #141821;
  --color-surface-2: #1d2230;
  --color-border: #2e3547;
  /* Edges that identify a control (inputs): 3:1 against every surface (WCAG 1.4.11). */
  --color-border-strong: #6e7891;
  --color-text: #eef1f6;
  --color-text-muted: #a9b1c2;
  --color-accent: #b69cff;
  --color-on-accent: #150a33;
  --color-focus: #5ad8ff;
  --color-ok: #4fd69c;
  --color-ok-bg: #0f2a20;
  --color-warn: #f5bd4f;
  --color-warn-bg: #2d2310;
  --color-crit: #ff7b7b;
  --color-crit-bg: #331617;
  --color-info: #79b8ff;
  --color-info-bg: #122238;
  --color-caption-bg: #05060a;
  --color-caption-text: #fffdf6;
  --color-caption-interim: #9aa3b5;
  --color-scrim: rgb(0 0 0 / 0.6);
}

[data-theme='light'] {
  color-scheme: light;
  --color-bg: #f5f6f8;
  --color-surface: #ffffff;
  --color-surface-2: #eceef3;
  --color-border: #cfd4de;
  --color-border-strong: #7c8496;
  --color-text: #10131c;
  --color-text-muted: #4a5266;
  --color-accent: #5b34d6;
  --color-on-accent: #ffffff;
  --color-focus: #0b57d0;
  --color-ok: #0a7a45;
  --color-ok-bg: #e3f5ec;
  --color-warn: #8a5a00;
  --color-warn-bg: #fdf1d8;
  --color-crit: #c0262d;
  --color-crit-bg: #fde6e6;
  --color-info: #1f5fbf;
  --color-info-bg: #e3eefc;
  --color-caption-bg: #ffffff;
  --color-caption-text: #0b0d12;
  --color-caption-interim: #5b6375;
  --color-scrim: rgb(16 19 28 / 0.45);
}

[data-theme='contrast'] {
  color-scheme: dark;
  --color-bg: #000000;
  --color-surface: #000000;
  --color-surface-2: #121212;
  --color-border: #ffffff;
  --color-border-strong: #ffffff;
  --color-text: #ffffff;
  --color-text-muted: #f0f0f0;
  --color-accent: #ffe14d;
  --color-on-accent: #000000;
  --color-focus: #00e5ff;
  --color-ok: #5cff9d;
  --color-ok-bg: #000000;
  --color-warn: #ffd23f;
  --color-warn-bg: #000000;
  --color-crit: #ff8a8a;
  --color-crit-bg: #000000;
  --color-info: #8fd0ff;
  --color-info-bg: #000000;
  --color-caption-bg: #000000;
  --color-caption-text: #ffff66;
  --color-caption-interim: #ffffff;
  --color-scrim: rgb(0 0 0 / 0.8);
  --border-w: 2px;
}

/* Caption sizes: L is the default; XXL fits about 3 words a line on a phone. */
:root,
[data-caption-size='l'] {
  --caption-size: 2.125rem;
}
[data-caption-size='s'] {
  --caption-size: 1.25rem;
}
[data-caption-size='m'] {
  --caption-size: 1.625rem;
}
[data-caption-size='xl'] {
  --caption-size: 2.75rem;
}
[data-caption-size='xxl'] {
  --caption-size: 3.625rem;
}

/* Readable spacing: the dyslexia-friendly option. Same font, more air. */
[data-readable='true'] {
  --readable-tracking: 0.04em;
  --readable-words: 0.14em;
  --leading: 1.7;
  --caption-leading: 1.7;
}

[data-motion='reduce'] {
  --dur-fast: 0ms;
  --dur-base: 0ms;
}
@media (prefers-reduced-motion: reduce) {
  :root {
    --dur-fast: 0ms;
    --dur-base: 0ms;
  }
}

/* ===== apps/web/src/ui/styles.css (verbatim, minus @import) ===== */
/*
 * Lanyard UI: base styles and components. Import once, in main.tsx:
 *   import './ui/styles.css';
 * Classes are prefixed `ly-` and belong to the components in this folder.
 * Persona code composes components; it does not restyle `ly-` classes.
 */

/* ---------- Base ---------- */
*,
*::before,
*::after {
  box-sizing: border-box;
}
html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--text-md);
  line-height: var(--leading);
  letter-spacing: var(--readable-tracking, normal);
  word-spacing: var(--readable-words, normal);
}
a {
  color: var(--color-accent);
  text-underline-offset: 0.18em;
}
:focus-visible {
  outline: 3px solid var(--color-focus);
  outline-offset: 2px;
}
button,
input,
textarea,
select {
  font: inherit;
  letter-spacing: inherit;
  word-spacing: inherit;
}
.ly-sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}
.ly-muted {
  color: var(--color-text-muted);
}
.ly-num {
  font-variant-numeric: tabular-nums;
}
.ly-icon {
  width: 22px;
  height: 22px;
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ---------- Button / IconButton ---------- */
.ly-btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-height: var(--target-min);
  padding: 0 var(--space-4);
  border-radius: var(--radius-md);
  border: var(--border-w) solid var(--color-border);
  background: var(--color-surface-2);
  color: var(--color-text);
  font-size: var(--text-md);
  font-weight: 700;
  line-height: 1.2;
  text-decoration: none;
  cursor: pointer;
  transition: transform var(--dur-fast) var(--ease);
}
.ly-btn:active {
  transform: scale(0.97);
}
.ly-btn:disabled,
.ly-btn[aria-disabled='true'] {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}
.ly-btn--primary,
.ly-btn[aria-pressed='true'] {
  background: var(--color-accent);
  border-color: var(--color-accent);
  color: var(--color-on-accent);
}
.ly-btn--ghost {
  background: transparent;
  border-color: transparent;
}
.ly-btn--danger {
  background: var(--color-crit-bg);
  border-color: var(--color-crit);
  color: var(--color-crit);
}
.ly-btn--lg {
  min-height: 56px;
  font-size: var(--text-lg);
  border-radius: var(--radius-lg);
}
.ly-btn--block {
  width: 100%;
}
.ly-btn--stacked {
  flex-direction: column;
  gap: 3px;
  min-height: 60px;
  padding: var(--space-1);
  font-size: var(--text-xs);
}
.ly-btn--icon {
  padding: 0;
  width: var(--target-min);
}
.ly-btn__badge {
  position: absolute;
  top: 4px;
  right: 8px;
  min-width: 20px;
  padding: 0 6px;
  border-radius: var(--radius-pill);
  background: var(--color-accent);
  color: var(--color-on-accent);
  font-size: 11px;
  line-height: 18px;
}

/* ---------- StatusPill ---------- */
.ly-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px;
  border-radius: var(--radius-pill);
  border: var(--border-w) solid currentColor;
  font-size: var(--text-sm);
  font-weight: 700;
  line-height: 1.3;
  white-space: nowrap;
  color: var(--color-text-muted);
  background: var(--color-surface-2);
}
.ly-pill .ly-icon {
  width: 16px;
  height: 16px;
}
.ly-pill--ok {
  color: var(--color-ok);
  background: var(--color-ok-bg);
}
.ly-pill--warn {
  color: var(--color-warn);
  background: var(--color-warn-bg);
}
.ly-pill--crit,
.ly-pill--live {
  color: var(--color-crit);
  background: var(--color-crit-bg);
}
.ly-pill--info {
  color: var(--color-info);
  background: var(--color-info-bg);
}
.ly-pill--live::before {
  content: '';
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
  animation: ly-pulse 1.6s infinite;
}
@keyframes ly-pulse {
  50% {
    opacity: 0.35;
  }
}

/* ---------- Card ---------- */
.ly-card {
  padding: var(--space-4);
  border-radius: var(--radius-md);
  border: var(--border-w) solid var(--color-border);
  background: var(--color-surface);
}
.ly-card--flush {
  padding: 0;
}
.ly-card--selected {
  border-color: var(--color-accent);
  box-shadow: inset 3px 0 0 var(--color-accent);
}
.ly-card > h2,
.ly-card > h3 {
  margin: 0 0 var(--space-2);
  font-size: var(--text-lg);
}

/* ---------- Sheet / Drawer (native <dialog>) ---------- */
.ly-sheet {
  margin: auto 0 0;
  padding: 0;
  width: 100%;
  max-width: 100%;
  max-height: 86dvh;
  border: 0;
  border-top: var(--border-w) solid var(--color-border);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  background: var(--color-surface);
  color: var(--color-text);
}
.ly-sheet[open] {
  animation: ly-sheet-in var(--dur-base) var(--ease);
}
.ly-sheet::backdrop {
  background: var(--color-scrim);
}
.ly-sheet__inner {
  padding: var(--space-4) var(--space-4) var(--space-6);
}
.ly-sheet__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  margin-bottom: var(--space-3);
}
.ly-sheet__head h2 {
  margin: 0;
  font-size: var(--text-xl);
  line-height: 1.2;
}
.ly-sheet__desc {
  margin: 0 0 var(--space-4);
  color: var(--color-text-muted);
}
.ly-sheet--captions {
  background: var(--color-caption-bg);
}
@keyframes ly-sheet-in {
  from {
    transform: translateY(30px);
    opacity: 0;
  }
}
@media (min-width: 900px) {
  .ly-sheet {
    margin: 0 0 0 auto;
    width: var(--sheet-w);
    height: 100dvh;
    max-height: none;
    border-top: 0;
    border-left: var(--border-w) solid var(--color-border);
    border-radius: 0;
  }
}

/* ---------- Toast ---------- */
.ly-toast-region {
  position: fixed;
  top: var(--space-3);
  left: var(--space-3);
  right: var(--space-3);
  z-index: var(--z-toast);
  display: grid;
  justify-items: center;
  pointer-events: none;
}
.ly-toast {
  display: flex;
  align-items: center;
  gap: 10px;
  width: min(100%, 420px);
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius-md);
  background: var(--color-text);
  color: var(--color-bg);
  font-weight: 700;
  animation: ly-sheet-in var(--dur-base) var(--ease);
  pointer-events: auto;
}
@media (min-width: 900px) {
  .ly-toast-region {
    left: auto;
    justify-items: end;
  }
}

/* ---------- Tabs ---------- */
.ly-tabs__list {
  display: flex;
  border-bottom: var(--border-w) solid var(--color-border);
}
.ly-tabs__tab {
  flex: 1;
  min-height: 48px;
  padding: 0 var(--space-3);
  border: 0;
  border-bottom: 3px solid transparent;
  background: none;
  color: var(--color-text-muted);
  font-size: var(--text-md);
  font-weight: 700;
  cursor: pointer;
}
.ly-tabs__tab[aria-selected='true'] {
  color: var(--color-text);
  border-bottom-color: var(--color-accent);
}
.ly-tabs__panel {
  padding-top: var(--space-4);
}

/* ---------- Input / TextArea ---------- */
.ly-field {
  display: grid;
  gap: var(--space-1);
}
.ly-field__label {
  font-weight: 700;
}
.ly-field__hint {
  font-size: var(--text-sm);
  color: var(--color-text-muted);
}
.ly-field__error {
  display: flex;
  gap: 6px;
  align-items: center;
  font-size: var(--text-sm);
  font-weight: 700;
  color: var(--color-crit);
}
.ly-field__error .ly-icon {
  width: 18px;
  height: 18px;
}
.ly-input {
  width: 100%;
  min-height: 48px;
  padding: var(--space-3);
  border-radius: var(--radius-md);
  border: var(--border-w) solid var(--color-border-strong);
  background: var(--color-bg);
  color: var(--color-text);
  font-size: var(--text-md);
  resize: none;
}
.ly-input::placeholder {
  color: var(--color-text-muted);
}
.ly-input[aria-invalid='true'] {
  border-color: var(--color-crit);
}

/* ---------- CaptionStream ---------- */
.ly-caps {
  position: relative;
  flex: 1;
  min-height: 0;
  overflow: auto;
  overscroll-behavior: contain;
  padding: var(--space-5) var(--space-5) var(--space-7);
  background: var(--color-caption-bg);
  color: var(--color-caption-text);
  font-size: var(--caption-size);
  line-height: var(--caption-leading);
}
.ly-caps--stage {
  font-size: var(--stage-size);
  padding: var(--space-6) var(--space-7) var(--space-8);
}
.ly-caps__log {
  margin: 0;
  padding: 0;
  list-style: none;
}
.ly-caps__line {
  margin: 0 0 0.55em;
  max-width: 32ch;
  animation: ly-cap-in var(--dur-base) var(--ease);
}
.ly-caps--stage .ly-caps__line,
.ly-caps--wide .ly-caps__line {
  max-width: 42ch;
}
.ly-caps__speaker {
  display: block;
  margin-bottom: 0.2em;
  color: var(--color-accent);
  font-size: var(--text-sm);
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.ly-caps--stage .ly-caps__speaker {
  font-size: var(--text-xl);
}
.ly-caps__interim {
  margin: 0;
  max-width: 32ch;
  color: var(--color-caption-interim);
}
/* Stale (connection lost): dim to the interim colour, which keeps at least 4.5:1. Never opacity. */
.ly-caps--stale .ly-caps__log {
  color: var(--color-caption-interim);
}
.ly-caps__jump {
  position: sticky;
  bottom: var(--space-4);
  display: flex;
  width: fit-content;
  margin: var(--space-4) auto 0;
  font-size: var(--text-md);
  line-height: 1.2;
  z-index: var(--z-sticky);
}
@keyframes ly-cap-in {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
}

/* ---------- QuestionItem ---------- */
.ly-qlist {
  display: grid;
  gap: 10px;
  margin: 0;
  padding: 0;
  list-style: none;
}
.ly-q {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: var(--space-3);
  padding: var(--space-3);
  border-radius: var(--radius-md);
  border: var(--border-w) solid var(--color-border);
  background: var(--color-surface);
}
.ly-q--mine {
  border-color: var(--color-accent);
  box-shadow: inset 3px 0 0 var(--color-accent);
}
/* Answered: a background change plus the "Answered" pill. Never opacity: the text must keep its contrast. */
.ly-q--answered {
  background: var(--color-surface-2);
  border-style: dashed;
}
.ly-q__vote {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 52px;
  min-height: 52px;
  border-radius: var(--radius-md);
  border: var(--border-w) solid var(--color-border);
  background: var(--color-surface-2);
  color: var(--color-text);
  font-size: var(--text-md);
  font-weight: 700;
  cursor: pointer;
}
.ly-q__vote[aria-pressed='true'] {
  background: var(--color-accent);
  border-color: var(--color-accent);
  color: var(--color-on-accent);
}
.ly-q__vote .ly-icon {
  width: 18px;
  height: 18px;
}
.ly-q__rank {
  display: grid;
  place-items: center;
  width: 52px;
  font-size: var(--text-2xl);
  font-weight: 700;
  color: var(--color-text-muted);
}
.ly-q__label {
  margin: 0 0 2px;
  font-size: var(--text-md);
  font-weight: 700;
  overflow-wrap: anywhere;
}
.ly-q__text {
  margin: 0;
  font-size: var(--text-sm);
  color: var(--color-text-muted);
  line-height: 1.45;
  overflow-wrap: anywhere;
}
.ly-q__meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  margin-top: 6px;
  font-size: var(--text-sm);
}
.ly-q--stage {
  font-size: var(--text-xl);
}
.ly-q--stage .ly-q__label {
  font-size: var(--text-2xl);
}
.ly-q--stage .ly-q__text,
.ly-q--stage .ly-q__meta {
  font-size: var(--text-lg);
}

/* ---------- SignalBar ---------- */
.ly-signals {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
}
.ly-signals--grid {
  grid-template-columns: 1fr 1fr;
  gap: var(--space-3);
}
.ly-signals--grid .ly-signal:last-child {
  grid-column: 1 / -1;
}
.ly-signal {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  min-height: 64px;
  padding: 6px 2px;
  border-radius: var(--radius-md);
  border: var(--border-w) solid var(--color-border);
  background: var(--color-surface);
  color: var(--color-text);
  font-size: var(--text-xs);
  font-weight: 700;
  line-height: 1.1;
  text-align: center;
  cursor: pointer;
}
.ly-signals--grid .ly-signal {
  min-height: 80px;
  font-size: var(--text-md);
}
.ly-signal[aria-pressed='true'] {
  background: var(--color-accent);
  border-color: var(--color-accent);
  color: var(--color-on-accent);
}

/* ---------- Meter ---------- */
.ly-meter {
  display: grid;
  gap: var(--space-1);
}
.ly-meter__head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: var(--space-2);
  font-size: var(--text-sm);
}
.ly-meter__label {
  font-weight: 700;
}
.ly-meter__value {
  font-variant-numeric: tabular-nums;
  font-weight: 700;
}
.ly-meter__track {
  height: 10px;
  border-radius: var(--radius-pill);
  background: var(--color-surface-2);
  border: var(--border-w) solid var(--color-border);
  overflow: hidden;
}
.ly-meter__fill {
  height: 100%;
  background: var(--color-accent);
  transition: width var(--dur-base) var(--ease);
}
.ly-meter--ok .ly-meter__fill {
  background: var(--color-ok);
}
.ly-meter--warn .ly-meter__fill {
  background: var(--color-warn);
}
.ly-meter--crit .ly-meter__fill {
  background: var(--color-crit);
}
.ly-meter--ok .ly-meter__value {
  color: var(--color-ok);
}
.ly-meter--warn .ly-meter__value {
  color: var(--color-warn);
}
.ly-meter--crit .ly-meter__value {
  color: var(--color-crit);
}
.ly-meter--lg .ly-meter__head {
  font-size: var(--text-xl);
}
.ly-meter--lg .ly-meter__track {
  height: 20px;
}

/* ---------- RoomTile ---------- */
.ly-room {
  display: grid;
  gap: var(--space-2);
  padding: var(--space-3);
  border-radius: var(--radius-md);
  border: var(--border-w) solid var(--color-border);
  border-left-width: 4px;
  background: var(--color-surface);
  color: var(--color-text);
  text-align: left;
  width: 100%;
}
.ly-room {
  position: relative;
}
.ly-room__open {
  padding: 0;
  border: 0;
  background: none;
  color: inherit;
  text-align: left;
  cursor: pointer;
}
/* The name button covers the tile, so the whole tile is the click target. */
.ly-room__open::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: var(--radius-md);
}
.ly-room__open:focus-visible {
  outline: none;
}
.ly-room:has(.ly-room__open:focus-visible) {
  outline: 3px solid var(--color-focus);
  outline-offset: 2px;
}
.ly-room:has(.ly-room__open):hover {
  background: var(--color-surface-2);
}
.ly-room--ok {
  border-left-color: var(--color-ok);
}
.ly-room--warn {
  border-left-color: var(--color-warn);
}
.ly-room--crit {
  border-left-color: var(--color-crit);
}
.ly-room__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
}
.ly-room__name {
  margin: 0;
  font-size: var(--text-md);
  font-weight: 700;
}
.ly-room__session {
  margin: 0;
  font-size: var(--text-sm);
  color: var(--color-text-muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ly-room__stats {
  display: flex;
  gap: var(--space-4);
  margin: 0;
  font-family: var(--font-mono);
  font-size: var(--text-sm);
  font-variant-numeric: tabular-nums;
}
.ly-room__stats div {
  display: flex;
  gap: 4px;
}
.ly-room__stats dt {
  color: var(--color-text-muted);
}
.ly-room__stats dd {
  margin: 0;
  font-weight: 700;
}

/* ---------- EmptyState / ErrorState / Banner / Skeleton ---------- */
.ly-empty {
  padding: var(--space-6) var(--space-4);
  text-align: center;
  color: var(--color-text-muted);
}
.ly-empty__icon {
  width: 32px;
  height: 32px;
  margin-bottom: var(--space-2);
}
.ly-empty__title {
  display: block;
  margin: 0 0 6px;
  color: var(--color-text);
  font-size: var(--text-lg);
  font-weight: 700;
}
.ly-empty__body {
  margin: 0 auto;
  max-width: 36ch;
}
.ly-empty__action {
  margin-top: var(--space-4);
}
.ly-caps .ly-empty {
  font-size: calc(var(--caption-size) * 0.6);
}
.ly-caps .ly-empty__title {
  font-size: 1.25em;
}
.ly-empty--error .ly-empty__icon {
  color: var(--color-crit);
}
.ly-banner {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: var(--space-2) var(--space-3);
  border-bottom: var(--border-w) solid currentColor;
  font-size: var(--text-sm);
  font-weight: 700;
  color: var(--color-warn);
  background: var(--color-warn-bg);
}
.ly-banner--crit {
  color: var(--color-crit);
  background: var(--color-crit-bg);
}
.ly-banner--info {
  color: var(--color-info);
  background: var(--color-info-bg);
}
.ly-banner .ly-btn {
  min-height: 36px;
  margin-left: auto;
  font-size: var(--text-sm);
}
.ly-skeleton {
  display: block;
  border-radius: var(--radius-sm);
  background: linear-gradient(
    90deg,
    var(--color-surface-2),
    var(--color-surface),
    var(--color-surface-2)
  );
  background-size: 200% 100%;
  animation: ly-shimmer 1.4s infinite linear;
}
.ly-caps .ly-skeleton {
  height: 0.9em;
  margin-bottom: 0.6em;
}
@keyframes ly-shimmer {
  to {
    background-position: -200% 0;
  }
}

/* ---------- CaptionStage: the attendee live-session layout (direction A) ---------- */
.ly-stage {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  background: var(--color-caption-bg);
}
.ly-stage__head {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-2) var(--space-2) var(--space-4);
  border-bottom: var(--border-w) solid var(--color-border);
  background: var(--color-bg);
}
.ly-stage__title {
  flex: 1;
  min-width: 0;
  margin: 0;
  font-size: var(--text-sm);
  font-weight: 700;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ly-stage__count {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: var(--text-sm);
  color: var(--color-text-muted);
  font-variant-numeric: tabular-nums;
}
.ly-stage__count .ly-icon {
  width: 18px;
  height: 18px;
}
.ly-stage__main {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
}
.ly-stage__side {
  display: none;
}
.ly-stage__dock {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3) max(var(--space-4), env(safe-area-inset-bottom));
  border-top: var(--border-w) solid var(--color-border);
  background: var(--color-bg);
}
@media (min-width: 900px) {
  .ly-stage {
    display: grid;
    grid-template-columns: 1fr var(--side-w);
    grid-template-rows: auto auto 1fr auto;
  }
  .ly-stage > .ly-banner,
  .ly-stage__head {
    grid-column: 1 / -1;
  }
  .ly-stage__main {
    grid-column: 1;
    grid-row: 3 / 5;
  }
  .ly-stage__main .ly-caps__line {
    max-width: 42ch;
  }
  .ly-stage__side {
    display: block;
    grid-column: 2;
    grid-row: 3;
    overflow: auto;
    padding: var(--space-4);
    background: var(--color-bg);
    border-left: var(--border-w) solid var(--color-border);
  }
  .ly-stage__side h2 {
    margin: 0 0 10px;
    font-size: var(--text-lg);
  }
  .ly-stage__side h2:not(:first-child) {
    margin-top: var(--space-5);
  }
  .ly-stage__dock {
    grid-column: 2;
    grid-row: 4;
    border-left: var(--border-w) solid var(--color-border);
  }
  /* On desktop, Questions and React are already in the side panel. */
  .ly-stage__dock [data-dock-desktop='hide'] {
    display: none;
  }
  .ly-stage__dock {
    grid-template-columns: none;
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
  }
}

/* ---------- Display settings ---------- */
.ly-prefs {
  display: grid;
  gap: var(--space-4);
}
.ly-prefs fieldset {
  margin: 0;
  padding: 0;
  border: 0;
}
.ly-prefs legend {
  margin-bottom: 6px;
  padding: 0;
  font-weight: 700;
}
.ly-prefs__row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

/* ---------- Reduced motion: stop loops too, not just transitions ---------- */
[data-motion='reduce'] .ly-pill--live::before,
[data-motion='reduce'] .ly-skeleton,
[data-motion='reduce'] .ly-caps__line,
[data-motion='reduce'] .ly-sheet[open],
[data-motion='reduce'] .ly-toast {
  animation: none;
}
@media (prefers-reduced-motion: reduce) {
  .ly-pill--live::before,
  .ly-skeleton,
  .ly-caps__line,
  .ly-sheet[open],
  .ly-toast {
    animation: none;
  }
}

/* ============ HARNESS (not part of the design) ============ */
html,body{margin:0}
body{background:#2a2d35;color:#eef1f6}
.h-bar{position:sticky;top:0;z-index:100;background:#15171c;border-bottom:1px solid #333;padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font:13px/1.3 system-ui,sans-serif;color:#eef1f6}
.h-bar fieldset{border:0;margin:0;padding:0;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.h-bar legend{float:left;margin-right:6px;color:#9aa;font-weight:600}
.h-bar label{display:inline-flex;align-items:center;gap:3px;padding:3px 7px;border-radius:5px;background:#23262e;cursor:pointer}
.h-bar label:has(input:checked){background:#5b34d6;color:#fff}
.h-bar input[type=radio]{position:absolute;opacity:0;pointer-events:none}
.h-bar label:has(input:focus-visible){outline:2px solid #5ad8ff}
.h-belief{background:#1b1e25;color:#dfe3ea;padding:8px 14px;font:14px/1.4 system-ui,sans-serif;border-bottom:1px solid #333}
.h-belief b{color:#c9b8ff}
.h-stage{display:flex;justify-content:center;padding:20px 12px 60px}
.h-sizer{position:relative;flex:none}
.frame{width:1280px;height:800px;overflow:hidden;position:relative;background:var(--color-bg);color:var(--color-text);box-shadow:0 0 0 6px #111,0 20px 60px #0008;container-type:inline-size;font-family:var(--font-sans);font-size:var(--text-md);line-height:var(--leading);transform-origin:0 0}
.frame.w-proj{width:1920px;height:1080px}
.frame.w-phone{width:390px;height:844px;border-radius:28px;box-shadow:0 0 0 10px #111,0 20px 60px #0008}
body.bare .h-stage{padding:0}
body.bare .frame{box-shadow:none}
body.bare.w-phone .h-stage{padding:0;justify-content:flex-start}
body.bare.w-phone .frame{border-radius:0}

/* ============ SHARED (identical in every variant: app chrome the variants don't redesign) ============ */
.x-sel{width:auto;max-width:100%;min-height:var(--target-min);padding:0 var(--space-3);font-weight:700}
.x-ask{display:flex;gap:var(--space-2);min-width:0}
.x-ask .ly-input{min-height:var(--target-min);padding:0 var(--space-3)}
.x-live{display:inline-flex;align-items:center;gap:var(--space-2);font-family:var(--font-mono);font-size:var(--text-sm);white-space:nowrap}
.x-links{display:flex;gap:2px;flex-wrap:wrap;align-items:center}
.x-links__k{font-size:var(--text-xs);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--color-text-muted);padding:0 var(--space-1)}
.x-links .ly-btn{font-size:var(--text-sm);padding:0 var(--space-2)}
.x-ext{width:14px!important;height:14px!important}
.x-spark{display:block;color:var(--color-text-muted);overflow:visible;max-width:100%;height:auto}
.x-spark .x-thr{stroke:var(--color-border-strong);stroke-dasharray:3 3;stroke-width:1}
.x-spark .x-line{fill:none;stroke:var(--color-text);stroke-width:2;vector-effect:non-scaling-stroke}
.x-rr{display:grid;gap:var(--space-2)}
.x-rr__dest{display:grid;gap:2px;margin:0;font-size:var(--text-sm)}
.x-rr__dest div{display:flex;justify-content:space-between;gap:var(--space-3)}
.x-rr__dest dt{color:var(--color-text-muted)}
.x-rr__dest dd{margin:0;font-family:var(--font-mono);font-weight:700}
.x-scrim{position:absolute;inset:0;z-index:var(--z-sheet);background:var(--color-scrim);display:flex;justify-content:flex-end}
.x-dlg{width:min(100%,460px);height:100%;overflow:auto;background:var(--color-surface);color:var(--color-text);border-left:var(--border-w) solid var(--color-border);padding:var(--space-4) var(--space-4) var(--space-6)}
@container (max-width:699px){.x-scrim{align-items:flex-end}.x-dlg{width:100%;height:auto;max-height:88%;border-left:0;border-top:var(--border-w) solid var(--color-border);border-radius:var(--radius-lg) var(--radius-lg) 0 0}}
.x-dlg__hd{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);margin-bottom:var(--space-3)}
.x-dlg__hd h2{margin:0;font-size:var(--text-xl);line-height:1.2}
.x-opt{display:grid;grid-template-columns:auto 1fr;gap:var(--space-3);align-items:start;padding:var(--space-3);border:var(--border-w) solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);cursor:pointer}
.x-opt:has(input:checked){border-color:var(--color-accent);box-shadow:inset 3px 0 0 var(--color-accent)}
.x-opt input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--color-accent)}
.x-opt b{display:block}
.x-opt span{font-size:var(--text-sm);color:var(--color-text-muted)}
.x-msg{padding:var(--space-3);border-radius:var(--radius-md);background:var(--color-surface-2);border:var(--border-w) dashed var(--color-border-strong);font-size:var(--text-sm)}
.x-toastreg{position:absolute;top:var(--space-3);right:var(--space-3);left:var(--space-3);z-index:var(--z-toast);display:grid;justify-items:end;pointer-events:none}
.x-answer ol{margin:0;padding-left:1.2em;display:grid;gap:var(--space-2);font-size:var(--text-sm)}
.x-sim{font-family:var(--font-mono);letter-spacing:.08em}
.x-bar{display:block;height:1em}

/* ============ ROUND 2 SHARED: floor plan engine, live vs projected bars, day list ============ */
.x-plan{position:relative;display:grid;grid-template-columns:repeat(10,1fr);grid-auto-rows:minmax(var(--plan-row,30px),auto);gap:var(--space-2);padding:var(--space-3);border-radius:var(--radius-md);border:var(--border-w) solid var(--color-border);background:repeating-linear-gradient(0deg,var(--color-bg) 0 23px,var(--color-surface) 23px 24px)}
.x-plan--auto{grid-template-columns:repeat(auto-fill,minmax(var(--plan-min,150px),1fr));grid-auto-rows:auto}
.x-level h2{margin:0 0 var(--space-2);font-size:var(--text-sm);text-transform:uppercase;letter-spacing:.08em;color:var(--color-text-muted);display:flex;gap:var(--space-3);align-items:baseline}
.x-arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;overflow:visible}
.x-arrows path{fill:none;stroke:var(--color-accent);stroke-width:3;stroke-dasharray:8 5}
.x-arrows marker path{fill:var(--color-accent);stroke:none;stroke-dasharray:none}
.x-arrows text{fill:var(--color-text);font:700 13px var(--font-mono);paint-order:stroke;stroke:var(--color-bg);stroke-width:4px}
.x-lbar,.x-pbar{display:block;height:8px;border-radius:var(--radius-pill);border:var(--border-w) solid var(--color-border-strong);background:var(--color-surface-2);overflow:hidden}
.x-lbar i,.x-pbar i{display:block;height:100%;background:currentColor}
.x-pbar i{background:repeating-linear-gradient(135deg,currentColor 0 3px,transparent 3px 6px)}
.x-t--ok{color:var(--color-ok)}.x-t--warn{color:var(--color-warn)}.x-t--crit{color:var(--color-crit)}
.x-st{display:inline-flex;gap:4px;align-items:center;font-size:var(--text-xs);font-weight:700;white-space:nowrap}
.x-st .ly-icon{width:14px;height:14px}
.x-key{display:flex;gap:var(--space-4);flex-wrap:wrap;align-items:center;font-size:var(--text-xs);color:var(--color-text-muted)}
.x-key span{display:inline-flex;gap:6px;align-items:center}
.x-key .x-lbar,.x-key .x-pbar{width:28px;color:var(--color-text-muted)}
.x-day{list-style:none;margin:0;padding:0;display:grid;gap:var(--space-2)}
.x-day li{display:grid;grid-template-columns:52px 1fr;gap:var(--space-1) var(--space-3);padding:var(--space-2) var(--space-3);border-radius:var(--radius-sm);border:var(--border-w) solid var(--color-border);background:var(--color-surface)}
.x-day li[data-now]{border-color:var(--color-accent);box-shadow:inset 3px 0 0 var(--color-accent)}
.x-day time{font-family:var(--font-mono);font-weight:700;font-size:var(--text-sm);grid-row:1/4}
.x-day b{font-size:var(--text-sm);line-height:1.3}
.x-day .x-num{display:flex;justify-content:space-between;gap:var(--space-2);font-family:var(--font-mono);font-size:var(--text-xs)}
.x-clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.x-hd{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) var(--space-4);border-bottom:var(--border-w) solid var(--color-border);background:var(--color-surface);flex-wrap:wrap}
.x-hd h1{margin:0;font-size:var(--text-lg)}
.x-hd .x-ask{flex:1;min-width:200px;max-width:460px;margin-left:auto}
.x-alerts{display:grid;gap:var(--space-3);align-content:start}
.x-alerts h2{margin:0;font-size:var(--text-lg);display:flex;justify-content:space-between;align-items:baseline}
.x-al{display:grid;gap:var(--space-2);padding:var(--space-3)}
.x-al h3{margin:0;font-size:var(--text-md);line-height:1.3}
.x-al p{margin:0;font-size:var(--text-sm);color:var(--color-text-muted)}
.x-al--crit{border-color:var(--color-crit);border-left-width:4px}
.x-al--warn{border-color:var(--color-warn);border-left-width:4px;border-left-style:dashed}
.x-al--fc{border-color:var(--color-border-strong);border-left-width:4px;border-left-style:dashed;background:var(--color-surface)}
.x-al__row{display:flex;justify-content:space-between;align-items:center;gap:var(--space-2);flex-wrap:wrap;font-family:var(--font-mono);font-size:var(--text-xs);color:var(--color-text-muted)}
.x-hd~* .x-links,aside .x-links{flex-wrap:nowrap}
aside .x-links .ly-btn{padding:0 6px}
.x-acts{display:flex;gap:var(--space-2);flex-wrap:wrap}
.x-acts .ly-btn{min-height:40px;font-size:var(--text-sm);padding:0 var(--space-3)}
@container (max-width:699px){.x-hd .x-ask{max-width:none;flex-basis:100%}.x-plan{grid-template-columns:1fr 1fr}.x-plan>[data-pin]{grid-area:auto!important}}

/* ============ D1: Rich tiles (dt-) ============ */
.dt{height:100%;display:grid;grid-template-columns:1fr 330px;grid-template-rows:auto auto 1fr}
.dt-ban,.dt>.x-hd{grid-column:1/-1}
.dt-map{overflow:auto;padding:var(--space-3) var(--space-4);display:grid;gap:var(--space-3);align-content:start;--plan-row:28px}
.dt-room{position:relative;z-index:1;display:flex;flex-direction:column;gap:3px;padding:var(--space-2);text-align:left;border-radius:var(--radius-sm);border:var(--border-w) solid var(--color-border-strong);background:var(--color-surface);color:var(--color-text);cursor:pointer;min-width:0;font-size:var(--text-xs);line-height:1.3}
.dt-room--warn{border:3px dashed var(--color-warn)}
.dt-room--crit{border:3px solid var(--color-crit);background:var(--color-crit-bg)}
.dt-hd{display:flex;justify-content:space-between;gap:var(--space-2);align-items:baseline}
.dt-hd b{font-size:var(--text-sm)}
.dt-sec{display:grid;gap:2px;padding-top:4px;border-top:var(--border-w) solid var(--color-border)}
.dt-k{display:flex;justify-content:space-between;gap:4px;color:var(--color-text-muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:11px}
.dt-t{font-weight:700}
.dt-n{font-family:var(--font-mono);display:flex;justify-content:space-between;gap:4px}
.dt-in{font-family:var(--font-mono);font-weight:700;color:var(--color-accent)}
.dt-side{overflow:auto;border-left:var(--border-w) solid var(--color-border);padding:var(--space-3);background:var(--color-bg)}
.dt[data-stale] .dt-room{border-style:dotted}
@container (min-width:1600px){.dt{grid-template-columns:1fr 420px}.dt-room{font-size:var(--text-sm)}.dt-hd b{font-size:var(--text-md)}.dt-k{font-size:var(--text-xs)}}
@container (max-width:699px){.dt{display:block;overflow:auto}.dt-side{border-left:0;border-top:var(--border-w) solid var(--color-border)}.dt-map{overflow:visible}}

/* ============ D2: Time scrubber (ds-) ============ */
.ds{height:100%;display:grid;grid-template-columns:1fr 340px;grid-template-rows:auto auto auto 1fr}
.ds-ban,.ds>.x-hd{grid-column:1/-1}
.ds-slots{grid-column:1/-1;display:flex;gap:var(--space-3);align-items:center;padding:var(--space-2) var(--space-4);border-bottom:var(--border-w) solid var(--color-border);margin:0;border-left:0;border-right:0;border-top:0;flex-wrap:wrap}
.ds-slots legend{float:left;font-weight:700;margin-right:var(--space-2);padding:0}
.ds-seg{display:flex;border:var(--border-w) solid var(--color-border-strong);border-radius:var(--radius-md);overflow:hidden}
.ds-seg label{display:grid;gap:0;padding:6px var(--space-4);min-height:var(--target-min);cursor:pointer;border-left:var(--border-w) solid var(--color-border);min-width:120px}
.ds-seg label:first-child{border-left:0}
.ds-seg input{position:absolute;opacity:0;pointer-events:none}
.ds-seg label:has(input:checked){background:var(--color-accent);color:var(--color-on-accent)}
.ds-seg label:has(input:focus-visible){outline:3px solid var(--color-focus);outline-offset:-3px}
.ds-seg b{font-family:var(--font-mono)}
.ds-seg small{display:inline-flex;gap:4px;align-items:center;font-size:var(--text-xs);font-weight:700}
.ds-seg small .ly-icon{width:13px;height:13px}
.ds-cap{font-size:var(--text-sm);color:var(--color-text-muted)}
.ds-map{overflow:auto;padding:var(--space-3) var(--space-4);display:grid;gap:var(--space-3);align-content:start}
.ds-room{position:relative;z-index:1;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:var(--space-2) var(--space-3);text-align:left;border-radius:var(--radius-sm);border:var(--border-w) solid var(--color-border-strong);background:var(--color-surface);color:var(--color-text);cursor:pointer;min-height:84px;min-width:0}
.ds-room b{font-size:var(--text-md);line-height:1.2}
.ds-room .ds-t{font-size:var(--text-xs);color:var(--color-text-muted);width:100%}
.ds-room .ds-n{font-family:var(--font-mono);font-size:var(--text-sm);margin-top:auto}
.ds-room .x-lbar,.ds-room .x-pbar{width:100%}
.ds-room--warn{border:3px dashed var(--color-warn)}
.ds-room--crit{border:3px solid var(--color-crit);background:var(--color-crit-bg)}
.ds-map[data-fc] .x-plan{background:repeating-linear-gradient(135deg,var(--color-bg) 0 14px,var(--color-surface) 14px 16px)}
.ds-side{overflow:auto;border-left:var(--border-w) solid var(--color-border);padding:var(--space-3);background:var(--color-bg)}
.ds[data-stale] .ds-room{border-style:dotted}
@container (min-width:1600px){.ds{grid-template-columns:1fr 440px}.ds-room b{font-size:var(--text-lg)}.ds-room .ds-t{font-size:var(--text-sm)}}
@container (max-width:699px){.ds{display:block;overflow:auto}.ds-seg{width:100%}.ds-seg label{min-width:0;flex:1;padding:6px var(--space-2)}.ds-side{border-left:0;border-top:var(--border-w) solid var(--color-border)}.ds-map{overflow:visible}}

/* ============ D3: Map + room inspector (di-) ============ */
.di{height:100%;display:grid;grid-template-columns:1fr 400px;grid-template-rows:auto auto 1fr}
.di-ban,.di>.x-hd{grid-column:1/-1}
.di-map{overflow:auto;padding:var(--space-3) var(--space-4);display:grid;gap:var(--space-3);align-content:start}
.di-room{position:relative;z-index:1;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:var(--space-2) var(--space-3);text-align:left;border-radius:var(--radius-sm);border:var(--border-w) solid var(--color-border-strong);background:var(--color-surface);color:var(--color-text);cursor:pointer;min-height:76px;min-width:0}
.di-room b{font-size:var(--text-md);line-height:1.2}
.di-room .di-n{font-family:var(--font-mono);font-size:var(--text-sm);margin-top:auto}
.di-room .x-lbar{width:100%}
.di-room--warn{border:3px dashed var(--color-warn)}
.di-room--crit{border:3px solid var(--color-crit);background:var(--color-crit-bg)}
.di-room[aria-pressed=true]{outline:3px solid var(--color-accent);outline-offset:2px}
.di-next{display:inline-flex;gap:3px;align-items:center;font-size:11px;font-weight:700;padding:1px 6px;border-radius:var(--radius-pill);border:var(--border-w) dashed currentColor;background:var(--color-bg)}
.di-next .ly-icon{width:12px;height:12px}
.di-in{font-family:var(--font-mono);font-size:var(--text-xs);font-weight:700;color:var(--color-accent)}
.di-side{overflow:auto;border-left:var(--border-w) solid var(--color-border);background:var(--color-bg);display:grid;align-content:start}
.di-insp{padding:var(--space-4);border-bottom:var(--border-w) solid var(--color-border);background:var(--color-surface);display:grid;gap:var(--space-3)}
.di-insp h2{margin:0;font-size:var(--text-xl);line-height:1.2;display:flex;justify-content:space-between;gap:var(--space-2);align-items:center}
.di-sub{margin:0;font-size:var(--text-sm);color:var(--color-text-muted);font-family:var(--font-mono)}
.di-side .x-alerts{padding:var(--space-4)}
.di[data-stale] .di-room{border-style:dotted}
@container (min-width:1600px){.di{grid-template-columns:1fr 520px}.di-room b{font-size:var(--text-lg)}}
@container (max-width:699px){.di{display:block;overflow:auto}.di-side{border-left:0;border-top:var(--border-w) solid var(--color-border)}.di-map{overflow:visible}}

/* ============ D4: Room x time grid + minimap (dg-) ============ */
.dg{height:100%;display:grid;grid-template-columns:1fr 340px;grid-template-rows:auto auto 1fr}
.dg-ban,.dg>.x-hd{grid-column:1/-1}
.dg-wrap{overflow:auto}
.dg-t{width:100%;border-collapse:separate;border-spacing:0;font-size:var(--text-xs);table-layout:fixed}
.dg-t col.dg-c0{width:132px}
.dg-t thead th{position:sticky;top:0;z-index:3;background:var(--color-surface-2);padding:var(--space-2);text-align:left;border-bottom:var(--border-w) solid var(--color-border-strong);font-family:var(--font-mono);font-size:var(--text-sm);white-space:nowrap}
.dg-t thead th[data-now]{color:var(--color-accent)}
.dg-t th[scope=row]{position:sticky;left:0;z-index:1;background:var(--color-bg);text-align:left;padding:var(--space-2);border-bottom:var(--border-w) solid var(--color-border);vertical-align:top}
.dg-t th[scope=row] b{display:block;font-size:var(--text-sm)}
.dg-t th[scope=row] span{font-family:var(--font-mono);color:var(--color-text-muted);font-weight:400}
.dg-lvl th{position:sticky;left:0;background:var(--color-bg);text-align:left;padding:var(--space-3) var(--space-2) var(--space-1);text-transform:uppercase;letter-spacing:.08em;color:var(--color-text-muted);font-size:var(--text-xs)}
.dg-t td{padding:var(--space-1);border-bottom:var(--border-w) solid var(--color-border);vertical-align:top}
.dg-cell{display:grid;gap:3px;padding:var(--space-2);border-radius:var(--radius-sm);border:var(--border-w) solid var(--color-border);background:var(--color-surface);height:100%}
.dg-cell[data-now]{box-shadow:inset 0 3px 0 var(--color-accent)}
.dg-cell--warn{border:2px dashed var(--color-warn)}
.dg-cell--crit{border:2px solid var(--color-crit);background:var(--color-crit-bg)}
.dg-cell .dg-n{display:flex;flex-wrap:wrap;justify-content:space-between;gap:0 4px;font-family:var(--font-mono)}
.dg-cell{min-width:0}
.dg-cell b{font-size:var(--text-xs);line-height:1.3}
.dg-side{overflow:auto;border-left:var(--border-w) solid var(--color-border);padding:var(--space-3);background:var(--color-bg);display:grid;gap:var(--space-3);align-content:start}
.dg-side h2{margin:0;font-size:var(--text-md)}
.dg-mini{--plan-row:14px}
.dg-mini .x-plan{padding:var(--space-2);gap:4px}
.dg-mini .x-level h2{font-size:10px;margin-bottom:2px}
.dg-mr{position:relative;z-index:1;display:flex;flex-direction:column;gap:0;padding:2px 4px;font-size:10px;line-height:1.2;text-align:left;border-radius:3px;border:var(--border-w) solid var(--color-border-strong);background:var(--color-surface);color:var(--color-text);cursor:pointer;min-width:0;overflow:hidden}
.dg-mr .ly-icon{width:11px;height:11px}
.dg-mr--warn{border:2px dashed var(--color-warn)}
.dg-mr--crit{border:2px solid var(--color-crit);background:var(--color-crit-bg)}
.dg-mini .x-arrows path{stroke-width:2}
.dg-mini .x-arrows text{font-size:10px}
.dg[data-stale] .dg-cell[data-now]{border-style:dotted}
@container (min-width:1600px){.dg{grid-template-columns:1fr 440px}.dg-t{font-size:var(--text-sm)}.dg-cell b{font-size:var(--text-sm)}}
@container (max-width:699px){.dg-t{width:760px}.dg{display:block;overflow:auto}.dg-side{border-left:0;border-top:var(--border-w) solid var(--color-border)}.dg-wrap{overflow-x:auto}}
</style>
</head>
<body>
<form class="h-bar" id="ctl" aria-label="Prototype controls">
  <fieldset><legend>Variant</legend>
    <label><input type="radio" name="v" value="d1" checked>D1 Rich tiles</label>
    <label><input type="radio" name="v" value="d2">D2 Time scrubber</label>
    <label><input type="radio" name="v" value="d3">D3 Map + inspector</label>
    <label><input type="radio" name="v" value="d4">D4 Room × time grid</label>
  </fieldset>
  <fieldset><legend>Event</legend>
    <label><input type="radio" name="ev" value="kubecon" checked>KubeCon (12 rooms)</label>
    <label><input type="radio" name="ev" value="cnh">CNH Demos (2 rooms)</label>
  </fieldset>
  <fieldset><legend>State</legend>
    <label><input type="radio" name="s" value="live" checked>Live</label>
    <label><input type="radio" name="s" value="incident">Incident</label>
    <label><input type="radio" name="s" value="loading">Loading</label>
    <label><input type="radio" name="s" value="empty">Not started</label>
    <label><input type="radio" name="s" value="error">Error</label>
    <label><input type="radio" name="s" value="lots">Too much</label>
  </fieldset>
  <fieldset><legend>Width</legend>
    <label><input type="radio" name="w" value="laptop" checked>Laptop 1280</label>
    <label><input type="radio" name="w" value="proj">Projector 1920</label>
    <label><input type="radio" name="w" value="phone">Phone 390</label>
  </fieldset>
  <fieldset><legend>Theme</legend>
    <label><input type="radio" name="t" value="dark" checked>Dark</label>
    <label><input type="radio" name="t" value="light">Light</label>
    <label><input type="radio" name="t" value="contrast">High contrast</label>
  </fieldset>
  <fieldset><legend>Crowd</legend>
    <label><input type="checkbox" name="sim">Simulated</label>
    <label><input type="checkbox" name="rm">Reduce motion</label>
  </fieldset>
</form>
<div class="h-belief" id="belief"></div>
<div class="h-stage" id="stage"><div class="h-sizer" id="sizer"><div class="frame" id="frame"></div></div></div>

<script>
/* Round 2. Round 1 picked D (floor plan). Live question: where do now / next / projected attendance live? */
const BELIEFS={
 d1:"<b>D1 · Rich tiles.</b> Every room tile carries Now (title, until when, checked in) and Next (title, start, projected vs seats). Bet: organizers want it all without clicking, so the map becomes the schedule.",
 d2:"<b>D2 · Time scrubber.</b> Tiles stay compact; a slot control (Now · 11:15 · 13:00 · 14:00) re-plots the whole floor for that slot with its sessions and projected attendance. Bet: the question is \"where does it overflow next\", answered by stepping through time.",
 d3:"<b>D3 · Map + room inspector.</b> The map stays as calm as round 1, plus a small \"Next: overflow risk\" marker. Selecting a room docks its whole day (now, next, later, each projected) beside the map. Bet: the map is for spotting; the inspector is for deciding.",
 d4:"<b>D4 · Room × time grid + minimap.</b> Rooms are rows, slots are columns; the floor plan shrinks to a minimap that only shows reroute paths. Bet: once time matters, a schedule grid beats a map. (Pushback: crosses the map-first pick.)"
};
const PATHS={
 people:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2|M9 3a4 4 0 1 0 0 8a4 4 0 1 0 0-8|M22 21v-2a4 4 0 0 0-3-3.9|M16 3.1a4 4 0 0 1 0 7.8',
 offline:'m2 2 20 20|M8.5 16.5a5 5 0 0 1 7 0|M2 8.8a15 15 0 0 1 4.2-2.7|M10.7 5.1a15 15 0 0 1 11.3 3.7|M5 12.9a10 10 0 0 1 5.2-2.8|M12 20h.01',
 check:'M20 6 9 17l-5-5',
 warn:'M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z|M12 9v4|M12 17h.01',
 crit:'M7.9 2h8.2L22 7.9v8.2L16.1 22H7.9L2 16.1V7.9z|M15 9l-6 6|m9 9 6 6',
 info:'M12 2a10 10 0 1 0 0 20a10 10 0 1 0 0-20|M12 16v-4|M12 8h.01',
 route:'M6 19a2 2 0 1 0 0-4a2 2 0 1 0 0 4|M18 9a2 2 0 1 0 0-4a2 2 0 1 0 0 4|M8 17h7a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h7',
 search:'M11 3a8 8 0 1 0 0 16a8 8 0 1 0 0-16|m21 21-4.3-4.3',
 close:'M18 6 6 18|m6 6 12 12',
 down:'M12 5v14|m19 12-7 7-7-7',

  return `<button type="button" class="dt-room dt-room--${live?r.state:'ok'}" data-room="${r.id}" data-pin="${r.id}" ${g}>
  <span class="dt-hd"><b>${esc(r.name)}</b>${live?st(r.state,SLO_LABEL[r.state]):`<span class="ly-muted" style="font-family:var(--font-mono)">${fmt(r.cap)} seats</span>`}</span>
  <span class="dt-sec"><span class="dt-k"><span>${live?`Now · until ${now.ends}`:`First · ${now.time}`}</span></span><span class="dt-t x-clamp">${esc(now.title)}</span>${live?lbar(r.ratio):pbar(now.ratio)}<span class="dt-n"><span>${live?`${fmt(r.occ)}/${fmt(r.cap)} here`:`~${fmt(now.exp)}/${fmt(r.cap)}`}</span>${live?'':st(now.fc,FC_LABEL[now.fc])}</span>${inc[r.id]?`<span class="dt-in">${ic('route','x-ext')} +${inc[r.id]} rerouted in</span>`:''}${rr?`<span class="dt-in">${ic('route','x-ext')} reroute: ${rr.acc}/${rr.sent} accepted</span>`:''}</span>
  ${live?`<span class="dt-sec"><span class="dt-k"><span>Next · ${nx.time}</span>${st(nx.fc,FC_LABEL[nx.fc])}</span><span class="dt-t x-clamp">${esc(nx.title)}</span>${pbar(nx.ratio)}<span class="dt-n"><span>~${fmt(nx.exp)}/${fmt(r.cap)}</span><span class="ly-muted">${fmt(nx.planned)} planned</span></span></span>`:''}</button>`};
 return `<div class="dt" ${S.s==='error'?'data-stale':''}><div class="dt-ban">${banners()}</div>${header('Lanyard ops · floor','d1')}<main class="dt-map" aria-label="Venue map">${key()}${planHTML(cell)}</main><aside class="dt-side">${links()}${alertList(S.s==='lots'?6:99)}</aside></div>`}

/* ---------------- D2: Time scrubber ---------------- */
function vD2(){const slot=+S.slot;const live=S.s!=='empty';const fcView=slot>0||!live;const inc=incomingMap();
 const counts=[0,1,2,3].map(k=>k===0&&live?rooms().filter(r=>r.state!=='ok').length:forecasts(k).length);
 const slots=`<fieldset class="ds-slots"><legend>Show the floor at</legend><div class="ds-seg">${SLOTS[ev()].map((t,k)=>`<label><input type="radio" name="slot" value="${k}" ${k===slot?'checked':''} data-slot="${k}"><b>${k===0?(live?'Now '+NOW[ev()]:'First '+t):t}</b><small>${counts[k]?`${ic('warn')}${counts[k]} ${k===0&&live?'not healthy':'at risk'}`:`${ic('check')}all fit`}</small></label>`).join('')}</div><span class="ds-cap">${fcView?`Projected from attendee schedules: planned × ${Math.round(SHOW*100)}% show-up rate today.`:'Live check-ins. Pick a later slot to see projected attendance.'}</span></fieldset>`;
 const cell=(r,g)=>{if(S.s==='loading')return `<div class="ds-room" ${g}>${sk(14,'60%')}${sk(10,'80%')}${sk(8)}</div>`;
  const s=r.sess[slot];const isLive=slot===0&&live;const ratio=isLive?r.ratio:s.ratio;const tone=toneOf(ratio);
  return `<button type="button" class="ds-room ds-room--${tone}" data-room="${r.id}" data-pin="${r.id}" ${g}><b>${esc(r.name)}</b><span class="ds-t x-clamp">${esc(s.title)}</span>${isLive?st(tone,SLO_LABEL[tone]):st(tone,FC_LABEL[tone])}<span class="ds-n">${isLive?`${fmt(r.occ)}/${fmt(r.cap)} here`:`~${fmt(s.exp)}/${fmt(r.cap)} expected`}</span>${isLive?lbar(ratio):pbar(ratio)}${isLive&&inc[r.id]?`<span class="dt-in" style="font-family:var(--font-mono);font-size:var(--text-xs);font-weight:700;color:var(--color-accent)">+${inc[r.id]} rerouted in</span>`:''}</button>`};
 const side=fcView?`<section class="x-alerts"><h2>At ${SLOTS[ev()][slot]} <span class="ly-muted" style="font-size:var(--text-sm);font-weight:400">${counts[slot]} at risk</span></h2>${forecasts(slot).length?alerts().filter(a=>a.kind==='fc'&&a.slot===slot).map(a=>alertCard(a,{v:true})).join(''):'<p class="ly-muted" style="margin:0">Every session in this slot fits its room.</p>'}</section>`:alertList(S.s==='lots'?6:99);
 return `<div class="ds" ${S.s==='error'?'data-stale':''}><div class="ds-ban">${banners()}</div>${header('Lanyard ops · floor','d2')}${slots}<main class="ds-map" ${fcView?'data-fc':''} aria-label="Venue map at ${SLOTS[ev()][slot]}">${key()}${planHTML(cell)}</main><aside class="ds-side">${links()}${side}</aside></div>`}

/* ---------------- D3: Map + inspector ---------------- */
function vD3(){const live=S.s!=='empty';const inc=incomingMap();
 const def=(sorted().find(r=>r.state!=='ok')||(forecasts()[0]||{}).r||rooms()[0]);const sel=byId(S.sel)||def;
 const cell=(r,g)=>{if(S.s==='loading')return `<div class="di-room" ${g}>${sk(14,'60%')}${sk(10,'40%')}</div>`;
  const nx=r.sess[live?1:0];const tone=live?r.state:'ok';const nfc=nx.fc;
  return `<button type="button" class="di-room di-room--${tone}" data-sel="${r.id}" data-pin="${r.id}" aria-pressed="${sel&&sel.id===r.id}" ${g}><b>${esc(r.name)}</b>${live?st(tone,SLO_LABEL[tone]):`<span class="ly-muted" style="font-size:var(--text-xs)">${fmt(r.cap)} seats</span>`}${nfc!=='ok'?`<span class="di-next x-t--${nfc}">${ic('catchup')}${live?'Next':'First'} ${nx.time}: ${FC_LABEL[nfc]}</span>`:''}<span class="di-n">${live?`${fmt(r.occ)}/${fmt(r.cap)} · ${Math.round(r.ratio*100)}%`:''}</span>${live?lbar(r.ratio):''}${inc[r.id]?`<span class="di-in">+${inc[r.id]} rerouted in</span>`:''}</button>`};
 let insp;if(S.s==='loading')insp=`<div class="di-insp">${sk(28,'50%')}${sk(60)}${sk(60)}${sk(60)}</div>`;
 else{const rr=reroute(sel.id);const fcs=sel.sess.filter(s=>(s.k>0||!live)&&s.fc!=='ok');const sw=fcs.map(s=>SWAP[`${sel.id}:${s.k}`]).find(Boolean);
  insp=`<section class="di-insp" aria-label="Room inspector: ${esc(sel.name)}"><h2>${esc(sel.name)}${live?pill(sel.state,SLO_LABEL[sel.state]):''}</h2><p class="di-sub">${fmt(sel.cap)} seats · ${LEVELS[ev()][sel.level]||'Level '+sel.level}${live?` · burn ${sel.burn.toFixed(1)}×`:''}</p>${dayList(sel)}${rr?`<div>${rrBlock(sel,rr)}</div>`:''}${sw?`<p class="ly-muted" style="margin:0;font-size:var(--text-sm)">${ic('catchup','x-ext')} ${esc(sw[1])}</p>`:''}<div class="x-acts">${live&&sel.state!=='ok'&&!rr?`<button type="button" class="ly-btn ly-btn--primary" data-dlg="reroute:${sel.id}">${ic('route')}Reroute now</button>`:''}${sw?`<button type="button" class="ly-btn" data-act="swap" data-what="${esc(sel.name)}">Swap rooms…</button>`:''}${fcs.length?`<button type="button" class="ly-btn ly-btn--ghost" data-act="announce" data-what="${esc(sel.name)}">Pre-announce</button>`:''}<a class="ly-btn ly-btn--ghost" href="#dash0-slos" data-act="dash0" data-what="SLO">SLO${ic('ext','x-ext')}</a></div></section>`}
 return `<div class="di" ${S.s==='error'?'data-stale':''}><div class="di-ban">${banners()}</div>${header('Lanyard ops · floor','d3')}<main class="di-map" aria-label="Venue map. Select a room to inspect its day.">${key()}${planHTML(cell)}</main><aside class="di-side">${insp}<div style="padding:var(--space-3) var(--space-4) 0">${links()}</div>${alertList(S.s==='lots'?5:99)}</aside></div>`}

/* ---------------- D4: Room x time grid + minimap ---------------- */
function vD4(){const live=S.s!=='empty';const L=LEVELS[ev()];const rs=rooms();
 const head=`<tr><th scope="col">Room</th>${SLOTS[ev()].map((t,k)=>`<th scope="col" ${k===0&&live?'data-now':''}>${k===0&&live?`Now · ${t}`:t}</th>`).join('')}</tr>`;
 let body='';
 if(S.s==='loading')body=Array.from({length:8},()=>`<tr><th scope="row">${sk(14,'70%')}</th>${'<td>'+sk(52)+'</td>'.repeat(1)}${('<td>'+sk(52)+'</td>').repeat(3)}</tr>`).join('');
 else for(const l of Object.keys(L)){const lr=rs.filter(r=>r.level==l);if(!lr.length)continue;body+=`<tr class="dg-lvl"><th colspan="5" scope="rowgroup">${L[l]}</th></tr>`;
  for(const r of lr){body+=`<tr><th scope="row"><b>${esc(r.name)}</b><span>${fmt(r.cap)} seats</span>${live?`<br>${st(r.state,SLO_LABEL[r.state])}`:''}</th>${r.sess.map(s=>{const isNow=s.k===0&&live;const ratio=isNow?r.ratio:s.ratio;const tone=toneOf(ratio);const rr=isNow&&reroute(r.id);
   return `<td><div class="dg-cell dg-cell--${tone}" ${isNow?'data-now':''}><b class="x-clamp">${esc(s.title)}</b>${isNow?lbar(ratio):pbar(ratio)}<span class="dg-n"><span>${isNow?`${fmt(r.occ)}/${fmt(r.cap)}`:`~${fmt(s.exp)}/${fmt(r.cap)}`}</span>${isNow?st(tone,SLO_LABEL[tone]):st(tone,FC_LABEL[tone])}</span>${rr?`<span class="dt-in" style="font-family:var(--font-mono);font-weight:700;color:var(--color-accent)">${ic('route','x-ext')} ${rr.acc}/${rr.sent} rerouted</span>`:''}</div></td>`}).join('')}</tr>`}}
 const mini=S.s==='loading'?sk(160):planHTML((r,g)=>`<button type="button" class="dg-mr dg-mr--${live?r.state:'ok'}" data-room="${r.id}" data-pin="${r.id}" ${g} aria-label="${esc(r.name)}, ${live?SLO_LABEL[r.state]:'not started'}"><span style="display:flex;gap:2px;align-items:center">${ic(TONE_ICON[live?r.state:'ok'])}<b>${esc(r.name.replace(/^Room /,''))}</b></span></button>`);
 return `<div class="dg" ${S.s==='error'?'data-stale':''}><div class="dg-ban">${banners()}</div>${header('Lanyard ops · schedule','d4')}<main class="dg-wrap" aria-label="Rooms by time slot"><div style="padding:var(--space-2) var(--space-3)">${key()}</div><table class="dg-t"><caption class="ly-sr-only">Rooms by time slot: live now, projected later</caption><colgroup><col class="dg-c0"><col><col><col><col></colgroup><thead>${head}</thead><tbody>${body}</tbody></table></main><aside class="dg-side"><h2>Floor</h2><div class="dg-mini">${mini}</div>${links()}${alertList(S.s==='lots'?5:6)}</aside></div>`}

/* ---------------- Dialogs ---------------- */
function dialog(){if(!S.dlg)return'';const [kind,id]=S.dlg.split(':');let t='',body='';
 if(kind==='reroute'){const r=byId(id);const sug=(SUGG[id]||SUGG.r255b).map(([d,why])=>({r:byId(d),why})).filter(x=>x.r);const notify=Math.round(r.occ*.79);t=`Reroute ${esc(r.name)}`;
  body=`<p class="ly-muted" style="margin-top:0">${fmt(r.occ)} of ${fmt(r.cap)} seats taken (${Math.round(r.ratio*100)}%). Suggest these sessions to the ${notify} attendees checked in here. Picked by topic similarity, free seats now and at the next slot, and walking time.</p><form data-form="reroute" data-room="${id}" style="display:grid;gap:var(--space-3)"><fieldset style="border:0;margin:0;padding:0;display:grid;gap:var(--space-2)"><legend style="font-weight:700;margin-bottom:var(--space-2)">Suggest</legend>${sug.map((s,i)=>`<label class="x-opt"><input type="checkbox" name="d" value="${s.r.id}" ${i<2?'checked':''}><span style="color:inherit;font-size:inherit"><b>${esc(s.r.name)} · ${fmt(s.r.cap-s.r.occ)} seats free</b><span>${esc(s.r.sess[0].title)}</span><br><span>${esc(WALK[s.r.id]||'nearby')} · ${esc(s.why)}</span>${s.r.sess[1].fc!=='ok'?`<br><span>${ic('warn','x-ext')} Next slot here is ${FC_LABEL[s.r.sess[1].fc].toLowerCase()}: ~${fmt(s.r.sess[1].exp)} expected</span>`:''}</span></label>`).join('')}</fieldset><div><b style="display:block;margin-bottom:var(--space-1)">What attendees see</b><div class="x-msg">${esc(r.name)} is full. The closest talk with seats is <b>${esc(sug[0].r.sess[0].title)}</b> in ${esc(sug[0].r.name)}, ${esc(WALK[sug[0].r.id]||'nearby')}.</div></div><button class="ly-btn ly-btn--primary ly-btn--lg" type="submit">${ic('route')}Publish to ${notify} attendees</button><button type="button" class="ly-btn ly-btn--ghost" data-act="close">Cancel</button></form>`}
 if(kind==='ask'){t='Ask the conference';body=`<p class="ly-muted" style="margin-top:0">“Who covered eBPF overhead today?” Answered from today's transcripts and questions only.</p><div class="ly-card"><p style="margin-top:0"><b>Three sessions covered it.</b> Priya Raman measured under 2% CPU with about 40 Tetragon policies. Her Part 2 is at 11:15 in Room 256, and 218 people have it in their schedule.</p></div>`}
 if(kind==='room'){const r=byId(id);const rr=reroute(id);const live=S.s!=='empty';t=esc(r.name);body=`<p style="margin-top:0">${live?pill(r.state,SLO_LABEL[r.state]):''} <span class="ly-muted">${fmt(r.cap)} seats · ${LEVELS[ev()][r.level]||'Level '+r.level}</span></p>${dayList(r)}${rr?`<h3>Reroute in flight</h3>${rrBlock(r,rr)}`:''}<div class="x-acts" style="margin-top:var(--space-4)">${live&&r.state!=='ok'&&!rr?`<button type="button" class="ly-btn ly-btn--primary" data-dlg="reroute:${r.id}">${ic('route')}Reroute</button>`:''}${links(['SLOs','Agent0'])}</div>`}
 return `<div class="x-scrim" data-act="close"><div class="x-dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-t"><div class="x-dlg__hd"><h2 id="dlg-t">${t}</h2><button type="button" class="ly-btn ly-btn--ghost ly-btn--icon" data-act="close" aria-label="Close">${ic('close')}</button></div>${body}</div></div>`}
const toast=()=>S.toast?`<div class="x-toastreg" aria-live="polite"><div class="ly-toast" role="status">${ic('check')}${S.toast}</div></div>`:'<div class="x-toastreg" aria-live="polite"></div>';

/* ---------------- Render + harness ---------------- */
const V={d1:vD1,d2:vD2,d3:vD3,d4:vD4};
const frame=document.getElementById('frame'),sizer=document.getElementById('sizer'),stage=document.getElementById('stage');
function fit(){const W={laptop:[1280,800],proj:[1920,1080],phone:[390,844]}[S.w];let sc=1;if(!S.bare&&S.w==='proj')sc=Math.min(1,(stage.clientWidth-24)/W[0]);frame.style.transform=sc<1?`scale(${sc})`:'';sizer.style.width=W[0]*sc+'px';sizer.style.height=W[1]*sc+'px'}
let lastOpener=null;
function render(){const r=document.documentElement;r.dataset.theme=S.t;r.dataset.motion=S.rm||S.bare?'reduce':'full';document.body.className=(S.bare?'bare ':'')+'w-'+S.w;
 if(!V[S.v])S.v='d1';frame.className='frame w-'+S.w;document.getElementById('belief').innerHTML=BELIEFS[S.v];_rk='';
 const hadDlg=!!frame.querySelector('.x-dlg');frame.innerHTML=V[S.v]()+dialog()+toast();fit();requestAnimationFrame(drawArrows);
 const dlg=frame.querySelector('.x-dlg');if(dlg&&!hadDlg&&!S.bare){const f=dlg.querySelector('input,button.ly-btn--primary,button');f&&f.focus()}}
function syncCtl(){const c=document.getElementById('ctl');for(const k of ['v','s','w','t','ev']){const i=c.querySelector(`input[name=${k}][value="${S[k]}"]`);if(i)i.checked=true}c.sim.checked=S.sim;c.rm.checked=S.rm}
document.getElementById('ctl').addEventListener('change',e=>{const f=e.target;S[f.name]=f.type==='checkbox'?f.checked:f.value;S.dlg=null;S.sel=null;S.slot=0;render()});
function say(t,ms=3200){S.toast=t;render();clearTimeout(say.t);say.t=setTimeout(()=>{S.toast=null;render()},ms)}
frame.addEventListener('change',e=>{if(e.target.dataset.slot!==undefined){S.slot=+e.target.value;render();frame.querySelector(`input[data-slot="${S.slot}"]`)?.focus()}if(e.target.dataset.ev!==undefined){S.ev=e.target.value;S.sel=null;syncCtl();render()}});
frame.addEventListener('click',e=>{const b=e.target.closest('[data-act],[data-dlg],[data-room],[data-sel]');if(!b)return;const d=b.dataset;
 if(d.act==='close'){if(e.target!==b&&b.classList.contains('x-scrim'))return;S.dlg=null;render();lastOpener&&frame.querySelector(lastOpener)?.focus();return}
 if(d.act==='sim'){S.sim=!S.sim;syncCtl();say(S.sim?'Crowd simulator started. The board is labelled SIMULATED.':'Crowd simulator stopped.');return}
 if(d.act==='retry'){say('Reconnected. Live values resumed.');return}
 if(d.act==='dash0'){e.preventDefault();say(`Prototype: opens Dash0 ${d.what} in a new tab.`);return}
 if(d.act==='swap'){say(`Prototype: opens a room-swap draft for ${d.what}. Attendees with it in their schedule get the new room.`);return}
 if(d.act==='announce'){say(`Prototype: pre-announces the overflow plan to everyone with ${d.what}'s next session in their schedule.`);return}
 if(d.sel){S.sel=d.sel;render();frame.querySelector(`[data-sel="${d.sel}"]`)?.focus();return}
 if(d.dlg){lastOpener=`[data-dlg="${d.dlg}"]`;S.dlg=d.dlg}else if(d.room){lastOpener=`[data-room="${d.room}"]`;S.dlg='room:'+d.room}
 render()});
frame.addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(f.dataset.form==='ask'){lastOpener=null;S.dlg='ask';render();return}
 if(f.dataset.form==='reroute'){const id=f.dataset.room;const r=byId(id);const ds=[...f.querySelectorAll('input[name=d]:checked')].map(i=>i.value);if(!ds.length){say('Pick at least one session to suggest.');return}
  const sent=Math.round(r.occ*.79);S.rr[id]={sent,acc:0,dec:0,dest:ds.map(d=>[d,0]),at:NOW[ev()]};S.dlg=null;say(`Published to ${sent} attendees in ${r.name}. Tracking who accepts.`)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.dlg){S.dlg=null;render();lastOpener&&frame.querySelector(lastOpener)?.focus()}});
window.addEventListener('resize',()=>{fit();drawArrows()});
// Deep links: grill-ops.html#v=d2&ev=cnh&s=incident&slot=1&w=phone&t=light&sim=true&sel=r256&dlg=room:r256&bare=true
for(const [k,v] of new URLSearchParams(location.hash.slice(1))){S[k]=v==='true'?true:v==='false'?false:v}
if(S.bare){document.querySelector('.h-bar').style.display='none';document.getElementById('belief').style.display='none'}
syncCtl();
if(!S.bare)setInterval(()=>{let ch=false;for(const rr of Object.values(S.rr)){if(rr.acc+rr.dec<rr.sent*.45){rr.acc+=2;rr.dec+=(rr.acc%6===0?1:0);rr.dest[rr.acc%rr.dest.length][1]+=2;ch=true}}if(ch&&!S.dlg)render()},1800);
render();
</script>
</body>
</html>
