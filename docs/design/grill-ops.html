:root {
  /* Type */
  --font-sans:
    'Atkinson Hyperlegible Next', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --text-xs: 0.75rem;
  --text-sm: 0.875rem;
  --text-md: 1rem;
  --text-lg: 1.25rem;
  --text-xl: 1.5rem;
  --text-2xl: 2rem;
  --text-3xl: 2.75rem;
  --leading: 1.5;
  --caption-leading: 1.35;
  /* Speaker stage mode: captions and questions read from 10 m on a projector. */
  --stage-size: clamp(2.5rem, 4.6vw, 5.5rem);

  /* Space (4 px base) */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;

  /* Shape */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-pill: 999px;
  --border-w: 1px;
  --target-min: 44px;

  /* Motion */
  --dur-fast: 120ms;
  --dur-base: 220ms;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);

  /* Layers */
  --z-sticky: 10;
  --z-sheet: 40;
  --z-toast: 50;

  /* Layout */
  --side-w: 400px;
  --sheet-w: 420px;
}

/* Dark is the default: the stage and the room are dim, projectors glare. */
:root,
[data-theme='dark'] {
  color-scheme: dark;
  --color-bg: #0b0d12;
  --color-surface: #141821;
  --color-surface-2: #1d2230;
  --color-border: #2e3547;
  /* Edges that identify a control (inputs): 3:1 against every surface (WCAG 1.4.11). */
  --color-border-strong: #6e7891;
  --color-text: #eef1f6;
  --color-text-muted: #a9b1c2;
  --color-accent: #b69cff;
  --color-on-accent: #150a33;
  --color-focus: #5ad8ff;
  --color-ok: #4fd69c;
  --color-ok-bg: #0f2a20;
  --color-warn: #f5bd4f;
  --color-warn-bg: #2d2310;
  --color-crit: #ff7b7b;
  --color-crit-bg: #331617;
  --color-info: #79b8ff;
  --color-info-bg: #122238;
  --color-caption-bg: #05060a;
  --color-caption-text: #fffdf6;
  --color-caption-interim: #9aa3b5;
  --color-scrim: rgb(0 0 0 / 0.6);
}

[data-theme='light'] {
  color-scheme: light;
  --color-bg: #f5f6f8;
  --color-surface: #ffffff;
  --color-surface-2: #eceef3;
  --color-border: #cfd4de;
  --color-border-strong: #7c8496;
  --color-text: #10131c;
  --color-text-muted: #4a5266;
  --color-accent: #5b34d6;
  --color-on-accent: #ffffff;
  --color-focus: #0b57d0;
  --color-ok: #0a7a45;
  --color-ok-bg: #e3f5ec;
  --color-warn: #8a5a00;
  --color-warn-bg: #fdf1d8;
  --color-crit: #c0262d;
  --color-crit-bg: #fde6e6;
  --color-info: #1f5fbf;
  --color-info-bg: #e3eefc;
  --color-caption-bg: #ffffff;
  --color-caption-text: #0b0d12;
  --color-caption-interim: #5b6375;
  --color-scrim: rgb(16 19 28 / 0.45);
}

[data-theme='contrast'] {
  color-scheme: dark;
  --color-bg: #000000;
  --color-surface: #000000;
  --color-surface-2: #121212;
  --color-border: #ffffff;
  --color-border-strong: #ffffff;
  --color-text: #ffffff;
  --color-text-muted: #f0f0f0;
  --color-accent: #ffe14d;
  --color-on-accent: #000000;
  --color-focus: #00e5ff;
  --color-ok: #5cff9d;
  --color-ok-bg: #000000;
  --color-warn: #ffd23f;
  --color-warn-bg: #000000;
  --color-crit: #ff8a8a;
  --color-crit-bg: #000000;
  --color-info: #8fd0ff;
  --color-info-bg: #000000;
  --color-caption-bg: #000000;
  --color-caption-text: #ffff66;
  --color-caption-interim: #ffffff;
  --color-scrim: rgb(0 0 0 / 0.8);
  --border-w: 2px;
}

/* Caption sizes: L is the default; XXL fits about 3 words a line on a phone. */
:root,
[data-caption-size='l'] {
  --caption-size: 2.125rem;
}
[data-caption-size='s'] {
  --caption-size: 1.25rem;
}
[data-caption-size='m'] {
  --caption-size: 1.625rem;
}
[data-caption-size='xl'] {
  --caption-size: 2.75rem;
}
[data-caption-size='xxl'] {
  --caption-size: 3.625rem;
}

/* Readable spacing: the dyslexia-friendly option. Same font, more air. */
[data-readable='true'] {
  --readable-tracking: 0.04em;
  --readable-words: 0.14em;
  --leading: 1.7;
  --caption-leading: 1.7;
}

[data-motion='reduce'] {
  --dur-fast: 0ms;
  --dur-base: 0ms;
}
@media (prefers-reduced-motion: reduce) {
  :root {
    --dur-fast: 0ms;
    --dur-base: 0ms;
  }
}

/* ===== apps/web/src/ui/styles.css (verbatim, minus @import) ===== */
/*
 * Lanyard UI: base styles and components. Import once, in main.tsx:
 *   import './ui/styles.css';
 * Classes are prefixed `ly-` and belong to the components in this folder.
 * Persona code composes components; it does not restyle `ly-` classes.
 */

/* ---------- Base ---------- */
*,
*::before,
*::after {
  box-sizing: border-box;
}
html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--text-md);
  line-height: var(--leading);
  letter-spacing: var(--readable-tracking, normal);
  word-spacing: var(--readable-words, normal);
}
a {
  color: var(--color-accent);
  text-underline-offset: 0.18em;
}
:focus-visible {
  outline: 3px solid var(--color-focus);
  outline-offset: 2px;
}
button,
input,
textarea,
select {
  font: inherit;
  letter-spacing: inherit;
  word-spacing: inherit;
}
.ly-sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}
.ly-muted {
  color: var(--color-text-muted);
}
.ly-num {
  font-variant-numeric: tabular-nums;
}
.ly-icon {
  width: 22px;
  height: 22px;
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ---------- Button / IconButton ---------- */
.ly-btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-height: var(--target-min);
  padding: 0 var(--space-4);
  border-radius: var(--radius-md);
  border: var(--border-w) solid var(--color-border);
  background: var(--color-surface-2);
  color: var(--color-text);
  font-size: var(--text-md);
  font-weight: 700;
  line-height: 1.2;
  text-decoration: none;
  cursor: pointer;
  transition: transform var(--dur-fast) var(--ease);
}
.ly-btn:active {
  transform: scale(0.97);
}
.ly-btn:disabled,
.ly-btn[aria-disabled='true'] {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}
.ly-btn--primary,
.ly-btn[aria-pressed='true'] {
  background: var(--color-accent);
  border-color: var(--color-accent);
  color: var(--color-on-accent);
}
.ly-btn--ghost {
  background: transparent;
  border-color: transparent;
}
.ly-btn--danger {
  background: var(--color-crit-bg);
  border-color: var(--color-crit);
  color: var(--color-crit);
}
.ly-btn--lg {
  min-height: 56px;
  font-size: var(--text-lg);
  border-radius: var(--radius-lg);
}
.ly-btn--block {
  width: 100%;
}
.ly-btn--stacked {
  flex-direction: column;
  gap: 3px;
  min-height: 60px;
  padding: var(--space-1);
  font-size: var(--text-xs);
}
.ly-btn--icon {
  padding: 0;
  width: var(--target-min);
}
.ly-btn__badge {
  position: absolute;
  top: 4px;
  right: 8px;
  min-width: 20px;
  padding: 0 6px;
  border-radius: var(--radius-pill);
  background: var(--color-accent);
  color: var(--color-on-accent);
  font-size: 11px;
  line-height: 18px;
}

/* ---------- StatusPill ---------- */
.ly-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px;
  border-radius: var(--radius-pill);
  border: var(--border-w) solid currentColor;
  font-size: var(--text-sm);
  font-weight: 700;
  line-height: 1.3;
  white-space: nowrap;
  color: var(--color-text-muted);
  background: var(--color-surface-2);
}
.ly-pill .ly-icon {
  width: 16px;
  height: 16px;
}
.ly-pill--ok {
  color: var(--color-ok);
  background: var(--color-ok-bg);
}
.ly-pill--warn {
  color: var(--color-warn);
  background: var(--color-warn-bg);
}
.ly-pill--crit,
.ly-pill--live {
  color: var(--color-crit);
  background: var(--color-crit-bg);
}
.ly-pill--info {
  color: var(--color-info);
  background: var(--color-info-bg);
}
.ly-pill--live::before {
  content: '';
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
  animation: ly-pulse 1.6s infinite;
}
@keyframes ly-pulse {
  50% {
    opacity: 0.35;
  }
}

/* ---------- Card ---------- */
.ly-card {
  padding: var(--space-4);
  border-radius: var(--radius-md);
  border: var(--border-w) solid var(--color-border);
  background: var(--color-surface);
}
.ly-card--flush {
  padding: 0;
}
.ly-card--selected {
  border-color: var(--color-accent);
  box-shadow: inset 3px 0 0 var(--color-accent);
}
.ly-card > h2,
.ly-card > h3 {
  margin: 0 0 var(--space-2);
  font-size: var(--text-lg);
}

/* ---------- Sheet / Drawer (native <dialog>) ---------- */
.ly-sheet {
  margin: auto 0 0;
  padding: 0;
  width: 100%;
  max-width: 100%;
  max-height: 86dvh;
  border: 0;
  border-top: var(--border-w) solid var(--color-border);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  background: var(--color-surface);
  color: var(--color-text);
}
.ly-sheet[open] {
  animation: ly-sheet-in var(--dur-base) var(--ease);
}
.ly-sheet::backdrop {
  background: var(--color-scrim);
}
.ly-sheet__inner {
  padding: var(--space-4) var(--space-4) var(--space-6);
}
.ly-sheet__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  margin-bottom: var(--space-3);
}
.ly-sheet__head h2 {
  margin: 0;
  font-size: var(--text-xl);
  line-height: 1.2;
}
.ly-sheet__desc {
  margin: 0 0 var(--space-4);
  color: var(--color-text-muted);
}
.ly-sheet--captions {
  background: var(--color-caption-bg);
}
@keyframes ly-sheet-in {
  from {
    transform: translateY(30px);
    opacity: 0;
  }
}
@media (min-width: 900px) {
  .ly-sheet {
    margin: 0 0 0 auto;
    width: var(--sheet-w);
    height: 100dvh;
    max-height: none;
    border-top: 0;
    border-left: var(--border-w) solid var(--color-border);
    border-radius: 0;
  }
}

/* ---------- Toast ---------- */
.ly-toast-region {
  position: fixed;
  top: var(--space-3);
  left: var(--space-3);
  right: var(--space-3);
  z-index: var(--z-toast);
  display: grid;
  justify-items: center;
  pointer-events: none;
}
.ly-toast {
  display: flex;
  align-items: center;
  gap: 10px;
  width: min(100%, 420px);
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius-md);
  background: var(--color-text);
  color: var(--color-bg);
  font-weight: 700;
  animation: ly-sheet-in var(--dur-base) var(--ease);
  pointer-events: auto;
}
@media (min-width: 900px) {
  .ly-toast-region {
    left: auto;
    justify-items: end;
  }
}

/* ---------- Tabs ---------- */
.ly-tabs__list {
  display: flex;
  border-bottom: var(--border-w) solid var(--color-border);
}
.ly-tabs__tab {
  flex: 1;
  min-height: 48px;
  padding: 0 var(--space-3);
  border: 0;
  border-bottom: 3px solid transparent;
  background: none;
  color: var(--color-text-muted);
  font-size: var(--text-md);
  font-weight: 700;
  cursor: pointer;
}
.ly-tabs__tab[aria-selected='true'] {
  color: var(--color-text);
  border-bottom-color: var(--color-accent);
}
.ly-tabs__panel {
  padding-top: var(--space-4);
}

/* ---------- Input / TextArea ---------- */
.ly-field {
  display: grid;
  gap: var(--space-1);
}
.ly-field__label {
  font-weight: 700;
}
.ly-field__hint {
  font-size: var(--text-sm);
  color: var(--color-text-muted);
}
.ly-field__error {
  display: flex;
  gap: 6px;
  align-items: center;
  font-size: var(--text-sm);
  font-weight: 700;
  color: var(--color-crit);
}
.ly-field__error .ly-icon {
  width: 18px;
  height: 18px;
}
.ly-input {
  width: 100%;
  min-height: 48px;
  padding: var(--space-3);
  border-radius: var(--radius-md);
  border: var(--border-w) solid var(--color-border-strong);
  background: var(--color-bg);
  color: var(--color-text);
  font-size: var(--text-md);
  resize: none;
}
.ly-input::placeholder {
  color: var(--color-text-muted);
}
.ly-input[aria-invalid='true'] {
  border-color: var(--color-crit);
}

/* ---------- CaptionStream ---------- */
.ly-caps {
  position: relative;
  flex: 1;
  min-height: 0;
  overflow: auto;
  overscroll-behavior: contain;
  padding: var(--space-5) var(--space-5) var(--space-7);
  background: var(--color-caption-bg);
  color: var(--color-caption-text);
  font-size: var(--caption-size);
  line-height: var(--caption-leading);
}
.ly-caps--stage {
  font-size: var(--stage-size);
  padding: var(--space-6) var(--space-7) var(--space-8);
}
.ly-caps__log {
  margin: 0;
  padding: 0;
  list-style: none;
}
.ly-caps__line {
  margin: 0 0 0.55em;
  max-width: 32ch;
  animation: ly-cap-in var(--dur-base) var(--ease);
}
.ly-caps--stage .ly-caps__line,
.ly-caps--wide .ly-caps__line {
  max-width: 42ch;
}
.ly-caps__speaker {
  display: block;
  margin-bottom: 0.2em;
  color: var(--color-accent);
  font-size: var(--text-sm);
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.ly-caps--stage .ly-caps__speaker {
  font-size: var(--text-xl);
}
.ly-caps__interim {
  margin: 0;
  max-width: 32ch;
  color: var(--color-caption-interim);
}
/* Stale (connection lost): dim to the interim colour, which keeps at least 4.5:1. Never opacity. */
.ly-caps--stale .ly-caps__log {
  color: var(--color-caption-interim);
}
.ly-caps__jump {
  position: sticky;
  bottom: var(--space-4);
  display: flex;
  width: fit-content;
  margin: var(--space-4) auto 0;
  font-size: var(--text-md);
  line-height: 1.2;
  z-index: var(--z-sticky);
}
@keyframes ly-cap-in {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
}

/* ---------- QuestionItem ---------- */
.ly-qlist {
  display: grid;
  gap: 10px;
  margin: 0;
  padding: 0;
  list-style: none;
}
.ly-q {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: var(--space-3);
  padding: var(--space-3);
  border-radius: var(--radius-md);
  border: var(--border-w) solid var(--color-border);
  background: var(--color-surface);
}
.ly-q--mine {
  border-color: var(--color-accent);
  box-shadow: inset 3px 0 0 var(--color-accent);
}
/* Answered: a background change plus the "Answered" pill. Never opacity: the text must keep its contrast. */
.ly-q--answered {
  background: var(--color-surface-2);
  border-style: dashed;
}
.ly-q__vote {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 52px;
  min-height: 52px;
  border-radius: var(--radius-md);
  border: var(--border-w) solid var(--color-border);
  background: var(--color-surface-2);
  color: var(--color-text);
  font-size: var(--text-md);
  font-weight: 700;
  cursor: pointer;
}
.ly-q__vote[aria-pressed='true'] {
  background: var(--color-accent);
  border-color: var(--color-accent);
  color: var(--color-on-accent);
}
.ly-q__vote .ly-icon {
  width: 18px;
  height: 18px;
}
.ly-q__rank {
  display: grid;
  place-items: center;
  width: 52px;
  font-size: var(--text-2xl);
  font-weight: 700;
  color: var(--color-text-muted);
}
.ly-q__label {
  margin: 0 0 2px;
  font-size: var(--text-md);
  font-weight: 700;
  overflow-wrap: anywhere;
}
.ly-q__text {
  margin: 0;
  font-size: var(--text-sm);
  color: var(--color-text-muted);
  line-height: 1.45;
  overflow-wrap: anywhere;
}
.ly-q__meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  margin-top: 6px;
  font-size: var(--text-sm);
}
.ly-q--stage {
  font-size: var(--text-xl);
}
.ly-q--stage .ly-q__label {
  font-size: var(--text-2xl);
}
.ly-q--stage .ly-q__text,
.ly-q--stage .ly-q__meta {
  font-size: var(--text-lg);
}

/* ---------- SignalBar ---------- */
.ly-signals {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
}
.ly-signals--grid {
  grid-template-columns: 1fr 1fr;
  gap: var(--space-3);
}
.ly-signals--grid .ly-signal:last-child {
  grid-column: 1 / -1;
}
.ly-signal {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  min-height: 64px;
  padding: 6px 2px;
  border-radius: var(--radius-md);
  border: var(--border-w) solid var(--color-border);
  background: var(--color-surface);
  color: var(--color-text);
  font-size: var(--text-xs);
  font-weight: 700;
  line-height: 1.1;
  text-align: center;
  cursor: pointer;
}
.ly-signals--grid .ly-signal {
  min-height: 80px;
  font-size: var(--text-md);
}
.ly-signal[aria-pressed='true'] {
  background: var(--color-accent);
  border-color: var(--color-accent);
  color: var(--color-on-accent);
}

/* ---------- Meter ---------- */
.ly-meter {
  display: grid;
  gap: var(--space-1);
}
.ly-meter__head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: var(--space-2);
  font-size: var(--text-sm);
}
.ly-meter__label {
  font-weight: 700;
}
.ly-meter__value {
  font-variant-numeric: tabular-nums;
  font-weight: 700;
}
.ly-meter__track {
  height: 10px;
  border-radius: var(--radius-pill);
  background: var(--color-surface-2);
  border: var(--border-w) solid var(--color-border);
  overflow: hidden;
}
.ly-meter__fill {
  height: 100%;
  background: var(--color-accent);
  transition: width var(--dur-base) var(--ease);
}
.ly-meter--ok .ly-meter__fill {
  background: var(--color-ok);
}
.ly-meter--warn .ly-meter__fill {
  background: var(--color-warn);
}
.ly-meter--crit .ly-meter__fill {
  background: var(--color-crit);
}
.ly-meter--ok .ly-meter__value {
  color: var(--color-ok);
}
.ly-meter--warn .ly-meter__value {
  color: var(--color-warn);
}
.ly-meter--crit .ly-meter__value {
  color: var(--color-crit);
}
.ly-meter--lg .ly-meter__head {
  font-size: var(--text-xl);
}
.ly-meter--lg .ly-meter__track {
  height: 20px;
}

/* ---------- RoomTile ---------- */
.ly-room {
  display: grid;
  gap: var(--space-2);
  padding: var(--space-3);
  border-radius: var(--radius-md);
  border: var(--border-w) solid var(--color-border);
  border-left-width: 4px;
  background: var(--color-surface);
  color: var(--color-text);
  text-align: left;
  width: 100%;
}
.ly-room {
  position: relative;
}
.ly-room__open {
  padding: 0;
  border: 0;
  background: none;
  color: inherit;
  text-align: left;
  cursor: pointer;
}
/* The name button covers the tile, so the whole tile is the click target. */
.ly-room__open::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: var(--radius-md);
}
.ly-room__open:focus-visible {
  outline: none;
}
.ly-room:has(.ly-room__open:focus-visible) {
  outline: 3px solid var(--color-focus);
  outline-offset: 2px;
}
.ly-room:has(.ly-room__open):hover {
  background: var(--color-surface-2);
}
.ly-room--ok {
  border-left-color: var(--color-ok);
}
.ly-room--warn {
  border-left-color: var(--color-warn);
}
.ly-room--crit {
  border-left-color: var(--color-crit);
}
.ly-room__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
}
.ly-room__name {
  margin: 0;
  font-size: var(--text-md);
  font-weight: 700;
}
.ly-room__session {
  margin: 0;
  font-size: var(--text-sm);
  color: var(--color-text-muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ly-room__stats {
  display: flex;
  gap: var(--space-4);
  margin: 0;
  font-family: var(--font-mono);
  font-size: var(--text-sm);
  font-variant-numeric: tabular-nums;
}
.ly-room__stats div {
  display: flex;
  gap: 4px;
}
.ly-room__stats dt {
  color: var(--color-text-muted);
}
.ly-room__stats dd {
  margin: 0;
  font-weight: 700;
}

/* ---------- EmptyState / ErrorState / Banner / Skeleton ---------- */
.ly-empty {
  padding: var(--space-6) var(--space-4);
  text-align: center;
  color: var(--color-text-muted);
}
.ly-empty__icon {
  width: 32px;
  height: 32px;
  margin-bottom: var(--space-2);
}
.ly-empty__title {
  display: block;
  margin: 0 0 6px;
  color: var(--color-text);
  font-size: var(--text-lg);
  font-weight: 700;
}
.ly-empty__body {
  margin: 0 auto;
  max-width: 36ch;
}
.ly-empty__action {
  margin-top: var(--space-4);
}
.ly-caps .ly-empty {
  font-size: calc(var(--caption-size) * 0.6);
}
.ly-caps .ly-empty__title {
  font-size: 1.25em;
}
.ly-empty--error .ly-empty__icon {
  color: var(--color-crit);
}
.ly-banner {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: var(--space-2) var(--space-3);
  border-bottom: var(--border-w) solid currentColor;
  font-size: var(--text-sm);
  font-weight: 700;
  color: var(--color-warn);
  background: var(--color-warn-bg);
}
.ly-banner--crit {
  color: var(--color-crit);
  background: var(--color-crit-bg);
}
.ly-banner--info {
  color: var(--color-info);
  background: var(--color-info-bg);
}
.ly-banner .ly-btn {
  min-height: 36px;
  margin-left: auto;
  font-size: var(--text-sm);
}
.ly-skeleton {
  display: block;
  border-radius: var(--radius-sm);
  background: linear-gradient(
    90deg,
    var(--color-surface-2),
    var(--color-surface),
    var(--color-surface-2)
  );
  background-size: 200% 100%;
  animation: ly-shimmer 1.4s infinite linear;
}
.ly-caps .ly-skeleton {
  height: 0.9em;
  margin-bottom: 0.6em;
}
@keyframes ly-shimmer {
  to {
    background-position: -200% 0;
  }
}

/* ---------- CaptionStage: the attendee live-session layout (direction A) ---------- */
.ly-stage {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  background: var(--color-caption-bg);
}
.ly-stage__head {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-2) var(--space-2) var(--space-4);
  border-bottom: var(--border-w) solid var(--color-border);
  background: var(--color-bg);
}
.ly-stage__title {
  flex: 1;
  min-width: 0;
  margin: 0;
  font-size: var(--text-sm);
  font-weight: 700;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ly-stage__count {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: var(--text-sm);
  color: var(--color-text-muted);
  font-variant-numeric: tabular-nums;
}
.ly-stage__count .ly-icon {
  width: 18px;
  height: 18px;
}
.ly-stage__main {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
}
.ly-stage__side {
  display: none;
}
.ly-stage__dock {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3) max(var(--space-4), env(safe-area-inset-bottom));
  border-top: var(--border-w) solid var(--color-border);
  background: var(--color-bg);
}
@media (min-width: 900px) {
  .ly-stage {
    display: grid;
    grid-template-columns: 1fr var(--side-w);
    grid-template-rows: auto auto 1fr auto;
  }
  .ly-stage > .ly-banner,
  .ly-stage__head {
    grid-column: 1 / -1;
  }
  .ly-stage__main {
    grid-column: 1;
    grid-row: 3 / 5;
  }
  .ly-stage__main .ly-caps__line {
    max-width: 42ch;
  }
  .ly-stage__side {
    display: block;
    grid-column: 2;
    grid-row: 3;
    overflow: auto;
    padding: var(--space-4);
    background: var(--color-bg);
    border-left: var(--border-w) solid var(--color-border);
  }
  .ly-stage__side h2 {
    margin: 0 0 10px;
    font-size: var(--text-lg);
  }
  .ly-stage__side h2:not(:first-child) {
    margin-top: var(--space-5);
  }
  .ly-stage__dock {
    grid-column: 2;
    grid-row: 4;
    border-left: var(--border-w) solid var(--color-border);
  }
  /* On desktop, Questions and React are already in the side panel. */
  .ly-stage__dock [data-dock-desktop='hide'] {
    display: none;
  }
  .ly-stage__dock {
    grid-template-columns: none;
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
  }
}

/* ---------- Display settings ---------- */
.ly-prefs {
  display: grid;
  gap: var(--space-4);
}
.ly-prefs fieldset {
  margin: 0;
  padding: 0;
  border: 0;
}
.ly-prefs legend {
  margin-bottom: 6px;
  padding: 0;
  font-weight: 700;
}
.ly-prefs__row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

/* ---------- Reduced motion: stop loops too, not just transitions ---------- */
[data-motion='reduce'] .ly-pill--live::before,
[data-motion='reduce'] .ly-skeleton,
[data-motion='reduce'] .ly-caps__line,
[data-motion='reduce'] .ly-sheet[open],
[data-motion='reduce'] .ly-toast {
  animation: none;
}
@media (prefers-reduced-motion: reduce) {
  .ly-pill--live::before,
  .ly-skeleton,
  .ly-caps__line,
  .ly-sheet[open],
  .ly-toast {
    animation: none;
  }
}

/* ============ HARNESS (not part of the design) ============ */
html,body{margin:0}
body{background:#2a2d35;color:#eef1f6}
.h-bar{position:sticky;top:0;z-index:100;background:#15171c;border-bottom:1px solid #333;padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font:13px/1.3 system-ui,sans-serif;color:#eef1f6}
.h-bar fieldset{border:0;margin:0;padding:0;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.h-bar legend{float:left;margin-right:6px;color:#9aa;font-weight:600}
.h-bar label{display:inline-flex;align-items:center;gap:3px;padding:3px 7px;border-radius:5px;background:#23262e;cursor:pointer}
.h-bar label:has(input:checked){background:#5b34d6;color:#fff}
.h-bar input[type=radio]{position:absolute;opacity:0;pointer-events:none}
.h-bar label:has(input:focus-visible){outline:2px solid #5ad8ff}
.h-belief{background:#1b1e25;color:#dfe3ea;padding:8px 14px;font:14px/1.4 system-ui,sans-serif;border-bottom:1px solid #333}
.h-belief b{color:#c9b8ff}
.h-stage{display:flex;justify-content:center;padding:20px 12px 60px}
.h-sizer{position:relative;flex:none}
.frame{width:1280px;height:800px;overflow:hidden;position:relative;background:var(--color-bg);color:var(--color-text);box-shadow:0 0 0 6px #111,0 20px 60px #0008;container-type:inline-size;font-family:var(--font-sans);font-size:var(--text-md);line-height:var(--leading);transform-origin:0 0}
.frame.w-proj{width:1920px;height:1080px}
.frame.w-phone{width:390px;height:844px;border-radius:28px;box-shadow:0 0 0 10px #111,0 20px 60px #0008}
body.bare .h-stage{padding:0}
body.bare .frame{box-shadow:none}
body.bare.w-phone .h-stage{padding:0;justify-content:flex-start}
body.bare.w-phone .frame{border-radius:0}

/* ============ SHARED (identical in every variant: app chrome the variants don't redesign) ============ */
.x-sel{width:auto;max-width:100%;min-height:var(--target-min);padding:0 var(--space-3);font-weight:700}
.x-ask{display:flex;gap:var(--space-2);min-width:0}
.x-ask .ly-input{min-height:var(--target-min);padding:0 var(--space-3)}
.x-live{display:inline-flex;align-items:center;gap:var(--space-2);font-family:var(--font-mono);font-size:var(--text-sm);white-space:nowrap}
.x-links{display:flex;gap:2px;flex-wrap:wrap;align-items:center}
.x-links__k{font-size:var(--text-xs);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--color-text-muted);padding:0 var(--space-1)}
.x-links .ly-btn{font-size:var(--text-sm);padding:0 var(--space-2)}
.x-ext{width:14px!important;height:14px!important}
.x-spark{display:block;color:var(--color-text-muted);overflow:visible;max-width:100%;height:auto}
.x-spark .x-thr{stroke:var(--color-border-strong);stroke-dasharray:3 3;stroke-width:1}
.x-spark .x-line{fill:none;stroke:var(--color-text);stroke-width:2;vector-effect:non-scaling-stroke}
.x-rr{display:grid;gap:var(--space-2)}
.x-rr__dest{display:grid;gap:2px;margin:0;font-size:var(--text-sm)}
.x-rr__dest div{display:flex;justify-content:space-between;gap:var(--space-3)}
.x-rr__dest dt{color:var(--color-text-muted)}
.x-rr__dest dd{margin:0;font-family:var(--font-mono);font-weight:700}
.x-scrim{position:absolute;inset:0;z-index:var(--z-sheet);background:var(--color-scrim);display:flex;justify-content:flex-end}
.x-dlg{width:min(100%,460px);height:100%;overflow:auto;background:var(--color-surface);color:var(--color-text);border-left:var(--border-w) solid var(--color-border);padding:var(--space-4) var(--space-4) var(--space-6)}
@container (max-width:699px){.x-scrim{align-items:flex-end}.x-dlg{width:100%;height:auto;max-height:88%;border-left:0;border-top:var(--border-w) solid var(--color-border);border-radius:var(--radius-lg) var(--radius-lg) 0 0}}

/* ---------------- Variant A: Service grid ---------------- */
function alertCard(a,i,cls,primaryUsed){const rr=reroute(a.room);const canRR=a.status==='firing'&&a.sev!=='info'&&!rr;const prim=canRR&&!primaryUsed.v;if(prim)primaryUsed.v=true;
 return `<article class="ly-card ${cls}-alert ${cls}-alert--${a.sev}"><div class="${cls}-alert__row">${pill(a.sev,SEV_LABEL[a.sev])}<span class="ly-muted ly-num" style="font-family:var(--font-mono);font-size:var(--text-sm)">${a.at} MT · ${a.status}</span></div><h3>${esc(a.title)}</h3><p>${esc(a.detail)}</p>${rr?rrBlock(byId(a.room),rr):''}${a.status==='firing'?`<div class="${cls}-acts">${canRR?`<button type="button" class="ly-btn ${prim?'ly-btn--primary':''}" data-dlg="reroute:${a.room}">${ic('route')}Reroute</button>`:''}${rr?`<button type="button" class="ly-btn" data-room="${a.room}">View reroute</button>`:''}<a class="ly-btn ly-btn--ghost" href="#dash0-slos" data-act="dash0" data-what="SLO">SLO${ic('ext','x-ext')}</a><a class="ly-btn ly-btn--ghost" href="#dash0-agent0" data-act="dash0" data-what="Agent0">Agent0${ic('ext','x-ext')}</a></div>`:''}</article>`}
function vA(){const T=totals(),al=alerts(),pu={v:false};let grid,rail;
 if(S.s==='loading'){grid=skBusy(Array.from({length:9},()=>`<div class="ly-room">${sk(18,'60%')}${sk(12,'90%')}${sk(10)}${sk(12,'70%')}</div>`).join(''));rail=`<h2>Alerts</h2>${sk(140)}${sk(140)}`}
 else if(S.s==='empty'){grid=`<div style="grid-column:1/-1">${emptyState()}</div>`;rail=`<h2>Alerts</h2><p class="ly-muted" style="margin:0">No alerts. Rooms alert at 75% (at risk) and 90% (breached).</p>`}
 else{const rs=rooms();grid=rs.map(roomTile).join('');const fire=al.filter(a=>a.status!=='resolved');rail=`<h2>Alerts <span class="ly-muted ly-num" style="font-size:var(--text-sm)">${al.filter(a=>a.status==='firing').length} firing</span></h2>${fire.map((a,i)=>alertCard(a,i,'oa',pu)).join('')}<details><summary class="ly-muted" style="cursor:pointer">Resolved today (${al.filter(a=>a.status==='resolved').length})</summary>${al.filter(a=>a.status==='resolved').map(a=>alertCard(a,0,'oa',pu)).join('')}</details>`}
 const sum=S.s==='loading'||S.s==='empty'?`<span>12 rooms</span><span class="ly-muted">no live data yet</span>`:`<span><b>${fmt(T.att)}</b> in rooms</span>${T.crit?pill('crit',`${T.crit} breached`):''}${T.warn?pill('warn',`${T.warn} at risk`):''}${pill('ok',`${T.ok} healthy`)}<span><b>${T.q}</b> questions</span><span class="ly-muted">SLO: occupancy under 90%</span>`;
 return `<div class="oa" ${S.s==='error'?'data-stale':''}>${banners()}<header class="oa-hd"><h1 class="oa-brand">Lanyard ops</h1>${evSel('ev-a')}${liveClock()}${askForm('ask-a')}${simBtn()}</header><div class="oa-sum"><div class="oa-sumi" aria-label="Event summary">${sum}</div>${links()}</div><div class="oa-body"><main class="oa-grid" aria-label="Rooms, worst first">${grid}</main><aside class="oa-rail" aria-label="Alerts">${rail}</aside></div></div>`}

/* ---------------- Variant B: Pager inbox ---------------- */
function vB(){const al=alerts();const tabs=[['firing','Firing'],['ack','Acknowledged'],['resolved','Resolved']];
 const list=al.filter(a=>a.status===S.tab);const sel=list.find(a=>a.id===S.sel)||list[0];
 let queue,detail;
 if(S.s==='loading'){queue=skBusy(`<div style="padding:8px;display:grid;gap:8px">${sk(72)}${sk(72)}${sk(72)}</div>`);detail=`${sk(40,'50%')}${sk(20,'70%')}${sk(160)}`}
 else if(S.s==='empty'){queue=`<div class="ly-empty"><strong class="ly-empty__title">Nothing to page about</strong><p class="ly-empty__body">Alerts land here when a room crosses 75% (at risk) or 90% (breached).</p></div>`;detail=emptyState()}
 else{queue=list.length?`<ul class="ob-list">${list.map(a=>`<li><button type="button" class="ob-item" data-sel="${a.id}" aria-current="${sel&&a.id===sel.id}"><span class="ob-item__sev"><span class="ob-sev ob-sev--${a.sev}">${ic(TONE_ICON[a.sev])}</span><span class="ly-sr-only">${SEV_LABEL[a.sev]}</span></span><span class="ob-item__t">${esc(a.title)}</span><span class="ob-item__age">${a.age}</span><span class="ob-item__d">${SEV_LABEL[a.sev]} · ${esc(a.detail)}</span></button></li>`).join('')}</ul>`:`<div class="ly-empty"><strong class="ly-empty__title">All clear</strong><p class="ly-empty__body">Nothing ${S.tab==='ack'?'acknowledged':S.tab}.</p></div>`;
  if(!sel)detail=`<div class="ly-empty">${ic('check','ly-empty__icon')}<strong class="ly-empty__title">No alert selected</strong></div>`;
  else{const r=byId(sel.room);const rr=reroute(sel.room);const canRR=sel.status==='firing'&&sel.sev!=='info';const sug=(SUGG[sel.room]||[]).map(([d,why])=>({r:byId(d),why}));
   detail=`<div style="display:flex;gap:var(--space-3);align-items:center;flex-wrap:wrap">${pill(sel.sev,SEV_LABEL[sel.sev])}<span class="ly-muted" style="font-family:var(--font-mono)">fired ${sel.at} MT · ${sel.status}</span></div><h2>${esc(sel.title)}</h2>
   <div class="ob-two"><div style="display:grid;gap:var(--space-3)">${meter('Occupancy',r.occ,r.cap,`${fmt(r.occ)} / ${fmt(r.cap)}`,{lg:true})}<dl class="ob-kv"><div><dt>burn</dt><dd>${r.burn.toFixed(1)}×</dd></div><div><dt>budget left</dt><dd>${r.budget}%</dd></div><div><dt>sig/min</dt><dd>${r.sig}</dd></div><div><dt>questions</dt><dd>${r.q}</dd></div></dl><p class="ly-muted" style="margin:0">${esc(r.sess)}</p></div><div><p class="ly-muted" style="margin:0 0 4px">Last 30 min · dashed line = 90% SLO</p>${spark(r,360,90)}</div></div>
   ${canRR?(rr?`<section class="ly-card"><h3>Reroute in flight</h3>${rrBlock(r,rr)}</section>`:`<section class="ly-card"><h3>Reroute to rooms with seats</h3><div class="ob-opts">${sug.map(s=>`<div class="x-opt" style="cursor:default;grid-template-columns:1fr"><span style="color:inherit;font-size:inherit"><b>${esc(s.r.name)} · ${fmt(s.r.cap-s.r.occ)} seats free</b><span>${esc(s.r.sess)} · ${esc(WALK[s.r.id]||'')}</span></span></div>`).join('')}</div><div class="ob-acts" style="margin-top:var(--space-3)"><button type="button" class="ly-btn ly-btn--primary ly-btn--lg" data-dlg="reroute:${r.id}">${ic('route')}Reroute ${Math.round(r.occ*.79)} attendees…</button></div></section>`):''}
   <div class="ob-acts"><button type="button" class="ly-btn">${ic('check')}Acknowledge</button>${links(['SLOs','Agent0'])}</div>`}}
 const healthy=S.s==='loading'||S.s==='empty'?'<span class="ly-muted">Rooms appear when check-in opens.</span>':(()=>{const ok=rooms().filter(r=>r.state==='ok');return `<b>${ic('check')}${ok.length} healthy rooms</b>${ok.map(r=>`<button type="button" class="ob-chip" data-room="${r.id}" style="cursor:pointer;font:inherit;font-family:var(--font-mono)">${esc(r.name)} ${Math.round(r.ratio*100)}%</button>`).join('')}`})();
 const count=k=>al.filter(a=>a.status===k).length;
 return `<div class="ob" ${S.s==='error'?'data-stale':''}><div class="ob-ban">${banners()}</div><header class="ob-hd"><h1>Lanyard ops</h1>${evSel('ev-b')}${liveClock()}${askForm('ask-b')}${simBtn()}${links(['Dashboard'])}</header>
 <section class="ob-queue" aria-label="Alert queue"><div class="ob-tabs" role="tablist">${tabs.map(([k,l])=>`<button type="button" class="ob-tab" role="tab" aria-selected="${S.tab===k}" data-tab="${k}">${l} ${S.s==='loading'||S.s==='empty'?'':count(k)}</button>`).join('')}</div>${queue}</section>
 <main class="ob-detail" aria-label="Alert detail">${detail}</main><footer class="ob-healthy" aria-label="Healthy rooms">${healthy}</footer></div>`}

/* ---------------- Variant C: SLO table ---------------- */
function vC(){const T=totals();let body;
 const head=`<tr><th scope="col">State · room</th><th scope="col">Session</th><th scope="col"><button type="button">Occupancy ${ic('down','x-ext')}</button></th><th scope="col">Last 30 min</th><th scope="col" class="oc-num">Burn</th><th scope="col" class="oc-num">Budget left</th><th scope="col" class="oc-num">Sig/min</th><th scope="col" class="oc-num">Q</th><th scope="col"><span class="ly-sr-only">Actions</span></th></tr>`;
 if(S.s==='loading')body=Array.from({length:10},()=>`<tr>${Array.from({length:9},(_,i)=>`<td>${sk(14,i===1?'200px':'70%')}</td>`).join('')}</tr>`).join('');
 else if(S.s==='empty')body=`<tr><td colspan="9">${emptyState()}</td></tr>`;
 else{let rs=rooms();if(S.filter==='firing')rs=rs.filter(r=>r.state!=='ok');let prim=false;
  body=rs.map(r=>{const rr=reroute(r.id);const canRR=r.state!=='ok'&&!rr;const p=canRR&&!prim;if(p)prim=true;
   const row=`<tr class="oc-row--${r.state}"><td><div style="display:flex;flex-direction:column;gap:4px;align-items:flex-start">${pill(r.state,SLO_LABEL[r.state])}<button type="button" class="ly-btn ly-btn--ghost oc-room" style="padding:0;min-height:28px" data-room="${r.id}">${esc(r.name)}</button></div></td><td class="oc-sess" title="${esc(r.sess)}">${esc(r.sess)}</td><td><div class="oc-occ">${meter(`<span class="ly-sr-only">Occupancy</span>${Math.round(r.ratio*100)}%`,r.occ,r.cap,`${fmt(r.occ)}/${fmt(r.cap)}`)}</div></td><td>${spark(r,110,26)}</td><td class="oc-num ${r.burn>=1?'oc-burn--hot':''}">${r.burn.toFixed(1)}×${r.burn>=1?' '+ic('up','x-ext'):''}</td><td class="oc-num">${r.budget}%</td><td class="oc-num">${r.sig}</td><td class="oc-num">${r.q}</td><td style="white-space:nowrap">${canRR?`<button type="button" class="ly-btn ${p?'ly-btn--primary':''}" data-dlg="reroute:${r.id}">${ic('route')}Reroute</button>`:''}${rr?`<span class="ly-pill ly-pill--info">${ic('route')}Rerouting</span>`:''}</td></tr>`;
   const sub=rr?`<tr class="oc-sub"><td colspan="9"><div class="oc-subgrid"><div><h3>Reroute in flight</h3>${rrBlock(r,rr)}</div><div><h3>Alert</h3><p class="ly-muted" style="margin:0">Fired 10:41 MT: 174 / 180 (97%), rising 6 people/min. Error budget for this session: 38% left at 14.4× burn, gone in about 9 min.</p></div><div>${links(['SLOs','Agent0'])}</div></div></td></tr>`:'';return row+sub}).join('')}
 const n=S.s==='loading'||S.s==='empty'?'':{all:T.n,firing:T.crit+T.warn};
 return `<div class="oc" ${S.s==='error'?'data-stale':''}>${banners()}<header class="oc-hd"><h1>lanyard/ops</h1>${evSel('ev-c')}${liveClock()}<span style="flex:1"></span>${simBtn()}${links()}</header>
 <div class="oc-cmd">${askForm('ask-c')}<div class="oc-filters" role="group" aria-label="Filter rooms"><button type="button" class="ly-btn" data-filter="all" aria-pressed="${S.filter==='all'}">all ${n.all??''}</button><button type="button" class="ly-btn" data-filter="firing" aria-pressed="${S.filter==='firing'}">${ic('warn','x-ext')}not healthy ${n.firing??''}</button></div><span class="ly-muted" style="font-family:var(--font-mono);font-size:var(--text-sm)">SLO occupancy &lt; 90% · 99% of session minutes</span></div>
 <main class="oc-wrap" aria-label="Rooms"><table class="oc-t"><caption class="ly-sr-only">Rooms as services, worst first</caption><thead>${head}</thead><tbody>${body}</tbody></table></main></div>`}

/* ---------------- Variant D: Floor plan ---------------- */
function vD(){const rs=rooms();const lots=S.s==='lots';let map;const rrAll=rs.map(r=>[r,reroute(r.id)]).filter(x=>x[1]);
 const incoming={};rrAll.forEach(([r,rr])=>rr.dest.forEach(([d,n])=>incoming[d]=(incoming[d]||0)+n));
 if(S.s==='empty')map=emptyState();
 else map=[1,2,3].map(L=>{const lr=rs.filter(r=>r.level===L);const auto=lots;
  return `<section class="od-level" aria-label="${LEVELS[L]}"><h2>${LEVELS[L]}<span>${lr.length} rooms</span></h2><div class="od-plan ${auto?'od-plan--auto':''}" data-level="${L}">${lr.map(r=>{const g=r.g&&!auto?`style="grid-area:${r.g[1]}/${r.g[0]}/span ${r.g[3]}/span ${r.g[2]}"`:'';
   if(S.s==='loading')return `<div class="od-room" ${g}>${sk(14,'60%')}${sk(10,'40%')}</div>`;
   const st=r.state;const inc=incoming[r.id];const rr=reroute(r.id);
   return `<button type="button" class="od-room od-room--${st} ${inc?'od-room--dest':''}" data-room="${r.id}" data-pin="${r.id}" ${g}><b>${esc(r.name)}</b><span class="od-room__st">${ic(TONE_ICON[st])}${SLO_LABEL[st]}</span><span class="od-room__n">${fmt(r.occ)}/${fmt(r.cap)} · ${Math.round(r.ratio*100)}%</span>${inc?`<span class="od-in">${ic('route','x-ext')} +${inc} rerouted in</span>`:''}${rr?`<span class="od-in">${ic('down','x-ext')} ${rr.dest.filter(([d])=>byId(d).level!==r.level).map(([d,n])=>`${n} to ${esc(byId(d).name)}, Level ${byId(d).level}`).join(', ')}</span>`:''}<span class="od-room__fill" style="width:${Math.min(100,r.ratio*100)}%"></span></button>`}).join('')}<svg class="od-arrows" aria-hidden="true"></svg></div></section>`}).join('');
 const al=alerts().filter(a=>a.status!=='resolved');const pu={v:false};
 const side0=S.s==='loading'?`${sk(120)}${sk(120)}`:S.s==='empty'?`<h2>Alerts</h2><p class="ly-muted" style="margin:0">None yet.</p>`:`<h2>Alerts</h2>${al.map(a=>alertCard(a,0,'od',pu)).join('')}`;
 const key=`<div class="od-key" aria-label="Map key"><span><i style="border:1px solid var(--color-border-strong);background:var(--color-surface)"></i>${ic('check','x-ext')}Healthy</span><span><i style="border:3px dashed var(--color-warn);background:var(--color-warn-bg)"></i>${ic('warn','x-ext')}At risk</span><span><i style="border:3px solid var(--color-crit);background:var(--color-crit-bg)"></i>${ic('crit','x-ext')}Breached</span><span><i style="border-top:3px dashed var(--color-accent);height:0"></i>Reroute path</span></div>`;
 const side=links()+side0;
 return `<div class="od" ${S.s==='error'?'data-stale':''}><div class="od-ban">${banners()}</div><header class="od-hd"><h1>Lanyard ops · floor</h1>${evSel('ev-d')}${liveClock()}${askForm('ask-d')}${simBtn()}</header><main class="od-map" aria-label="Venue map">${key}${map}</main><aside class="od-side" aria-label="Alerts">${side}</aside></div>`}
function drawArrows(){frame.querySelectorAll('.od-plan').forEach(plan=>{const svg=plan.querySelector('.od-arrows');if(!svg||plan.classList.contains('od-plan--auto'))return;let out=`<defs><marker id="ah${plan.dataset.level}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z"/></marker></defs>`;
 let k=0;plan.querySelectorAll('[data-pin]').forEach(el=>{const rr=reroute(el.dataset.pin);if(!rr)return;rr.dest.forEach(([d,n])=>{const t=plan.querySelector(`[data-pin="${d}"]`);if(!t)return;
  k=(k||0)+1;const a={x:el.offsetLeft+el.offsetWidth/2,y:el.offsetTop+el.offsetHeight+4},b={x:t.offsetLeft+t.offsetWidth/2,y:t.offsetTop+t.offsetHeight+6};
  const depth=26+k*22,my=Math.max(a.y,b.y)+depth,mx=(a.x+b.x)/2;
  out+=`<path d="M${a.x} ${a.y} Q${mx} ${my+depth*.6} ${b.x} ${b.y}" marker-end="url(#ah${plan.dataset.level})"/><text x="${mx}" y="${my+4}" text-anchor="middle">+${n} → ${esc(byId(d).name)}</text>`})});svg.innerHTML=out})}

/* ---------------- Variant E: Incident commander ---------------- */
function vE(){const rs=rooms();const f=firing().filter(a=>a.sev!=='info');
 const tick=S.s==='loading'?sk(20,'60%'):S.s==='empty'?'<span class="ly-muted">12 rooms configured · no live data until check-in opens</span>':`<b>Floor</b>${rs.map(r=>`<button type="button" class="oe-chip oe-chip--${r.state}" data-room="${r.id}" style="font:inherit;cursor:pointer">${ic(TONE_ICON[r.state])}${esc(r.name)} ${Math.round(r.ratio*100)}%<span class="ly-sr-only"> ${SLO_LABEL[r.state]}</span></button>`).join('')}`;
 let main;
 if(S.s==='loading')main=`<div class="oe-focus">${sk(28,'30%')}${sk(70,'70%')}${sk(140,'60%')}${sk(24)}</div><div class="oe-panel">${sk(30,'50%')}${sk(80)}${sk(120)}</div>`;
 else if(S.s==='empty')main=`<div class="oe-calm">${emptyState()}</div>`;
 else if(!f.length)main=`<div class="oe-calm"><p class="oe-big">${ic('check')} All rooms within SLO</p></div>`;
 else{const idx=Math.min(S.inc,f.length-1);const a=f[idx];const r=byId(a.room);const rr=reroute(r.id);const rising=r.state==='crit'?'rising 6 people/min':'rising 3 people/min';
  const tl=rr?[['10:38','Crossed 75%: at risk'],['10:41','Crossed 90%: SLO breached, alert fired'],[rr.at,`Reroute published to ${rr.sent} attendees`],['10:43',`${rr.acc} accepted, ${rr.dec} declined`]]:[[a.at,`Crossed 75%: ${a.sev==='crit'?'breached':'at risk'}, alert fired`],['10:43',`Projected to hit 90% at about 10:49 MT`]];
  main=`<section class="oe-focus" aria-label="Incident: ${esc(r.name)}"><div class="oe-eyebrow">${pill(r.state,SLO_LABEL[r.state])}<span class="ly-muted" style="font-family:var(--font-mono)">since ${a.at} MT</span></div><h2 class="oe-room">${esc(r.name)}</h2><p class="oe-sess">${esc(r.sess)}</p><p class="oe-big">${fmt(r.occ)}<small> / ${fmt(r.cap)} seats</small></p><p class="oe-why">${Math.round(r.ratio*100)}% · ${rising} · SLO under 90% · burn ${r.burn.toFixed(1)}×</p>${meter('Occupancy',r.occ,r.cap,`${Math.round(r.ratio*100)}%`,{lg:true})}<div>${spark(r,520,70)}</div></section>
  <section class="oe-panel" aria-label="Reroute">${rr?`<h2>${ic('route')} Reroute in flight</h2><p class="oe-tally">${rr.acc}<small> of ${rr.sent} accepted</small></p>${rrBlock(r,rr)}`:`<h2>Reroute before it breaches</h2><p class="ly-muted" style="margin:0">Suggest ${(SUGG[r.id]||[]).map(([d])=>esc(byId(d).name)).join(', ')} to the ${Math.round(r.occ*.79)} attendees in the room.</p><button type="button" class="ly-btn ly-btn--primary ly-btn--lg ly-btn--block" data-dlg="reroute:${r.id}" style="min-height:72px;font-size:var(--text-xl)">${ic('route')}Reroute now</button>`}
  <h2 style="font-size:var(--text-lg)">Timeline</h2><ol class="oe-tl">${tl.map(([t,x])=>`<li><time>${t}</time>${x}</li>`).join('')}</ol><div class="oe-acts">${links(['SLOs','Agent0'])}</div></section>`}
 const incs=f.length>1?`<div class="oe-inc" role="group" aria-label="Open incidents">${f.map((a,i)=>`<button type="button" class="ly-btn" data-inc="${i}" aria-pressed="${i===Math.min(S.inc,f.length-1)}">${ic(TONE_ICON[a.sev])}${esc(byId(a.room).name)}</button>`).join('')}</div>`:'';
 return `<div class="oe" ${S.s==='error'?'data-stale':''}>${banners()}<header class="oe-hd"><h1>Lanyard ops</h1>${evSel('ev-e')}${liveClock()}<button type="button" class="ly-btn" data-dlg="ask">${ic('search')}Ask the conference</button>${simBtn()}${links(['Dashboard'])}</header><div class="oe-tick" aria-label="All rooms">${tick}</div>${incs}<main class="oe-main">${main}</main></div>`}

/* ---------------- Render + harness ---------------- */
const V={a:vA,b:vB,c:vC,d:vD,e:vE};
const frame=document.getElementById('frame'),sizer=document.getElementById('sizer'),stage=document.getElementById('stage');
function fit(){const W={laptop:[1280,800],proj:[1920,1080],phone:[390,844]}[S.w];let sc=1;if(!S.bare&&S.w==='proj')sc=Math.min(1,(stage.clientWidth-24)/W[0]);
 frame.style.transform=sc<1?`scale(${sc})`:'';sizer.style.width=W[0]*sc+'px';sizer.style.height=W[1]*sc+'px'}
function render(){const r=document.documentElement;r.dataset.theme=S.t;r.dataset.motion=S.rm||S.bare?'reduce':'full';
 document.body.className=(S.bare?'bare ':'')+'w-'+S.w;
 frame.className='frame w-'+S.w;document.getElementById('belief').innerHTML=BELIEFS[S.v];
 const hadDlg=!!frame.querySelector('.x-dlg');
 frame.innerHTML=V[S.v]()+dialog()+toast();fit();
 if(S.v==='d')requestAnimationFrame(drawArrows);
 const dlg=frame.querySelector('.x-dlg');if(dlg&&!hadDlg&&!S.bare){const f=dlg.querySelector('input,button.ly-btn--primary,button');f&&f.focus()}}
function syncCtl(){const c=document.getElementById('ctl');for(const k of ['v','s','w','t']){const i=c.querySelector(`input[name=${k}][value="${S[k]}"]`);if(i)i.checked=true}c.sim.checked=S.sim;c.rm.checked=S.rm}
document.getElementById('ctl').addEventListener('change',e=>{const f=e.target;S[f.name]=f.type==='checkbox'?f.checked:f.value;S.dlg=null;S.sel=null;S.inc=0;S.tab='firing';render()});
let lastOpener=null;
function say(t,ms=3200){S.toast=t;render();clearTimeout(say.t);say.t=setTimeout(()=>{S.toast=null;render()},ms)}
frame.addEventListener('click',e=>{const b=e.target.closest('[data-act],[data-dlg],[data-room],[data-sel],[data-tab],[data-filter],[data-inc]');if(!b)return;const d=b.dataset;
 if(d.act==='close'){if(e.target!==b&&b.classList.contains('x-scrim'))return;S.dlg=null;render();lastOpener&&frame.querySelector(lastOpener)?.focus();return}
 if(d.act==='sim'){S.sim=!S.sim;syncCtl();say(S.sim?'Crowd simulator started. The board is labelled SIMULATED.':'Crowd simulator stopped.');return}
 if(d.act==='retry'){say('Reconnected. Live values resumed.');return}
 if(d.act==='dash0'){e.preventDefault();say(`Prototype: opens Dash0 ${d.what} in a new tab.`);return}
 if(d.dlg){lastOpener=`[data-dlg="${d.dlg}"]`;S.dlg=d.dlg}
 else if(d.room){lastOpener=`[data-room="${d.room}"]`;S.dlg='room:'+d.room}
 if(d.sel)S.sel=d.sel;if(d.tab){S.tab=d.tab;S.sel=null}if(d.filter)S.filter=d.filter;if(d.inc)S.inc=+d.inc;
 render()});
frame.addEventListener('submit',e=>{e.preventDefault();const f=e.target;
 if(f.dataset.form==='ask'){lastOpener=null;S.dlg='ask';render();return}
 if(f.dataset.form==='reroute'){const id=f.dataset.room;const r=byId(id);const ds=[...f.querySelectorAll('input[name=d]:checked')].map(i=>i.value);if(!ds.length){say('Pick at least one session to suggest.');return}
  const sent=Math.round(r.occ*.79);S.rr[id]={sent,acc:0,dec:0,dest:ds.map(d=>[d,0]),at:'10:43'};S.dlg=null;say(`Published to ${sent} attendees in ${r.name}. Tracking who accepts.`)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.dlg){S.dlg=null;render();lastOpener&&frame.querySelector(lastOpener)?.focus()}});
window.addEventListener('resize',fit);
// Deep links: grill-ops.html#v=b&s=incident&w=phone&t=light&sim=true&dlg=reroute:r255b&bare=true
for(const [k,v] of new URLSearchParams(location.hash.slice(1))){S[k]=v==='true'?true:v==='false'?false:v}
if(S.bare){document.querySelector('.h-bar').style.display='none';document.getElementById('belief').style.display='none'}
syncCtl();
// Live: accepted count ticks up on in-flight reroutes (not in bare/screenshot mode).
if(!S.bare)setInterval(()=>{let ch=false;for(const rr of Object.values(S.rr)){if(rr.acc+rr.dec<rr.sent*.45){rr.acc+=2;rr.dec+=(rr.acc%6===0?1:0);rr.dest[rr.acc%rr.dest.length][1]+=2;ch=true}}if(ch&&!S.dlg)render()},1800);
render();
</script>
