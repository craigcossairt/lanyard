Round 1 verdict (user): the speaker console is a PRIVATE presenter view for the person at the podium.

Dead: A Room screen, E Question wall (audience-facing), D Timeline (analysis; post-talk digest instead).

Round 2 question: where do the speaker's notes live, and how do questions reach them?
-->

:root {
  /* Type */
  --font-sans:
    'Atkinson Hyperlegible Next', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --text-xs: 0.75rem;
  --text-sm: 0.875rem;
  --text-md: 1rem;
  --text-lg: 1.25rem;
  --text-xl: 1.5rem;
  --text-2xl: 2rem;
  --text-3xl: 2.75rem;
  --leading: 1.5;
  --caption-leading: 1.35;
  /* Speaker stage mode: captions and questions read from 10 m on a projector. */
  --stage-size: clamp(2.5rem, 4.6vw, 5.5rem);

  /* Space (4 px base) */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;

  /* Shape */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-pill: 999px;
  --border-w: 1px;
  --target-min: 44px;

  /* Motion */
  --dur-fast: 120ms;
  --dur-base: 220ms;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);

  /* Layers */
  --z-sticky: 10;
  --z-sheet: 40;
  --z-toast: 50;

  /* Layout */
  --side-w: 400px;
  --sheet-w: 420px;
}

/* Dark is the default: the stage and the room are dim, projectors glare. */
:root,
[data-theme='dark'] {
  color-scheme: dark;
  --color-bg: #0b0d12;
  --color-surface: #141821;
  --color-surface-2: #1d2230;
  --color-border: #2e3547;
  /* Edges that identify a control (inputs): 3:1 against every surface (WCAG 1.4.11). */
  --color-border-strong: #6e7891;
  --color-text: #eef1f6;
  --color-text-muted: #a9b1c2;
  --color-accent: #b69cff;
  --color-on-accent: #150a33;
  --color-focus: #5ad8ff;
  --color-ok: #4fd69c;
  --color-ok-bg: #0f2a20;
  --color-warn: #f5bd4f;
  --color-warn-bg: #2d2310;
  --color-crit: #ff7b7b;
  --color-crit-bg: #331617;
  --color-info: #79b8ff;
  --color-info-bg: #122238;
  --color-caption-bg: #05060a;
  --color-caption-text: #fffdf6;
  --color-caption-interim: #9aa3b5;
  --color-scrim: rgb(0 0 0 / 0.6);
}

[data-theme='light'] {
  color-scheme: light;
  --color-bg: #f5f6f8;
  --color-surface: #ffffff;
  --color-surface-2: #eceef3;
  --color-border: #cfd4de;
  --color-border-strong: #7c8496;
  --color-text: #10131c;
  --color-text-muted: #4a5266;
  --color-accent: #5b34d6;
  --color-on-accent: #ffffff;
  --color-focus: #0b57d0;
  --color-ok: #0a7a45;
  --color-ok-bg: #e3f5ec;
  --color-warn: #8a5a00;
  --color-warn-bg: #fdf1d8;
  --color-crit: #c0262d;
  --color-crit-bg: #fde6e6;
  --color-info: #1f5fbf;
  --color-info-bg: #e3eefc;
  --color-caption-bg: #ffffff;
  --color-caption-text: #0b0d12;
  --color-caption-interim: #5b6375;
  --color-scrim: rgb(16 19 28 / 0.45);
}

[data-theme='contrast'] {
  color-scheme: dark;
  --color-bg: #000000;
  --color-surface: #000000;
  --color-surface-2: #121212;
  --color-border: #ffffff;
  --color-border-strong: #ffffff;
  --color-text: #ffffff;
  --color-text-muted: #f0f0f0;
  --color-accent: #ffe14d;
  --color-on-accent: #000000;
  --color-focus: #00e5ff;
  --color-ok: #5cff9d;
  --color-ok-bg: #000000;
  --color-warn: #ffd23f;
  --color-warn-bg: #000000;
  --color-crit: #ff8a8a;
  --color-crit-bg: #000000;
  --color-info: #8fd0ff;
  --color-info-bg: #000000;
  --color-caption-bg: #000000;
  --color-caption-text: #ffff66;
  --color-caption-interim: #ffffff;
  --color-scrim: rgb(0 0 0 / 0.8);
  --border-w: 2px;
}

/* Caption sizes: L is the default; XXL fits about 3 words a line on a phone. */
:root,
[data-caption-size='l'] {
  --caption-size: 2.125rem;
}
[data-caption-size='s'] {
  --caption-size: 1.25rem;
}
[data-caption-size='m'] {
  --caption-size: 1.625rem;
}
[data-caption-size='xl'] {
  --caption-size: 2.75rem;
}
[data-caption-size='xxl'] {
  --caption-size: 3.625rem;
}

/* Readable spacing: the dyslexia-friendly option. Same font, more air. */
[data-readable='true'] {
  --readable-tracking: 0.04em;
  --readable-words: 0.14em;
  --leading: 1.7;
  --caption-leading: 1.7;
}

[data-motion='reduce'] {
  --dur-fast: 0ms;
  --dur-base: 0ms;
}
@media (prefers-reduced-motion: reduce) {
  :root {
    --dur-fast: 0ms;
    --dur-base: 0ms;
  }
}

/*
 * Lanyard UI: base styles and components. Import once, in main.tsx:
 *   import './ui/styles.css';
 * Classes are prefixed `ly-` and belong to the components in this folder.
 * Persona code composes components; it does not restyle `ly-` classes.
 */

/* ---------- Base ---------- */
*,
*::before,
*::after {
  box-sizing: border-box;
}
html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--text-md);
  line-height: var(--leading);
  letter-spacing: var(--readable-tracking, normal);
  word-spacing: var(--readable-words, normal);
}
a {
  color: var(--color-accent);
  text-underline-offset: 0.18em;
}
:focus-visible {
  outline: 3px solid var(--color-focus);
  outline-offset: 2px;
}
button,
input,
textarea,
select {
  font: inherit;
  letter-spacing: inherit;
  word-spacing: inherit;
}
.ly-sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}
.ly-muted {
  color: var(--color-text-muted);
}
.ly-num {
  font-variant-numeric: tabular-nums;
}
.ly-icon {
  width: 22px;
  height: 22px;
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ---------- Button / IconButton ---------- */
.ly-btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-height: var(--target-min);
  padding: 0 var(--space-4);
  border-radius: var(--radius-md);
  border: var(--border-w) solid var(--color-border);
  background: var(--color-surface-2);
  color: var(--color-text);
  font-size: var(--text-md);
  font-weight: 700;
  line-height: 1.2;
  text-decoration: none;
  cursor: pointer;
  transition: transform var(--dur-fast) var(--ease);
}
.ly-btn:active {
  transform: scale(0.97);
}
.ly-btn:disabled,
.ly-btn[aria-disabled='true'] {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}
.ly-btn--primary,
.ly-btn[aria-pressed='true'] {
  background: var(--color-accent);
  border-color: var(--color-accent);
  color: var(--color-on-accent);
}
.ly-btn--ghost {
  background: transparent;
  border-color: transparent;
}
.ly-btn--danger {
  background: var(--color-crit-bg);
  border-color: var(--color-crit);
  color: var(--color-crit);
}
.ly-btn--lg {
  min-height: 56px;
  font-size: var(--text-lg);
  border-radius: var(--radius-lg);
}
.ly-btn--block {
  width: 100%;
}
.ly-btn--stacked {
  flex-direction: column;
  gap: 3px;
  min-height: 60px;
  padding: var(--space-1);
  font-size: var(--text-xs);
}
.ly-btn--icon {
  padding: 0;
  width: var(--target-min);
}
.ly-btn__badge {
  position: absolute;
  top: 4px;
  right: 8px;
  min-width: 20px;
  padding: 0 6px;
  border-radius: var(--radius-pill);
  background: var(--color-accent);
  color: var(--color-on-accent);
  font-size: 11px;
  line-height: 18px;
}

/* ---------- StatusPill ---------- */
.ly-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px;
  border-radius: var(--radius-pill);
  border: var(--border-w) solid currentColor;
  font-size: var(--text-sm);
  font-weight: 700;
  line-height: 1.3;
  white-space: nowrap;
  color: var(--color-text-muted);
  background: var(--color-surface-2);
}
.ly-pill .ly-icon {
  width: 16px;
  height: 16px;
}
.ly-pill--ok {
  color: var(--color-ok);
  background: var(--color-ok-bg);
}
.ly-pill--warn {
  color: var(--color-warn);
  background: var(--color-warn-bg);
}
.ly-pill--crit,
.ly-pill--live {
  color: var(--color-crit);
  background: var(--color-crit-bg);
}
.ly-pill--info {
  color: var(--color-info);
  background: var(--color-info-bg);
}
.ly-pill--live::before {
  content: '';
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
  animation: ly-pulse 1.6s infinite;
}
@keyframes ly-pulse {
  50% {
    opacity: 0.35;
  }
}

/* ---------- Card ---------- */
.ly-card {
  padding: var(--space-4);
  border-radius: var(--radius-md);
  border: var(--border-w) solid var(--color-border);
  background: var(--color-surface);
}
.ly-card--flush {
  padding: 0;
}
.ly-card--selected {
  border-color: var(--color-accent);
  box-shadow: inset 3px 0 0 var(--color-accent);
}
.ly-card > h2,
.ly-card > h3 {
  margin: 0 0 var(--space-2);
  font-size: var(--text-lg);
}

/* ---------- Sheet / Drawer (native <dialog>) ---------- */
.ly-sheet {
  margin: auto 0 0;
  padding: 0;
  width: 100%;
  max-width: 100%;
  max-height: 86dvh;
  border: 0;
  border-top: var(--border-w) solid var(--color-border);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  background: var(--color-surface);
  color: var(--color-text);
}
.ly-sheet[open] {
  animation: ly-sheet-in var(--dur-base) var(--ease);
}
.ly-sheet::backdrop {
  background: var(--color-scrim);
}
.ly-sheet__inner {
  padding: var(--space-4) var(--space-4) var(--space-6);
}
.ly-sheet__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  margin-bottom: var(--space-3);
}
.ly-sheet__head h2 {
  margin: 0;
  font-size: var(--text-xl);
  line-height: 1.2;
}
.ly-sheet__desc {
  margin: 0 0 var(--space-4);
  color: var(--color-text-muted);
}
.ly-sheet--captions {
  background: var(--color-caption-bg);
}
@keyframes ly-sheet-in {
  from {
    transform: translateY(30px);
    opacity: 0;
  }
}
@media (min-width: 900px) {

.p-slide{aspect-ratio:16/9;border-radius:var(--radius-sm);background:#f3f1ea;color:#1b1b1f;padding:6%;display:flex;flex-direction:column;gap:8%;overflow:hidden;border:var(--border-w) solid var(--color-border)}
.p-slide b{font:700 clamp(10px,2.4cqw,28px)/1.15 Georgia,serif}
.p-slide i{display:block;height:7%;background:#c9c4b6;border-radius:3px}
.p-slide i:nth-child(3){width:80%}.p-slide i:nth-child(4){width:60%}
.p-notesin{display:flex;gap:8px}
.p-notesin .ly-input{min-height:44px}
.p-qa{display:grid;gap:var(--space-3);align-content:start}
.p-qa h2{margin:0;font-size:var(--text-2xl);line-height:1.2}

/* ============ VARIANT A: Notes + rail ============ */
.ra{height:100%;display:grid;grid-template-rows:auto auto 1fr;}
.ra-body{min-height:0;display:grid;grid-template-columns:1fr 340px}
.ra-body.qa{grid-template-columns:1fr 1.1fr}
.ra-notes{min-height:0;overflow:auto;padding:var(--space-6) var(--space-7);display:flex;flex-direction:column;gap:var(--space-5)}
.ra-notes .p-notes{flex:1}
.ra-rail{min-height:0;overflow:auto;border-left:var(--border-w) solid var(--color-border);background:var(--color-bg);padding:var(--space-4);display:grid;gap:var(--space-5);align-content:start}
.ra-rail section{display:grid;gap:var(--space-2)}
@container (max-width:700px){.ra-body,.ra-body.qa{grid-template-columns:minmax(0,1fr);grid-template-rows:1fr auto}.ra-notes{padding:var(--space-4)}.ra-rail{border-left:0;border-top:var(--border-w) solid var(--color-border);max-height:45cqh}}

/* ============ VARIANT B: Script follows your voice ============ */
.rb{height:100%;display:grid;grid-template-rows:auto auto auto 1fr auto}
.rb-cue{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) var(--space-5);font-weight:700;font-size:var(--text-lg);border-bottom:var(--border-w) solid currentColor;flex-wrap:wrap}
.rb-cue.crit{color:var(--color-crit);background:var(--color-crit-bg)}
.rb-cue.warn{color:var(--color-warn);background:var(--color-warn-bg)}
.rb-cue.ok{color:var(--color-ok);background:var(--color-ok-bg)}
.rb-cue span{color:var(--color-text)}
.rb-cue .grow{flex:1}
.rb-script{min-height:0;overflow:hidden;position:relative}
.rb-roll{position:absolute;left:var(--space-8);right:var(--space-8);font-size:calc(var(--notes-size,2rem)*1.15);line-height:1.45;max-width:36ch}
.rb-roll p{margin:0 0 .6em}
.rb-past{color:var(--color-text-muted)}
.rb-now{background:var(--color-surface-2);box-shadow:0 0 0 .15em var(--color-surface-2);border-radius:4px;border-bottom:3px solid var(--color-accent)}
.rb-marker{position:absolute;left:var(--space-4);top:33%;width:0;height:0;border:10px solid transparent;border-left:14px solid var(--color-accent)}
.rb-match{position:absolute;right:var(--space-4);bottom:var(--space-3)}
.rb-qa{padding:var(--space-6);overflow:auto}
@container (max-width:700px){.rb-roll{left:var(--space-6);right:var(--space-4)}.rb-cue{font-size:var(--text-sm);padding:var(--space-2) var(--space-3)}}

/* ============ VARIANT C: Companion strip ============ */
.rc{position:relative;height:100%;display:grid;grid-template-columns:minmax(0,1fr) 340px;background:#1e1e20}
.rc-key{display:grid;grid-template-rows:auto auto 1fr;gap:12px;padding:16px 16px 36px;font-family:-apple-system,system-ui,sans-serif;color:#e8e8ea;letter-spacing:normal;word-spacing:normal;min-height:0}
.rc-key .bar{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:#a0a0a6}
.rc-key .bar b{font-size:22px;color:#fff;font-variant-numeric:tabular-nums}
.rc-key .slides{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start}
.rc-key .slides small{display:block;font-size:12px;color:#a0a0a6;margin-bottom:4px}
.rc-key .knotes{background:#2a2a2d;border-radius:8px;padding:14px 18px;font-size:24px;line-height:1.4;overflow:hidden}
.rc-key .knotes ul{margin:0;padding-left:1.1em}
.rc-tag{position:absolute;left:16px;bottom:10px;font:12px system-ui;color:#8a8a90}
.rc-strip{display:grid;grid-template-rows:auto 1fr auto;background:var(--color-bg);border-left:4px solid #000;min-height:0}
.rc-strip .hd{display:flex;align-items:center;gap:8px;padding:var(--space-2) var(--space-3);border-bottom:var(--border-w) solid var(--color-border);font-size:var(--text-sm)}
.rc-strip .bd{min-height:0;overflow:auto;padding:var(--space-3);display:grid;gap:var(--space-4);align-content:start}
.rc-strip .ft{padding:var(--space-2) var(--space-3);border-top:var(--border-w) solid var(--color-border);display:flex;gap:6px}
.rc-strip .ft .ly-btn{flex:1;min-height:40px;font-size:var(--text-sm)}
.rc-big{font-size:var(--text-3xl);font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
@container (max-width:700px){.rc{grid-template-columns:minmax(0,1fr)}.rc-key,.rc-tag{display:none}}

/* ============ VARIANT D: Host handoff ============ */
.rd{height:100%;display:grid;grid-template-rows:auto auto 1fr}
.rd-body{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 360px}
.rd-notes{min-height:0;overflow:auto;padding:var(--space-6) var(--space-7);display:flex;flex-direction:column;gap:var(--space-5)}
.rd-notes .p-notes{flex:1}
.rd-side{min-height:0;border-left:var(--border-w) solid var(--color-border);padding:var(--space-4);display:grid;gap:var(--space-4);align-content:start;overflow:auto}
.rd-host{border:calc(var(--border-w)*2) solid var(--color-accent);border-radius:var(--radius-lg);padding:var(--space-4);background:var(--color-surface);display:grid;gap:var(--space-3)}
.rd-host h2{margin:0;font-size:var(--text-xl);line-height:1.25}
.rd-msg{display:flex;gap:8px;align-items:center;font-weight:700;padding:var(--space-2) var(--space-3);border-radius:var(--radius-md);background:var(--color-info-bg);color:var(--color-info)}
.rd-msg span{color:var(--color-text)}
.rd-hostview{min-height:0;display:grid;grid-template-columns:1.2fr 1fr}
.rd-hostview>section{min-height:0;overflow:auto;padding:var(--space-4);border-right:var(--border-w) solid var(--color-border);display:grid;gap:var(--space-3);align-content:start}
@container (max-width:700px){.rd-body,.rd-hostview{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}.rd-side{border-left:0;order:-1;border-bottom:var(--border-w) solid var(--color-border)}.rd-notes{padding:var(--space-4)}}

/* ============ VARIANT E: Presenter replacement ============ */
.re{height:100%;display:grid;grid-template-rows:auto auto 1fr}
.re-body{min-height:0;display:grid;grid-template-columns:1.25fr 1fr 300px;grid-template-rows:auto minmax(0,1fr);gap:var(--space-4);padding:var(--space-4)}
.re-cur{grid-column:1;grid-row:1}
.re-nxt{grid-column:2;grid-row:1;align-self:start}
.re-notes{grid-column:1/3;grid-row:2;min-height:0;overflow:auto;background:var(--color-surface);border-radius:var(--radius-md);padding:var(--space-4) var(--space-5);--notes-size:1.6rem}
.re-rail{grid-column:3;grid-row:1/3;min-height:0;overflow:auto;display:grid;gap:var(--space-3);align-content:start}
.re-up{display:flex;gap:var(--space-2);align-items:center;padding:var(--space-2) var(--space-3);border:var(--border-w) dashed var(--color-border);border-radius:var(--radius-md);font-size:var(--text-sm);color:var(--color-text-muted)}
@container (max-width:700px){.re-body{grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-auto-rows:max-content;overflow:auto}.re-cur,.re-nxt,.re-notes,.re-rail{grid-column:auto;grid-row:auto}.re-nxt{display:none}}

<body>
<form class="h-bar" id="ctl" aria-label="Prototype controls">

<script>
const BELIEFS={
 a:"<b>A · Notes + rail.</b> Lanyard is the presenter view. Paste your notes per slide; they fill the screen in big type. A narrow rail shows only room cues that need action, plus a question count. Q&amp;A time widens the rail into the queue. You step notes with ← →. A clicker drives Keynote, not this window, so notes can drift from the slides.",
 b:"<b>B · Script follows your voice.</b> Paste a script; the live captions find your place in it, so nothing needs advancing and the clicker stays with Keynote. Room cues appear as one band, only when needed. Q&amp;A time replaces the script with the queue.",
 c:"<b>C · Companion strip.</b> Your notes already live in Keynote's presenter display; don't rebuild it. Lanyard is a slim window beside it: time left, the one cue that matters, attendance, and the top question. (Shown next to a mock Keynote presenter display.)",
 d:"<b>D · Host handoff.</b> During the talk the speaker never browses questions. A host curates the queue and sends one question, or a note like \"5 min left\", to a single card on the speaker's screen. Notes fill the rest. (The toggle in the top bar shows the host's screen.)",
 e:"<b>E · Presenter replacement.</b> Lanyard owns the deck: upload a PDF and present from it. Current and next slide, notes, cues and questions in one tool, so captions and questions line up with slides. (Pushback candidate: rebuilds Keynote's presenter view and widens scope.)"
};
const IC={slower:'M12 14l-4-4|M3.3 17A9 9 0 1 1 20.7 17',louder:'M11 5 6 9H2v6h4l5 4V5z|M15.5 8.5a5 5 0 0 1 0 7|M19 5a10 10 0 0 1 0 14',cant_see:'m3 3 18 18|M10.6 10.6a2 2 0 0 0 2.8 2.8|M9.9 5.1A10 10 0 0 1 12 5c6 0 10 7 10 7a17 17 0 0 1-3.2 4|M6.6 6.6C3.8 8.4 2 12 2 12s4 7 10 7a9.7 9.7 0 0 0 5.4-1.6',lost:'M12 2a10 10 0 1 0 0 20a10 10 0 1 0 0-20|M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3|M12 17h.01',thumbs_up:'M7 10v12|M15 5.9 14 10h5.8a2 2 0 0 1 1.9 2.6l-2.3 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.8a2 2 0 0 0 1.8-1.1L12 2a3.1 3.1 0 0 1 3 3.9z',people:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2|M9 3a4 4 0 1 0 0 8a4 4 0 1 0 0-8|M22 21v-2a4 4 0 0 0-3-3.9|M16 3.1a4 4 0 0 1 0 7.8',mic:'M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z|M19 10v2a7 7 0 0 1-14 0v-2|M12 19v3',check:'M20 6 9 17l-5-5',warn:'M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z|M12 9v4|M12 17h.01',crit:'M7.9 2h8.2L22 7.9v8.2L16.1 22H7.9L2 16.1V7.9z|M15 9l-6 6|m9 9 6 6',list:'M8 6h13|M8 12h13|M8 18h13|M3 6h.01|M3 12h.01|M3 18h.01',next:'M5 12h14|m12 5 7 7-7 7',up:'M12 19V5|m5 12 7-7 7 7',send:'m22 2-7 20-4-9-9-4z|M22 2 11 13',info:'M12 2a10 10 0 1 0 0 20a10 10 0 1 0 0-20|M12 16v-4|M12 8h.01',clock:'M12 2a10 10 0 1 0 0 20a10 10 0 1 0 0-20|M12 6v6l4 2',upload:'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4|m17 8-5-5-5 5|M12 3v12'};
const ic=(n,c='')=>`<svg class="ly-icon ${c}" viewBox="0 0 24 24" aria-hidden="true">${IC[n].split('|').map(d=>`<path d="${d}"/>`).join('')}</svg>`;

/* ---------- Fixture ---------- */
const SLIDES=[
 {t:"Title",n:["Thank the organisers. Ask: who has run eBPF in production?"]},
 {t:"Why security folks should care",n:["Every exec, file open, connection.","Low overhead: we'll prove it later."]},
 {t:"A sensor, not a firewall",n:["The classic mistake.","Story: the team that blocked their own kubectl."]},
 {t:"Anatomy of a hook",n:["Kprobe vs LSM hook: one sentence each.","Don't go deeper than the diagram."]},
 {t:"Live trace: compromised pod",n:["Point at the shell spawn, then the outbound IP.","Pause. Let them read it."]},
 {t:"Tetragon vs Falco",n:["Tetragon enforces in-kernel; Falco alerts.","Same hooks underneath: not a religious choice."]},
 {t:"Overhead, measured",n:["Under 2% CPU, ~40 policies, busy node.","Methodology is in the repo: don't read the table out.","If asked about 500+ nodes: we tested 300, say so."]},
 {t:"Tuning: the part people skip",n:["Default rules page you for every kubectl exec.","Show the noisy-rule chart."]},
 {t:"The rollout pattern",n:["Observe-only, baseline a week.","Promote noisy rules to enforcement one at a time."]},
 {t:"Policy example",n:["Selector: binary path + namespace label together."]},
 {t:"What to take away",n:["Sensor first, enforcement second, always baseline."]},
 {t:"Questions",n:["Take 3, then point to the repo."]},
];
const SCRIPT=[
 "Now, the overhead question, because someone always asks it.",
 "We measured under two percent CPU on a busy node with about forty policies loaded.",
 "The methodology is in the repo, so I won't read the table out.",
 "And if you're wondering about five hundred nodes and up: we tested three hundred, and I'll be honest about that.",
 "Which brings us to the part people skip: tuning.",
 "Default rules will page you about every kubectl exec your own SREs run.",
 "The pattern we recommend: start in observe-only, baseline a week, then promote the noisy rules to enforcement one at a time.",
];
const QS=[
 {l:"Overhead on large clusters?",n:14,v:31},
 {l:"Kernel version requirements",n:6,v:12},
 {l:"Running alongside a service mesh",n:3,v:7},
 {l:"Tetragon vs Falco: when to pick which?",n:5,v:6},
 {l:"Getting started on EKS",n:1,v:2},
 {l:"Can enforcement break running workloads?",n:2,v:2},
];
const LONGQ={l:"How do you structure ownership, review and audit of runtime policies across forty tenant teams without letting a tenant weaken the security baseline?",n:213,v:1204};

const S={v:'a',s:'live',w:'laptop',t:'dark',bare:false,slide:6,host:false,answered:{}};
function data(){
 const lots=S.s==='lots',empty=S.s==='empty';
 const att=lots?2184:empty?37:142;
 const sig=empty?{slower:0,lost:0,louder:0,cant_see:0,thumbs_up:0}:lots?{slower:212,lost:1332,louder:40,cant_see:18,thumbs_up:96}:S.s==='qa'?{slower:0,lost:2,louder:9,cant_see:0,thumbs_up:58}:{slower:8,lost:23,louder:2,cant_see:0,thumbs_up:41};
 let qs=empty||S.s==='loading'?[]:lots?[LONGQ,...QS.map(q=>({...q,n:q.n*9,v:q.v*11}))]:QS;
 if(lots)for(let i=0;i<33;i++)qs=qs.concat({l:`Question cluster ${i+8}`,n:3,v:2});
 qs=qs.filter(q=>!S.answered[q.l]);
 const title=lots?"eBPF for Security Folks: Tracing Without Tears, Enforcing Without Fear, and Everything We Learned Running Tetragon at Scale Across 4,000 Nodes":"eBPF for Security Folks: Tracing Without Tears";
 const time=empty?{e:'0:00',left:'Starts in 4 min',low:false}:S.s==='qa'?{e:'27:40',left:'2:20 left',low:true}:lots?{e:'28:50',left:'1:10 left',low:true}:{e:'24:10',left:'5:50 left',low:false};
 const slide=empty?0:S.s==='qa'?11:S.slide;
 return {lots,empty,att,sig,qs,title,time,slide,qa:S.s==='qa'};
}
const SIGL={slower:'Slower',louder:'Louder',cant_see:"Can't see",lost:'Lost me',thumbs_up:'Got it'};
const TIP={lost:'Recap the last point.',slower:'Pause on this slide.',louder:'Closer to the mic.',cant_see:'Read the slide out.'};
function tone(k,n,att){if(k==='thumbs_up')return null;const r=n/Math.max(att,1);return r>=.15?'crit':r>=.05?'warn':null}
function cues(d){return ['lost','slower','louder','cant_see'].map(k=>({k,t:tone(k,d.sig[k],d.att),n:d.sig[k]})).filter(c=>c.t).sort((a,b)=>(a.t==='crit'?0:1)-(b.t==='crit'?0:1))}
const fmt=n=>n.toLocaleString();

/* ---------- Shared pieces ---------- */
function topBar(d,extra=''){return `<header class="p-top">${d.empty?'<span class="ly-pill">Not started</span>':'<span class="ly-pill ly-pill--live">LIVE</span>'}<span class="t">${d.title}</span><span class="p-time ${d.time.low?'low':''}"><b>${d.time.e}</b><span>${d.time.left}</span></span>${extra}</header>`}
function capBtn(d){if(S.s==='error')return `<span class="ly-pill ly-pill--warn">${ic('mic')}Typed notes</span>`;return d.empty?`<button class="ly-btn ly-btn--primary" data-act="start">${ic('mic')}Start captions<span class="p-kbd">C</span></button>`:`<span class="ly-pill">${ic('mic')}Captions on</span>`}
function banner(){return S.s==='error'?`<div class="ly-banner" role="status">${ic('mic')}<span>This browser can't caption speech. Use Chrome, or type short live notes; the room sees them as captions.</span></div>`:'<div></div>'}
function typed(){return S.s==='error'?`<form class="p-notesin" data-form="n"><label class="ly-sr-only" for="tn">Live note</label><input id="tn" class="ly-input" placeholder="Live note for the room, Enter to send"><button class="ly-btn ly-btn--primary" type="submit">Send</button></form>`:''}
function cueCard(c){return `<div class="p-cue ${c.t}" role="status">${ic(c.k)}<div><b>${SIGL[c.k]} · ${fmt(c.n)}</b><span>${TIP[c.k]}</span></div></div>`}
function calm(d){return d.empty?`<div class="p-cue info">${ic('people')}<div><b>${d.att} joined</b><span>Cues appear here when the room needs something.</span></div></div>`:`<div class="p-cue ok">${ic('thumbs_up')}<div><b>Room's with you</b><span>${d.sig.thumbs_up} got it in the last minute</span></div></div>`}
function notesBlock(d,i=d.slide){const s=SLIDES[i];if(S.s==='loading')return `<div aria-busy="true">${[80,65,90].map(w=>`<span class="ly-skeleton" style="width:${w}%;height:1.6em;margin-bottom:.6em"></span>`).join('')}</div>`;
 const extra=d.lots?["Extra: if they push on 4,000 nodes, the per-node cost stays flat; the control plane is what grows.","Mention the ring-buffer sizing gotcha and the kernel 5.8 requirement for BPF ring buffers.","Do NOT promise numbers for Windows nodes."]:[];
 return `<div><div class="p-slide-h"><b>${s.t}</b><span>Slide ${i+1} of ${SLIDES.length}</span></div><div class="p-notes"><ul>${s.n.concat(extra).map(x=>`<li>${x}</li>`).join('')}</ul></div></div>`}
function nextBlock(i){const n=SLIDES[i+1];return n?`<div class="p-next">Next: <b>${n.t}</b></div>`:''}
function qList(d,limit,act){if(S.s==='loading')return '<span class="ly-skeleton" style="height:120px"></span>';if(!d.qs.length)return `<p class="ly-muted" style="margin:0">No questions yet.</p>`;return `<ul class="p-qmini">${d.qs.slice(0,limit).map(q=>`<li><b>${q.l}</b><span>${fmt(q.n)} asked · ${fmt(q.v)} votes</span></li>`).join('')}</ul>${d.qs.length>limit?`<p class="ly-muted" style="margin:6px 0 0;font-size:var(--text-sm)">+ ${d.qs.length-limit} more</p>`:''}`}
function qaPanel(d,big){const q=d.qs[0];if(!q)return `<div class="ly-empty"><strong class="ly-empty__title">No open questions</strong></div>`;
 return `<div class="p-qa"><span class="p-label">Question 1 of ${d.qs.length} · most votes</span><h2 style="font-size:${big?'var(--text-3xl)':'var(--text-2xl)'}">${q.l}</h2><span class="ly-muted">${fmt(q.n)} people asked · ${fmt(q.v)} votes</span><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="ly-btn ly-btn--primary" data-act="answered">${ic('check')}Answered, next<span class="p-kbd">A</span></button><button class="ly-btn" data-act="skip">${ic('next')}Skip<span class="p-kbd">N</span></button><button class="ly-btn ly-btn--ghost" data-act="qa">Back to notes<span class="p-kbd">Q</span></button></div><span class="p-label" style="margin-top:var(--space-3)">Up next</span>${qList({...d,qs:d.qs.slice(1)},4)}</div>`}
function slideThumb(i){const s=SLIDES[Math.min(i,SLIDES.length-1)];return `<div class="p-slide" role="img" aria-label="Slide ${i+1}: ${s.t}"><b>${s.t}</b><i></i><i></i><i></i></div>`}

/* ---------- Variants ---------- */
const V={
 a(d){const cs=cues(d);
  const rail=d.qa?`<aside class="ra-rail" aria-label="Q&amp;A">${qaPanel(d)}</aside>`:`<aside class="ra-rail" aria-label="Room">
   <section><span class="p-label">Room</span>${cs.length?cs.map(cueCard).join(''):calm(d)}<div class="p-mini"><span class="ly-pill">${ic('people')}${fmt(d.att)} here</span></div></section>
   <section><span class="p-label">Questions · ${d.qs.length}</span>${qList(d,3)}${d.qs.length?`<button class="ly-btn" data-act="qa">${ic('list')}Take questions<span class="p-kbd">Q</span></button>`:''}</section></aside>`;
  return `<div class="ra">${banner()}${topBar(d,capBtn(d))}<div class="ra-body ${d.qa?'qa':''}"><main class="ra-notes" aria-label="Your notes">${notesBlock(d)}${typed()}${nextBlock(d.slide)}<div class="ly-muted" style="font-size:var(--text-sm)">← → step notes · Your clicker drives Keynote, not this window</div></main>${rail}</div></div>`},

 b(d){const cs=cues(d);const c=cs[0];
  const band=d.empty?`<div class="rb-cue" style="color:var(--color-text-muted);background:var(--color-surface)">${ic('people')}<span>${d.att} joined. The script starts following you when captions start.</span></div>`
   :c?`<div class="rb-cue ${c.t}" role="status">${ic(c.k)}${SIGL[c.k]} · ${fmt(c.n)} <span>${TIP[c.k]}</span><span class="grow"></span><span class="ly-muted" style="font-weight:400">${fmt(d.qs.length)} questions waiting · Q</span></div>`
   :`<div class="rb-cue ok" role="status">${ic('thumbs_up')}<span>Room's with you</span><span class="grow"></span><span class="ly-muted" style="font-weight:400">${d.qs.length} questions waiting · Q</span></div>`;
  if(d.qa)return `<div class="rb">${banner()}${topBar(d,'')}${band}<main class="rb-qa">${qaPanel(d,true)}</main><div></div></div>`;
  const nowI=d.empty?0:2;const manual=S.s==='error';
  const paras=SCRIPT.map((t,i)=>`<p class="${i<nowI?'rb-past':''}">${i===nowI&&!d.empty?`<span class="rb-now">${t}</span>`:t}</p>`).join('');
  const body=S.s==='loading'?'<div style="padding:var(--space-6)"><span class="ly-skeleton" style="height:3em;margin-bottom:1em"></span><span class="ly-skeleton" style="height:3em;width:70%"></span></div>'
   :`<span class="rb-marker" aria-hidden="true"></span><div class="rb-roll" data-roll data-now="${nowI}">${paras}</div><div class="rb-match">${manual?`<span class="ly-pill ly-pill--warn">${ic('warn')}Can't follow your voice here: ↑ ↓ to scroll</span>`:d.empty?'<span class="ly-pill">Waiting for captions</span>':`<span class="ly-pill ly-pill--info">${ic('mic')}Following your voice</span>`}</div>`;
  return `<div class="rb">${banner()}${topBar(d,capBtn(d))}${band}<main class="rb-script" aria-label="Your script">${body}</main>${typed()?`<div style="padding:var(--space-3) var(--space-5)">${typed()}</div>`:'<div></div>'}</div>`},

 c(d){const cs=cues(d);const s=SLIDES[d.slide];
  const key=`<section class="rc-key" aria-label="Keynote presenter display (mock)"><div class="bar"><span>Keynote · Presenter Display (mock)</span><span><b>${d.time.e}</b> elapsed</span></div><div class="slides"><div><small>Current slide</small>${slideThumb(d.slide)}</div><div><small>Next</small>${slideThumb(d.slide+1)}</div></div><div class="knotes"><ul>${s.n.map(x=>`<li>${x}</li>`).join('')}</ul></div></section>`;
  const strip=`<aside class="rc-strip" aria-label="Lanyard"><div class="hd">${d.empty?'<span class="ly-pill">Not started</span>':'<span class="ly-pill ly-pill--live">LIVE</span>'}<b style="flex:1">Lanyard</b>${S.s==='error'?`<span class="ly-pill ly-pill--warn">${ic('mic')}No captions</span>`:''}</div>
   <div class="bd">${S.s==='error'?`<div class="ly-banner">${ic('mic')}<span>Can't caption in this browser. Use Chrome.</span></div>`:''}
    <div><span class="p-label">Time left</span><div class="rc-big" style="${d.time.low?'color:var(--color-warn)':''}">${d.time.left.replace(' left','')}</div></div>
    ${cs.length?cueCard(cs[0]):calm(d)}${cs.length>1?`<div class="p-mini">${cs.slice(1).map(c=>`<span class="ly-pill ly-pill--${c.t}">${ic(c.k)}${SIGL[c.k]} · ${fmt(c.n)}</span>`).join('')}</div>`:''}
    <div><span class="p-label">${d.qa?'Answering now':'Top question'} · ${d.qs.length} open</span>${S.s==='loading'?'<span class="ly-skeleton" style="height:60px;margin-top:6px"></span>':d.qs[0]?`<p style="margin:6px 0 2px;font-size:${d.qa?'var(--text-2xl)':'var(--text-lg)'};font-weight:700;line-height:1.25">${d.qs[0].l}</p><span class="ly-muted" style="font-size:var(--text-sm)">${fmt(d.qs[0].n)} asked · ${fmt(d.qs[0].v)} votes</span>`:`<p class="ly-muted" style="margin:6px 0 0">None yet.</p>`}</div>
    <div class="p-mini"><span class="ly-pill">${ic('people')}${fmt(d.att)} here</span></div>${typed()}</div>
   <div class="ft">${d.empty?`<button class="ly-btn ly-btn--primary" data-act="start">${ic('mic')}Start captions</button>`:`<button class="ly-btn" data-act="answered" ${d.qs.length?'':'disabled'}>${ic('check')}Answered</button><button class="ly-btn" data-act="skip" ${d.qs.length?'':'disabled'}>${ic('next')}Next</button>`}</div></aside>`;
  return `<div class="rc">${key}${strip}<span class="rc-tag">Two windows side by side on the speaker's laptop: Keynote (mock, left) and Lanyard (right)</span></div>`},

 d(d){const cs=cues(d);
  const toggle=`<button class="ly-btn" data-act="host" aria-pressed="${S.host}" style="min-height:36px;font-size:var(--text-sm)">${S.host?'Host screen':'Show host screen'}</button>`;
  if(S.host){
   return `<div class="rd">${banner()}${topBar(d,toggle)}<div class="rd-hostview"><section aria-label="Queue"><span class="p-label">Host · question queue · ${d.qs.length}</span>${S.s==='loading'?'<span class="ly-skeleton" style="height:200px"></span>':`<ul class="p-qmini">${d.qs.slice(0,6).map((q,i)=>`<li style="display:flex;gap:8px;align-items:center"><div style="flex:1"><b>${q.l}</b><span>${fmt(q.n)} asked · ${fmt(q.v)} votes</span></div><button class="ly-btn ${i===0&&d.qa?'ly-btn--primary':''}" style="min-height:36px;font-size:var(--text-sm)">${ic('send')}${i===0&&d.qa?'Sent':'Send'}</button></li>`).join('')}</ul>`}</section><section aria-label="Room and messages"><span class="p-label">Room</span>${cs.length?cs.map(cueCard).join(''):calm(d)}<span class="p-label">Message the speaker</span><div class="p-mini">${['5 min left','Wrap up','Louder please','Slow down'].map(m=>`<button class="ly-btn" style="min-height:36px;font-size:var(--text-sm)">${m}</button>`).join('')}</div><form class="p-notesin"><label class="ly-sr-only" for="hm">Message</label><input id="hm" class="ly-input" placeholder="Custom message"><button class="ly-btn ly-btn--primary" type="button">Send</button></form></section></div></div>`}
  const hostQ=d.qa||d.lots?d.qs[0]:null;
  const msg=d.lots?`<div class="rd-msg">${ic('clock')}<span>Host: 1 min left, take one question</span></div>`:S.s==='live'?`<div class="rd-msg">${ic('info')}<span>Host: 5 min left</span></div>`:'';
  return `<div class="rd">${banner()}${topBar(d,capBtn(d)+toggle)}<div class="rd-body"><main class="rd-notes" aria-label="Your notes">${notesBlock(d)}${typed()}${nextBlock(d.slide)}</main><aside class="rd-side" aria-label="From your host and the room">
   <div class="rd-host" role="status"><span class="p-label">From your host · Sam</span>${hostQ?`<h2>${hostQ.l}</h2><span class="ly-muted">${fmt(hostQ.n)} people asked</span><button class="ly-btn ly-btn--primary" data-act="answered">${ic('check')}Done, ready for next</button>`:`<p style="margin:0;font-size:var(--text-lg)">${d.empty?'Sam is hosting. Questions come through Sam.':'Sam is holding questions until Q&amp;A.'}</p><span class="ly-muted">${d.qs.length} in the queue</span>`}</div>
   ${msg}${cs.length?cueCard(cs[0]):calm(d)}<div class="p-mini"><span class="ly-pill">${ic('people')}${fmt(d.att)} here</span></div></aside></div></div>`},

 e(d){const cs=cues(d);
  if(d.empty)return `<div class="re">${banner()}${topBar(d,capBtn(d))}<div style="display:grid;place-items:center;padding:var(--space-6)"><div class="ly-empty" style="max-width:520px">${ic('upload','ly-empty__icon')}<strong class="ly-empty__title">Drop your deck here (PDF)</strong><p class="ly-empty__body">Lanyard opens a stage window for the projector and keeps your notes, the room and questions in sync with each slide. Paste your notes per slide afterwards: PDFs don't reliably carry speaker notes.</p><div class="ly-empty__action"><button class="ly-btn ly-btn--primary">${ic('upload')}Choose PDF</button></div></div></div></div>`;
  return `<div class="re">${banner()}${topBar(d,capBtn(d))}<div class="re-body"><div class="re-cur"><span class="p-label">On the projector · ${d.slide+1}/${SLIDES.length}</span>${slideThumb(d.slide)}</div><div class="re-nxt"><span class="p-label">Next</span>${slideThumb(d.slide+1)}<div class="re-up" style="margin-top:var(--space-3)">${ic('next')}Clicker and → advance slides and notes together</div></div>
   <main class="re-notes" aria-label="Notes">${notesBlock(d)}${typed()}</main>
   <aside class="re-rail" aria-label="Room">${d.qa?qaPanel(d):`${cs.length?cs.map(cueCard).join(''):calm(d)}<span class="p-label">Asked during this slide</span>${qList({...d,qs:d.qs.slice(0,2)},2)}<button class="ly-btn" data-act="qa">${ic('list')}All ${d.qs.length} questions<span class="p-kbd">Q</span></button>`}<div class="p-mini"><span class="ly-pill">${ic('people')}${fmt(d.att)} here</span></div></aside></div></div>`},
};

/* ---------- Render ---------- */
const SIZES={laptop:[1440,900],monitor:[1920,1080],phone:[390,800]};
const fitEl=document.getElementById('fit'),frame=document.getElementById('frame');
function render(){
 document.documentElement.dataset.theme=S.t;
 const [w,h]=SIZES[S.w];const k=Math.min(1,Math.max(320,window.innerWidth-40)/w);
 frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform=`scale(${k})`;
 frame.className='frame'+(S.w==='phone'?' phone':'');
 frame.style.setProperty('--notes-size',S.w==='monitor'?'2.6rem':S.w==='phone'?'1.35rem':'2rem');
 fitEl.style.width=w*k+'px';fitEl.style.height=h*k+'px';
 document.getElementById('belief').innerHTML=BELIEFS[S.v];
 frame.innerHTML=V[S.v](data());
 // Script variant: put the current sentence on the marker line (a third of the way down).
 const roll=frame.querySelector('[data-roll]');
 if(roll){const now=roll.children[+roll.dataset.now];const box=roll.parentElement;roll.style.top=(box.clientHeight*0.33-(now?now.offsetTop:0)-8)+'px'}
}
document.getElementById('ctl').addEventListener('change',e=>{const f=e.target;S[f.name]=f.value;S.host=false;render()});
window.addEventListener('resize',render);
function act(a){const d=data();
 if(a==='start'){S.s='live';syncCtl()}
 if(a==='qa'){S.s=S.s==='qa'?'live':'qa';syncCtl()}
 if(a==='answered'&&d.qs[0])S.answered[d.qs[0].l]=true;
 if(a==='skip'&&d.qs[0]){const i=QS.findIndex(q=>q.l===d.qs[0].l);if(i>=0)QS.push(QS.splice(i,1)[0])}
 if(a==='host')S.host=!S.host;
 if(a==='prev')S.slide=Math.max(0,S.slide-1);
 if(a==='next')S.slide=Math.min(SLIDES.length-2,S.slide+1);
 render()}
frame.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b)act(b.dataset.act)});
frame.addEventListener('submit',e=>{e.preventDefault()});
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea'))return;const k=e.key.toLowerCase();if(k==='arrowright')act('next');if(k==='arrowleft')act('prev');if(k==='q')act('qa');if(k==='a')act('answered');if(k==='n')act('skip');if(k==='c'&&S.s==='empty')act('start')});
function syncCtl(){const c=document.getElementById('ctl');for(const k of ['v','s','w','t']){const i=c.querySelector(`input[name=${k}][value="${S[k]}"]`);if(i)i.checked=true}}
// Deep link: grill-speaker.html#v=d&s=qa&w=monitor&t=light&host=true&bare=true
for(const [k,v] of new URLSearchParams(location.hash.slice(1)))S[k]=v==='true'?true:v==='false'?false:k==='slide'?+v:v;
if(S.bare){document.documentElement.dataset.motion='reduce';document.querySelector('.h-bar').style.display='none';document.getElementById('belief').style.display='none';document.querySelector('.h-stage').style.padding='20px'}
syncCtl();render();
</script>
</body>
</html>
