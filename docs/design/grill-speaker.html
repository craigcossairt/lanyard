:root {
  /* Type */
  --font-sans:
    'Atkinson Hyperlegible Next', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --text-xs: 0.75rem;
  --text-sm: 0.875rem;
  --text-md: 1rem;
  --text-lg: 1.25rem;
  --text-xl: 1.5rem;
  --text-2xl: 2rem;
  --text-3xl: 2.75rem;
  --leading: 1.5;
  --caption-leading: 1.35;
  /* Speaker stage mode: captions and questions read from 10 m on a projector. */
  --stage-size: clamp(2.5rem, 4.6vw, 5.5rem);

  /* Space (4 px base) */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;

  /* Shape */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-pill: 999px;
  --border-w: 1px;
  --target-min: 44px;

  /* Motion */
  --dur-fast: 120ms;
  --dur-base: 220ms;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);

  /* Layers */
  --z-sticky: 10;
  --z-sheet: 40;
  --z-toast: 50;

  /* Layout */
  --side-w: 400px;
  --sheet-w: 420px;
}

/* Dark is the default: the stage and the room are dim, projectors glare. */
:root,
[data-theme='dark'] {
  color-scheme: dark;
  --color-bg: #0b0d12;
  --color-surface: #141821;
  --color-surface-2: #1d2230;
  --color-border: #2e3547;
  /* Edges that identify a control (inputs): 3:1 against every surface (WCAG 1.4.11). */
  --color-border-strong: #6e7891;
  --color-text: #eef1f6;
  --color-text-muted: #a9b1c2;
  --color-accent: #b69cff;
  --color-on-accent: #150a33;
  --color-focus: #5ad8ff;
  --color-ok: #4fd69c;
  --color-ok-bg: #0f2a20;
  --color-warn: #f5bd4f;
  --color-warn-bg: #2d2310;
  --color-crit: #ff7b7b;
  --color-crit-bg: #331617;
  --color-info: #79b8ff;
  --color-info-bg: #122238;
  --color-caption-bg: #05060a;
  --color-caption-text: #fffdf6;
  --color-caption-interim: #9aa3b5;
  --color-scrim: rgb(0 0 0 / 0.6);
}

[data-theme='light'] {
  color-scheme: light;
  --color-bg: #f5f6f8;
  --color-surface: #ffffff;
  --color-surface-2: #eceef3;
  --color-border: #cfd4de;
  --color-border-strong: #7c8496;
  --color-text: #10131c;
  --color-text-muted: #4a5266;
  --color-accent: #5b34d6;
  --color-on-accent: #ffffff;
  --color-focus: #0b57d0;
  --color-ok: #0a7a45;
  --color-ok-bg: #e3f5ec;
  --color-warn: #8a5a00;
  --color-warn-bg: #fdf1d8;
  --color-crit: #c0262d;
  --color-crit-bg: #fde6e6;
  --color-info: #1f5fbf;
  --color-info-bg: #e3eefc;
  --color-caption-bg: #ffffff;
  --color-caption-text: #0b0d12;
  --color-caption-interim: #5b6375;
  --color-scrim: rgb(16 19 28 / 0.45);
}

[data-theme='contrast'] {
  color-scheme: dark;
  --color-bg: #000000;
  --color-surface: #000000;
  --color-surface-2: #121212;
  --color-border: #ffffff;
  --color-border-strong: #ffffff;
  --color-text: #ffffff;
  --color-text-muted: #f0f0f0;
  --color-accent: #ffe14d;
  --color-on-accent: #000000;
  --color-focus: #00e5ff;
  --color-ok: #5cff9d;
  --color-ok-bg: #000000;
  --color-warn: #ffd23f;
  --color-warn-bg: #000000;
  --color-crit: #ff8a8a;
  --color-crit-bg: #000000;
  --color-info: #8fd0ff;
  --color-info-bg: #000000;
  --color-caption-bg: #000000;
  --color-caption-text: #ffff66;
  --color-caption-interim: #ffffff;
  --color-scrim: rgb(0 0 0 / 0.8);
  --border-w: 2px;
}

/* Caption sizes: L is the default; XXL fits about 3 words a line on a phone. */
:root,
[data-caption-size='l'] {
  --caption-size: 2.125rem;
}
[data-caption-size='s'] {
  --caption-size: 1.25rem;
}
[data-caption-size='m'] {
  --caption-size: 1.625rem;
}
[data-caption-size='xl'] {
  --caption-size: 2.75rem;
}
[data-caption-size='xxl'] {
  --caption-size: 3.625rem;
}

/* Readable spacing: the dyslexia-friendly option. Same font, more air. */
[data-readable='true'] {
  --readable-tracking: 0.04em;
  --readable-words: 0.14em;
  --leading: 1.7;
  --caption-leading: 1.7;
}

[data-motion='reduce'] {
  --dur-fast: 0ms;
  --dur-base: 0ms;
}
@media (prefers-reduced-motion: reduce) {
  :root {
    --dur-fast: 0ms;
    --dur-base: 0ms;
  }
}

/*
 * Lanyard UI: base styles and components. Import once, in main.tsx:
 *   import './ui/styles.css';
 * Classes are prefixed `ly-` and belong to the components in this folder.
 * Persona code composes components; it does not restyle `ly-` classes.
 */

/* ---------- Base ---------- */
*,
*::before,
*::after {
  box-sizing: border-box;
}
html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--text-md);
  line-height: var(--leading);
  letter-spacing: var(--readable-tracking, normal);
  word-spacing: var(--readable-words, normal);
}
a {
  color: var(--color-accent);
  text-underline-offset: 0.18em;
}
:focus-visible {
  outline: 3px solid var(--color-focus);
  outline-offset: 2px;
}
button,
input,
textarea,
select {
  font: inherit;
  letter-spacing: inherit;
  word-spacing: inherit;
}
.ly-sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}
.ly-muted {
  color: var(--color-text-muted);
}
.ly-num {
  font-variant-numeric: tabular-nums;
}
.ly-icon {
  width: 22px;
  height: 22px;
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ---------- Button / IconButton ---------- */
.ly-btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-height: var(--target-min);
  padding: 0 var(--space-4);
  border-radius: var(--radius-md);
  border: var(--border-w) solid var(--color-border);
  background: var(--color-surface-2);
  color: var(--color-text);
  font-size: var(--text-md);
  font-weight: 700;
  line-height: 1.2;
  text-decoration: none;
  cursor: pointer;
  transition: transform var(--dur-fast) var(--ease);
}
.ly-btn:active {
  transform: scale(0.97);
}
.ly-btn:disabled,
.ly-btn[aria-disabled='true'] {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}
.ly-btn--primary,
.ly-btn[aria-pressed='true'] {
  background: var(--color-accent);
  border-color: var(--color-accent);
  color: var(--color-on-accent);
}
.ly-btn--ghost {
  background: transparent;
  border-color: transparent;
}
.ly-btn--danger {
  background: var(--color-crit-bg);
  border-color: var(--color-crit);
  color: var(--color-crit);
}
.ly-btn--lg {
  min-height: 56px;
  font-size: var(--text-lg);
  border-radius: var(--radius-lg);
}
.ly-btn--block {
  width: 100%;
}
.ly-btn--stacked {
  flex-direction: column;
  gap: 3px;
  min-height: 60px;
  padding: var(--space-1);
  font-size: var(--text-xs);
}
.ly-btn--icon {
  padding: 0;
  width: var(--target-min);
}
.ly-btn__badge {
  position: absolute;
  top: 4px;
  right: 8px;
  min-width: 20px;
  padding: 0 6px;
  border-radius: var(--radius-pill);
  background: var(--color-accent);
  color: var(--color-on-accent);
  font-size: 11px;
  line-height: 18px;
}

/* ---------- StatusPill ---------- */
.ly-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px;
  border-radius: var(--radius-pill);
  border: var(--border-w) solid currentColor;
  font-size: var(--text-sm);
  font-weight: 700;
  line-height: 1.3;
  white-space: nowrap;
  color: var(--color-text-muted);
  background: var(--color-surface-2);
}
.ly-pill .ly-icon {
  width: 16px;
  height: 16px;
}
.ly-pill--ok {
  color: var(--color-ok);
  background: var(--color-ok-bg);
}
.ly-pill--warn {
  color: var(--color-warn);
  background: var(--color-warn-bg);
}
.ly-pill--crit,
.ly-pill--live {
  color: var(--color-crit);
  background: var(--color-crit-bg);
}
.ly-pill--info {
  color: var(--color-info);
  background: var(--color-info-bg);
}
.ly-pill--live::before {
  content: '';
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
  animation: ly-pulse 1.6s infinite;
}
@keyframes ly-pulse {
  50% {
    opacity: 0.35;
  }
}

/* ---------- Card ---------- */
.ly-card {
  padding: var(--space-4);
  border-radius: var(--radius-md);
  border: var(--border-w) solid var(--color-border);
  background: var(--color-surface);
}
.ly-card--flush {
  padding: 0;
}
.ly-card--selected {
  border-color: var(--color-accent);
  box-shadow: inset 3px 0 0 var(--color-accent);
}
.ly-card > h2,
.ly-card > h3 {
  margin: 0 0 var(--space-2);
  font-size: var(--text-lg);
}

/* ---------- Sheet / Drawer (native <dialog>) ---------- */
.ly-sheet {
  margin: auto 0 0;
  padding: 0;
  width: 100%;
  max-width: 100%;
  max-height: 86dvh;
  border: 0;
  border-top: var(--border-w) solid var(--color-border);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  background: var(--color-surface);
  color: var(--color-text);
}
.ly-sheet[open] {
  animation: ly-sheet-in var(--dur-base) var(--ease);
}
.ly-sheet::backdrop {
  background: var(--color-scrim);
}
.ly-sheet__inner {
  padding: var(--space-4) var(--space-4) var(--space-6);
}
.ly-sheet__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  margin-bottom: var(--space-3);
}
.ly-sheet__head h2 {
  margin: 0;
  font-size: var(--text-xl);
  line-height: 1.2;
}
.ly-sheet__desc {
  margin: 0 0 var(--space-4);
  color: var(--color-text-muted);
}
.ly-sheet--captions {
  background: var(--color-caption-bg);
}
@keyframes ly-sheet-in {
  from {
    transform: translateY(30px);
    opacity: 0;
  }
}
@media (min-width: 900px) {

 const lines=n?d.caps.slice(-n):d.caps;
 return `<div class="ly-caps ${cls}" role="region" aria-label="Captions, scrollable" tabindex="0"><ol class="ly-caps__log" role="log" aria-live="polite">${lines.map((t,i)=>`<li class="ly-caps__line">${i===0&&!n&&S.s!=='error'?'<span class="ly-caps__speaker">Priya Raman</span>':''}${t}</li>`).join('')}</ol>${S.s==='live'||S.s==='lots'?'<p class="ly-caps__interim" aria-hidden="true">and the rule here is that…</p>':''}</div>`}
function lastLine(d){return d.caps.length?d.caps[d.caps.length-1]:''}
function errBanner(){return S.s==='error'?`<div class="ly-banner" role="status">${ic('mic')}<span>This browser can't caption speech. Use Chrome, or type live notes below.</span></div>`:''}
function notes(){return S.s==='error'?`<form class="p-notes" data-form="notes"><label class="ly-sr-only" for="ln">Live note</label><input id="ln" class="ly-input" placeholder="Type a live note, Enter to send"><button class="ly-btn ly-btn--primary" type="submit">Send</button></form>`:''}
function capBtn(big){const on=S.capsOn&&S.s!=='empty';return S.s==='error'?'':`<button class="ly-btn ${on?'':'ly-btn--primary'} ${big?'ly-btn--lg':''}" data-act="caps">${ic(on?'stop':'mic')}${on?'Stop captions':'Start captions'}${big?'':'<span class="p-kbd">C</span>'}</button>`}
function meter(k,n,att,lg){const t=sigTone(k,n,att);const pct=Math.min(1,n/Math.max(att,1));return `<div class="ly-meter ${t?'ly-meter--'+t:''} ${lg?'ly-meter--lg':''}"><div class="ly-meter__head"><span class="ly-meter__label" style="display:flex;gap:6px;align-items:center">${ic(k)}${SIGL[k]}${t?` <span class="ly-pill ly-pill--${t}" style="font-size:var(--text-xs);padding:1px 8px">${ic(t)}${t==='crit'?'Act now':'Watch'}</span>`:''}</span><span class="ly-meter__value">${n} ${n===1?'person':'people'}</span></div><div class="ly-meter__track" role="meter" aria-valuemin="0" aria-valuemax="${att}" aria-valuenow="${n}" aria-label="${SIGL[k]}"><div class="ly-meter__fill" style="width:${pct*100}%"></div></div></div>`}
function qItem(c,i,size){const done=!!S.answered[c.label];return `<li class="ly-q ${done?'ly-q--answered':''} ${size==='stage'?'ly-q--stage':''}"><span class="ly-q__rank ly-num">${i+1}</span><div><p class="ly-q__label">${c.label}</p><div class="ly-q__meta"><span class="ly-muted">${c.n} ${c.n===1?'person':'people'} asked</span><span class="ly-muted ly-num">${c.v} votes</span>${done?'<span class="ly-pill ly-pill--ok">'+ic('check')+'Answered</span>':''}<button class="ly-btn" style="min-height:36px;font-size:var(--text-sm)" aria-pressed="${done}" data-ans="${i}">${done?'Undo':'Answered'}</button></div></div></li>`}
const openQs=d=>d.cl.filter(c=>!S.answered[c.label]);
function emptyQs(){return `<div class="ly-empty"><strong class="ly-empty__title">No questions yet</strong><p class="ly-empty__body">They appear here as the room asks. Similar ones merge automatically.</p></div>`}

/* ---------- Variants ---------- */
const V={
 a(d){
  const top=openQs(d)[0];const hot=['lost','slower','louder','cant_see'].map(k=>[k,sigTone(k,d.sig[k],d.att)]).filter(x=>x[1]);
  if(d.empty)return `<div class="sa">${errBanner()}<header class="sa-hd"><span class="ly-pill">Starts 10:30</span><h1 class="sa-title">${d.title}</h1><span class="sa-att">${ic('people')}${d.att}</span></header><div class="sa-empty">${qr(Math.min(360,280))}<p class="p-big">Scan to follow along. Captions, questions, all anonymous.</p><p style="margin:0;font-size:var(--text-xl);color:var(--color-text-muted)">lanyard.cnh.radarhq.io/j/K8S</p></div><div class="sa-ctl">${capBtn(false)}<span class="ly-muted" style="font-size:var(--text-sm)">Captions start when you press C. People who joined see them instantly.</span></div></div>`;
  return `<div class="sa">${errBanner()}<header class="sa-hd"><span class="ly-pill ly-pill--live">LIVE</span><h1 class="sa-title">${d.title}</h1><span class="ly-muted" style="font-size:var(--text-lg)">24:10</span><span class="sa-att" aria-label="${d.att} people here">${ic('people')}${d.att.toLocaleString()}</span></header>
  <main class="sa-caps">${capsHTML(d)}${S.s==='error'?`<div style="padding:var(--space-3) var(--space-5)">${notes()}</div>`:''}</main>
  <aside class="sa-side" aria-label="Room">
   <div class="sa-join">${qr(150)}<p>Scan to follow along<small>Captions on your phone. Ask anonymously.<br>lanyard.cnh.radarhq.io/j/K8S</small></p></div>
   <div class="sa-top">${top?`<span class="p-label">Most asked · ${openQs(d).length} open</span><h2 class="p-clamp2" style="-webkit-line-clamp:3">${top.label}</h2><div class="meta">${top.n.toLocaleString()} people asked · ${top.v.toLocaleString()} votes</div>`:S.s==='loading'?'<span class="ly-skeleton" style="height:120px"></span>':`<span class="p-label">Questions</span><h2 style="font-size:var(--text-xl)">None yet. Ask from your phone.</h2>`}</div>
   ${hot.length?`<div><span class="p-label">The room says</span><div class="sa-sig" style="margin-top:8px">${hot.map(([k,t])=>`<span class="ly-pill ly-pill--${t}">${ic(k)}${SIGL[k]} · ${d.sig[k].toLocaleString()}</span>`).join('')}</div></div>`:`<div><span class="p-label">The room says</span><div class="sa-sig" style="margin-top:8px"><span class="ly-pill ly-pill--ok">${ic('check')}All good · ${d.sig.thumbs_up} got it</span></div></div>`}
  </aside>
  <nav class="sa-ctl" aria-label="Speaker controls">${capBtn(false)}<button class="ly-btn" data-act="ans-top" ${top?'':'disabled'}>${ic('check')}Answered<span class="p-kbd">A</span></button><button class="ly-btn" data-act="skip" ${top?'':'disabled'}>${ic('next')}Next question<span class="p-kbd">N</span></button><span style="flex:1"></span><span class="ly-muted" style="font-size:var(--text-sm)">Room screen · projected</span></nav></div>`},

 b(d){
  const qs=S.filter==='open'?openQs(d):d.cl.filter(c=>S.answered[c.label]);
  return `<div class="sb">${errBanner()}<header class="sb-hd">${d.empty?'<span class="ly-pill">Not started</span>':'<span class="ly-pill ly-pill--live">LIVE</span>'}<h1>${d.title}</h1>
  <div class="sb-stat"><span>Elapsed</span><b>${d.empty?'0:00':'24:10'}</b></div>
  <div class="sb-stat"><span>Here now</span><b>${d.att.toLocaleString()} ${d.empty?'':'<span class="sb-up">▲ 8 in 5 min</span>'}</b></div>
  <div class="sb-stat"><span>Questions</span><b>${openQs(d).length}</b></div>
  ${capBtn(d.empty)}</header>
  <div class="sb-grid">
   <section class="sb-col" aria-label="Signals"><h2>Signals <span>last 60 s</span></h2>${S.s==='loading'?'<span class="ly-skeleton" style="height:240px"></span>':`<div class="sb-meters">${Object.keys(SIGL).map(k=>meter(k,d.sig[k],d.att)).join('')}</div>`}</section>
   <section class="sb-col" aria-label="Questions"><h2>Questions <span>ranked by votes and size</span></h2><div class="sb-filter" role="group" aria-label="Filter"><button class="ly-btn" aria-pressed="${S.filter==='open'}" data-filter="open">Open ${openQs(d).length}</button><button class="ly-btn" aria-pressed="${S.filter==='done'}" data-filter="done">Answered ${d.cl.length-openQs(d).length}</button></div>${S.s==='loading'?'<span class="ly-skeleton" style="height:300px"></span>':qs.length?`<ul class="ly-qlist">${qs.map((c,i)=>qItem(c,d.cl.indexOf(c))).join('')}</ul>`:emptyQs()}</section>
   <section class="sb-col sb-caps" aria-label="Caption monitor"><h2>Caption monitor <span>${S.s==='error'?'typed notes':'Chrome · en-US'}</span></h2>${d.empty?`<div class="ly-empty"><strong class="ly-empty__title">Captions are off</strong><p class="ly-empty__body">Press Start captions when you begin. ${d.att} people have joined.</p></div>`:capsHTML(d,'')}${S.s==='error'?`<div style="padding:var(--space-3)">${notes()}</div>`:''}</section>
  </div></div>`},

 c(d){
  const hd=`<header class="sc-hd">${d.empty?'<span class="ly-pill">Not started</span>':'<span class="ly-pill ly-pill--live">LIVE</span>'}<span>${d.empty?'':'24:10'}</span><span class="grow"></span><span>${ic('people')} ${d.att.toLocaleString()} here</span>${S.mode==='qa'?'':capBtn(false)}</header>`;
  if(S.mode==='qa'&&!d.empty){const q=openQs(d);const c=q[0];
   return `<div class="sc">${hd}<div class="sc-qa"><section class="sc-cur" aria-label="Current question">${c?`<span class="p-label" style="font-size:var(--text-lg)">Question 1 of ${q.length}</span><h2 class="p-clamp2" style="-webkit-line-clamp:4">${c.label}</h2><div class="meta">${c.n.toLocaleString()} people asked · ${c.v.toLocaleString()} votes</div><div class="acts"><button class="ly-btn ly-btn--primary" data-act="ans-top">${ic('check')}Answered, next</button><button class="ly-btn" data-act="skip">${ic('next')}Skip</button><button class="ly-btn ly-btn--ghost" data-act="mode">${ic('back')}Back to talk</button></div>`:`<h2>All questions answered</h2><div class="acts"><button class="ly-btn ly-btn--primary" data-act="mode">${ic('back')}Back to talk</button></div>`}</section><aside class="sc-next" aria-label="Up next"><span class="p-label">Up next</span><ol>${q.slice(1,5).map(c=>`<li><span class="p-clamp2">${c.label}</span><span>${c.n} asked · ${c.v} votes</span></li>`).join('')}</ol></aside></div></div>`}
  const n=nudge(d);const qn=openQs(d).length;
  const body=d.empty?`<div class="sc-nudge ok" style="border-style:dashed;color:var(--color-text-muted);background:none">${ic('mic')}<span class="p-big">Ready when you are</span><p>${d.att} people have joined. Press Start captions as you begin.</p></div>${capBtn(true)}`
   :S.s==='loading'?`<span class="ly-skeleton" style="width:60%;height:40%"></span>`
   :n?`<div class="sc-nudge ${n.t}" role="status">${ic(n.k)}<span class="p-big">${SIGL[n.k]} · ${d.sig[n.k].toLocaleString()} people</span><p>${NUDGE_TIP[n.k]}</p></div>`
   :`<div class="sc-nudge ok" role="status">${ic('thumbs_up')}<span class="p-big">The room's with you</span><p>${d.sig.thumbs_up} got it in the last minute</p></div>`;
  return `<div class="sc">${errBanner()}${hd}<main class="sc-talk">${body}${!d.empty&&S.s!=='loading'?`<button class="ly-btn ly-btn--primary sc-take" data-act="mode" ${qn?'':'disabled'}>${ic('list')}Take questions · ${qn} waiting</button>`:''}${notes()}</main>${d.caps.length?`<div class="sc-tick" aria-label="Latest caption"><p class="p-clamp2">${lastLine(d)}</p></div>`:''}</div>`},

 d(d){
  const W=600,H=56,x=m=>m/30*W;
  const row=(label,icon,arr,max,opts={})=>{const y=v=>H-(v/max)*H;const pts=arr.map((v,m)=>`${x(m).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
   const thr=opts.thr!=null?y(opts.thr):null;let hot='';
   if(thr!=null){arr.forEach((v,m)=>{if(m&&(v>opts.thr||arr[m-1]>opts.thr))hot+=`<polyline class="sd-line ${opts.cls}" points="${x(m-1)},${y(arr[m-1])} ${x(m)},${y(v)}"/>`});}
   const peak=arr.reduce((b,v,m)=>v>arr[b]?m:b,0);
   const tone=opts.thr!=null&&arr[peak]>opts.thr?opts.cls:null;
   return `<div class="sd-row"><div class="sd-rl"><b>${ic(icon)}${label}</b><span class="now">${opts.now??arr[arr.length-1]}</span><span>${opts.sub||''}</span></div><svg class="sd-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${label} per minute, peak ${arr[peak]} at minute ${peak}">${thr!=null?`<line class="sd-thr" x1="0" x2="${W}" y1="${thr}" y2="${thr}"/>`:''}<polyline class="sd-line ${opts.acc?'acc':''}" points="${pts}"/>${hot}<line class="sd-cur" x1="${x(S.sel)}" x2="${x(S.sel)}" y1="-4" y2="${H+4}"/>${tone?`<text x="${x(peak)+6}" y="10">${opts.cls==='hot'?'▲':'△'} ${arr[peak]} at ${peak}:00</text>`:''}</svg></div>`};
  const qrow=`<div class="sd-row"><div class="sd-rl"><b>${ic('list')}Questions</b><span class="now">${d.cl.length}</span><span>merged clusters</span></div><svg class="sd-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Questions over time">${QAT.map(q=>`<circle class="sd-dot" cx="${x(q.m)}" cy="${H/2}" r="7"/>`).join('')}<line class="sd-cur" x1="${x(S.sel)}" x2="${x(S.sel)}" y1="-4" y2="${H+4}"/></svg></div>`;
  const said=SAID[S.sel]||Object.entries(SAID).reduce((b,[m,t])=>Math.abs(m-S.sel)<Math.abs(b[0]-S.sel)?[+m,t]:b,[99,''])[1];
  const askedThen=QAT.filter(q=>Math.abs(q.m-S.sel)<=1).map(q=>CL[q.i].label);
  if(d.empty||S.s==='loading')return `<div class="sd">${errBanner()}<header class="sd-hd">${d.empty?'<span class="ly-pill">Not started</span>':'<span class="ly-pill ly-pill--live">LIVE</span>'}<h1>${d.title}</h1>${capBtn(d.empty)}</header><div class="ly-empty" style="margin:auto"><strong class="ly-empty__title">${d.empty?'The timeline starts with your talk':'Connecting…'}</strong><p class="ly-empty__body">${d.att} people have joined so far.</p></div></div>`;
  return `<div class="sd">${errBanner()}<header class="sd-hd"><span class="ly-pill ly-pill--live">LIVE</span><h1>${d.title}</h1><span class="ly-muted">24:10 of 30:00</span>${capBtn(false)}</header>
  <div class="sd-main"><section class="sd-chart" aria-label="Talk timeline" data-chart>
   ${row('Here','people',ATT.map(v=>d.lots?v*15:v),d.lots?2200:150,{acc:true,now:d.att.toLocaleString(),sub:'+104 since start'})}
   ${row('Lost me','lost',d.lots?LOST.slice(0,-1).map(v=>v*15).concat(d.sig.lost):LOST,d.lots?1400:30,{thr:Math.round(d.att*.05),cls:'hot',sub:'per minute',now:d.sig.lost.toLocaleString()})}
   ${row('Slower','slower',d.lots?SLOW.slice(0,-1).map(v=>v*15).concat(d.sig.slower):SLOW,d.lots?1400:30,{thr:Math.round(d.att*.05),cls:'warm',sub:'per minute',now:d.sig.slower.toLocaleString()})}
   ${row('Got it','thumbs_up',d.lots?GOT.slice(0,-1).map(v=>v*15).concat(d.sig.thumbs_up):GOT,d.lots?1400:45,{sub:'per minute',now:d.sig.thumbs_up.toLocaleString()})}
   ${qrow}
   <div class="sd-axis"><span></span><div><span>0:00</span><span>10:00</span><span>20:00</span><span>30:00</span></div></div>
   <p class="ly-muted" style="font-size:var(--text-sm)">Dashed line: alert threshold (5% of the room). Click the chart to move the cursor.</p>
  </section>
  <aside class="sd-side" aria-label="At the cursor"><div><span class="p-label">At ${S.sel}:00 you were saying</span><div class="sd-at" style="margin-top:8px">${said}</div></div><div><span class="p-label">Asked around then</span>${askedThen.length?`<ul style="margin:8px 0 0;padding-left:1.1em;display:grid;gap:6px">${askedThen.map(l=>`<li>${l}</li>`).join('')}</ul>`:'<p class="ly-muted">Nothing.</p>'}</div><div><span class="p-label">Top open questions</span><ul class="ly-qlist" style="margin-top:8px">${openQs(d).slice(0,3).map((c,i)=>qItem(c,d.cl.indexOf(c))).join('')}</ul></div></aside></div>
  ${notes()?`<div style="padding:var(--space-3)">${notes()}</div>`:''}<div class="sd-tick"><p class="p-clamp2">${lastLine(d)}</p></div></div>`},

 e(d){
  const qs=d.cl.slice(0,5);const more=d.cl.length-qs.length;
  const hd=`<header class="se-hd">${qr(96)}<h1>${d.empty?'Ask anything, anonymously':'You asked. We merged.'}<small>${d.empty?'Scan to join. Similar questions merge into one.':`${d.cl.reduce((a,c)=>a+c.n,0).toLocaleString()} questions from ${d.att.toLocaleString()} people, merged into ${d.cl.length}`}</small></h1>${capBtn(false)}</header>`;
  const wall=S.s==='loading'?`<div class="se-wall">${[1,2,3,4,5].map((_,i)=>`<span class="ly-skeleton ${i?'':'se-card top'}" style="height:auto"></span>`).join('')}</div>`
   :qs.length?`<div class="se-wall">${qs.map((c,i)=>`<article class="se-card ${i===0?'top':''} ${S.answered[c.label]?'done':''}"><h2 class="p-clamp2" style="-webkit-line-clamp:${i?3:4}">${c.label}</h2><div class="meta"><span>${c.n.toLocaleString()} asked</span><span>${ic('up')}${c.v.toLocaleString()}</span>${S.answered[c.label]?'<span class="ly-pill ly-pill--ok">'+ic('check')+'Answered</span>':''}</div></article>`).join('')}${more?`<p class="ly-muted" style="grid-column:1/-1;margin:0;font-size:var(--text-lg)">+ ${more} more questions on your phones</p>`:''}</div>`
   :`<div class="se-wall" style="grid-template-columns:1fr"><div class="ly-empty" style="margin:auto"><strong class="ly-empty__title" style="font-size:var(--text-2xl)">Questions appear here as you ask them</strong></div></div>`;
  return `<div class="se">${errBanner()}${hd}${wall}${notes()?`<div style="padding:0 var(--space-5) var(--space-3)">${notes()}</div>`:''}${d.caps.length?`<div class="se-sub" aria-label="Latest caption"><p class="p-clamp2">${lastLine(d)}</p></div>`:''}</div>`},
};

/* ---------- Render ---------- */
const SIZES={projector:[1920,1080],laptop:[1280,800],phone:[390,800]};
const fitEl=document.getElementById('fit'),frame=document.getElementById('frame');
function render(){
 document.documentElement.dataset.theme=S.t;
 const [w,h]=SIZES[S.w];
 const avail=Math.max(320,window.innerWidth-40);
 let k=Math.min(1,avail/w);if(S.far)k*=0.35;
 frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform=`scale(${k})`;
 frame.className='frame'+(S.w==='phone'?' phone':'')+(S.far?' far':'');
 fitEl.style.width=w*k+'px';fitEl.style.height=h*k+'px';
 fitEl.querySelector('.h-far-note')?.remove();
 if(S.far)fitEl.insertAdjacentHTML('beforeend','<div class="h-far-note">About how a 3 m projected screen looks from the back row (10 m)</div>');
 document.getElementById('belief').innerHTML=BELIEFS[S.v];
 frame.innerHTML=V[S.v](data());
 const sc=frame.querySelector('.ly-caps');if(sc)sc.scrollTop=sc.scrollHeight;
}
document.getElementById('ctl').addEventListener('change',e=>{const f=e.target;S[f.name]=f.type==='checkbox'?f.checked:f.value;if(f.name==='s')S.capsOn=f.value!=='empty';render()});
window.addEventListener('resize',render);
function act(a){const d=data();const top=openQs(d)[0];
 if(a==='caps'){if(S.s==='empty'){S.s='live';syncCtl()}else S.capsOn=!S.capsOn}
 if(a==='ans-top'&&top)S.answered[top.label]=true;
 if(a==='skip'&&top){const i=d.cl.indexOf(top);CL.push(CL.splice(i,1)[0])}
 if(a==='mode')S.mode=S.mode==='qa'?'talk':'qa';
 render()}
frame.addEventListener('click',e=>{
 const svg=e.target.closest('.sd-svg');if(svg){const r=svg.getBoundingClientRect();S.sel=Math.max(0,Math.min(NOW,Math.round((e.clientX-r.left)/r.width*30)));render();return}
 const b=e.target.closest('[data-act],[data-ans],[data-filter]');if(!b)return;
 if(b.dataset.act)return act(b.dataset.act);
 if(b.dataset.ans){const c=data().cl[+b.dataset.ans];S.answered[c.label]=!S.answered[c.label]}
 if(b.dataset.filter)S.filter=b.dataset.filter;
 render()});
frame.addEventListener('submit',e=>{e.preventDefault();const i=frame.querySelector('#ln');if(i&&i.value){CAPS.push(i.value);}render()});
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea'))return;const k=e.key.toLowerCase();if(k==='c')act('caps');if(k==='a')act('ans-top');if(k==='n')act('skip');if(k==='q'&&S.v==='c')act('mode')});
function syncCtl(){const c=document.getElementById('ctl');for(const k of ['v','s','w','t']){const i=c.querySelector(`input[name=${k}][value="${S[k]}"]`);if(i)i.checked=true}c.far.checked=S.far}
// Deep link: grill-speaker.html#v=c&s=lots&w=laptop&t=light&mode=qa&far=true&bare=true
for(const [k,v] of new URLSearchParams(location.hash.slice(1)))S[k]=v==='true'?true:v==='false'?false:k==='sel'?+v:v;
if(S.s==='empty')S.capsOn=false;
if(S.bare)document.documentElement.dataset.motion='reduce'; // static screenshots
if(S.bare){document.querySelector('.h-bar').style.display='none';document.getElementById('belief').style.display='none';document.querySelector('.h-stage').style.padding='20px'}
syncCtl();render();
</script>
</body>
