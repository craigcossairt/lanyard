<!doctype html>
<html lang="en" data-theme="dark" data-caption-size="l">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lanyard · grill-design · Round 1: attendee live session</title>
<style>
/* ============ TOKENS (shared by every variant; variants may not override) ============ */
@font-face{font-family:"Atkinson Hyperlegible Next";font-weight:400;font-display:swap;src:url(../../apps/web/src/ui/fonts/atkinson-hyperlegible-next-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible Next";font-weight:700;font-display:swap;src:url(../../apps/web/src/ui/fonts/atkinson-hyperlegible-next-latin-700-normal.woff2) format("woff2")}
:root{
  --font-sans:"Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --text-xs:.75rem;--text-sm:.875rem;--text-md:1rem;--text-lg:1.25rem;--text-xl:1.5rem;--text-2xl:2rem;--text-3xl:2.75rem;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;--space-8:64px;
  --radius-sm:6px;--radius-md:10px;--radius-lg:16px;--radius-pill:999px;
  --dur-fast:120ms;--dur-base:220ms;--ease:cubic-bezier(.2,.7,.2,1);
  --z-sticky:10;--z-sheet:40;--z-toast:50;
  --border-w:1px;
}
:root,[data-theme=dark]{
  --color-bg:#0b0d12;--color-surface:#141821;--color-surface-2:#1d2230;--color-border:#2e3547;
  --color-text:#eef1f6;--color-text-muted:#a9b1c2;--color-accent:#b69cff;--color-on-accent:#150a33;--color-focus:#5ad8ff;
  --color-ok:#4fd69c;--color-ok-bg:#0f2a20;--color-warn:#f5bd4f;--color-warn-bg:#2d2310;--color-crit:#ff7b7b;--color-crit-bg:#331617;--color-info:#79b8ff;--color-info-bg:#122238;
  --color-caption-bg:#05060a;--color-caption-text:#fffdf6;--color-caption-interim:#9aa3b5;
}
[data-theme=light]{
  --color-bg:#f5f6f8;--color-surface:#ffffff;--color-surface-2:#eceef3;--color-border:#cfd4de;
  --color-text:#10131c;--color-text-muted:#4a5266;--color-accent:#5b34d6;--color-on-accent:#ffffff;--color-focus:#0b57d0;
  --color-ok:#0a7a45;--color-ok-bg:#e3f5ec;--color-warn:#8a5a00;--color-warn-bg:#fdf1d8;--color-crit:#c0262d;--color-crit-bg:#fde6e6;--color-info:#1f5fbf;--color-info-bg:#e3eefc;
  --color-caption-bg:#ffffff;--color-caption-text:#0b0d12;--color-caption-interim:#5b6375;
}
[data-theme=contrast]{
  --color-bg:#000;--color-surface:#000;--color-surface-2:#121212;--color-border:#ffffff;
  --color-text:#fff;--color-text-muted:#f0f0f0;--color-accent:#ffe14d;--color-on-accent:#000;--color-focus:#00e5ff;
  --color-ok:#5cff9d;--color-ok-bg:#000;--color-warn:#ffd23f;--color-warn-bg:#000;--color-crit:#ff8a8a;--color-crit-bg:#000;--color-info:#8fd0ff;--color-info-bg:#000;
  --color-caption-bg:#000;--color-caption-text:#ffff66;--color-caption-interim:#ffffff;
  --border-w:2px;
}
[data-caption-size=s]{--caption-size:1.25rem}
[data-caption-size=m]{--caption-size:1.625rem}
[data-caption-size=l]{--caption-size:2.125rem}
[data-caption-size=xl]{--caption-size:2.75rem}
[data-caption-size=xxl]{--caption-size:3.625rem}
[data-readable=true]{--readable-tracking:.04em;--readable-words:.14em;--readable-leading:1.7}
[data-motion=reduce]{--dur-fast:0ms;--dur-base:0ms}
@media (prefers-reduced-motion:reduce){:root{--dur-fast:0ms;--dur-base:0ms}}

/* ============ HARNESS (not part of the design) ============ */
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font-sans);background:#2a2d35;color:#eef1f6;}
.h-bar{position:sticky;top:0;z-index:100;background:#15171c;border-bottom:1px solid #333;padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font:13px/1.3 system-ui,sans-serif}
.h-bar fieldset{border:0;margin:0;padding:0;display:flex;gap:4px;align-items:center}
.h-bar legend{float:left;margin-right:6px;color:#9aa;font-weight:600}
.h-bar label{display:inline-flex;align-items:center;gap:3px;padding:3px 7px;border-radius:5px;background:#23262e;cursor:pointer}
.h-bar label:has(input:checked){background:#5b34d6;color:#fff}
.h-bar input[type=radio]{position:absolute;opacity:0;pointer-events:none}
.h-bar label:has(input:focus-visible){outline:2px solid #5ad8ff}
.h-belief{background:#1b1e25;color:#dfe3ea;padding:8px 14px;font:14px/1.4 system-ui,sans-serif;border-bottom:1px solid #333}
.h-belief b{color:#c9b8ff}
.h-stage{display:flex;justify-content:center;padding:20px 12px 60px}
.frame{width:390px;height:800px;border-radius:28px;overflow:hidden;position:relative;background:var(--color-bg);color:var(--color-text);box-shadow:0 0 0 10px #111,0 20px 60px #0008;container-type:inline-size;font-family:var(--font-sans);letter-spacing:var(--readable-tracking,normal);word-spacing:var(--readable-words,normal)}
.frame.desk{width:1180px;height:760px;border-radius:10px;box-shadow:0 0 0 6px #111,0 20px 60px #0008}
.frame *{box-sizing:border-box}

/* ============ SHARED PRIMITIVES (candidate components; identical in every variant) ============ */
.frame :focus-visible{outline:3px solid var(--color-focus);outline-offset:2px}
.p-btn{font:inherit;font-weight:700;font-size:var(--text-md);min-height:44px;padding:0 var(--space-4);border-radius:var(--radius-md);border:var(--border-w) solid var(--color-border);background:var(--color-surface-2);color:var(--color-text);display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);cursor:pointer;transition:transform var(--dur-fast) var(--ease)}
.p-btn:active{transform:scale(.97)}
.p-btn.primary{background:var(--color-accent);color:var(--color-on-accent);border-color:var(--color-accent)}
.p-btn.ghost{background:transparent;border-color:transparent}
.p-btn svg,.p-ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.p-pill{display:inline-flex;align-items:center;gap:6px;font-size:var(--text-sm);font-weight:700;padding:3px 10px;border-radius:var(--radius-pill);border:var(--border-w) solid currentColor;line-height:1.3;white-space:nowrap}
.p-pill.live{color:var(--color-crit);background:var(--color-crit-bg)}
.p-pill.live::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 1.6s infinite}
[data-motion=reduce] .p-pill.live::before{animation:none}
@media (prefers-reduced-motion:reduce){.p-pill.live::before{animation:none}}
@keyframes pulse{50%{opacity:.35}}
.p-pill.ok{color:var(--color-ok);background:var(--color-ok-bg)}.p-pill.warn{color:var(--color-warn);background:var(--color-warn-bg)}.p-pill.info{color:var(--color-info);background:var(--color-info-bg)}
.p-muted{color:var(--color-text-muted)}
.p-caps{font-size:var(--caption-size);line-height:var(--readable-leading,1.35);color:var(--color-caption-text);font-weight:400}
.p-caps p{margin:0 0 .55em;max-width:32ch}
.frame.desk .p-caps p{max-width:42ch}
.p-caps .interim{color:var(--color-caption-interim)}
.p-caps .new{animation:capin var(--dur-base) var(--ease)}
@keyframes capin{from{opacity:0;transform:translateY(6px)}}
.p-caps .spk{display:block;font-size:var(--text-sm);font-weight:700;color:var(--color-accent);letter-spacing:.06em;text-transform:uppercase;margin-bottom:.2em}
.p-jump{position:absolute;left:50%;transform:translateX(-50%);bottom:var(--space-4);z-index:var(--z-sticky)}
.p-sig{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.p-sigb{font:inherit;min-height:64px;border-radius:var(--radius-md);border:var(--border-w) solid var(--color-border);background:var(--color-surface);color:var(--color-text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:var(--text-xs);font-weight:700;cursor:pointer;padding:6px 2px;line-height:1.1;text-align:center}
.p-sigb[aria-pressed=true]{background:var(--color-accent);color:var(--color-on-accent);border-color:var(--color-accent)}
.p-q{display:grid;grid-template-columns:auto 1fr;gap:var(--space-3);padding:var(--space-3);border-radius:var(--radius-md);background:var(--color-surface);border:var(--border-w) solid var(--color-border)}
.p-q.mine{border-color:var(--color-accent);box-shadow:inset 3px 0 0 var(--color-accent)}
.p-q .lbl{font-weight:700;font-size:var(--text-md);margin:0 0 2px}
.p-q .txt{margin:0;font-size:var(--text-sm);color:var(--color-text-muted);line-height:1.45}
.p-q .meta{margin-top:6px;font-size:var(--text-sm);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.p-vote{font:inherit;width:52px;min-height:52px;border-radius:var(--radius-md);border:var(--border-w) solid var(--color-border);background:var(--color-surface-2);color:var(--color-text);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;cursor:pointer;font-size:var(--text-md)}
.p-vote[aria-pressed=true]{background:var(--color-accent);color:var(--color-on-accent);border-color:var(--color-accent)}
.p-vote svg{width:18px;height:18px}
.p-sheetwrap{position:absolute;inset:0;z-index:var(--z-sheet);display:flex;align-items:flex-end;background:#0009}
.frame.desk .p-sheetwrap{justify-content:flex-end;align-items:stretch}
.p-sheet{width:100%;max-height:86%;overflow:auto;background:var(--color-surface);border-top:var(--border-w) solid var(--color-border);border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:var(--space-4) var(--space-4) var(--space-6);animation:sheetin var(--dur-base) var(--ease)}
.frame.desk .p-sheet{width:420px;max-height:none;border-radius:0;border-left:var(--border-w) solid var(--color-border)}
@keyframes sheetin{from{transform:translateY(30px);opacity:0}}
.p-sheet h2{margin:0;font-size:var(--text-xl)}
.p-sheethd{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-3)}
.p-toast{position:absolute;left:var(--space-3);right:var(--space-3);top:var(--space-3);z-index:var(--z-toast);background:var(--color-text);color:var(--color-bg);padding:var(--space-3) var(--space-4);border-radius:var(--radius-md);font-weight:700;display:flex;gap:10px;align-items:center;animation:sheetin var(--dur-base) var(--ease)}
.frame.desk .p-toast{left:auto;width:380px}
.p-banner{display:flex;gap:10px;align-items:center;padding:var(--space-2) var(--space-3);background:var(--color-warn-bg);color:var(--color-warn);border-bottom:var(--border-w) solid currentColor;font-weight:700;font-size:var(--text-sm)}
.p-banner .p-btn{min-height:36px;margin-left:auto;font-size:var(--text-sm)}
.p-sk{background:linear-gradient(90deg,var(--color-surface-2),var(--color-surface),var(--color-surface-2));background-size:200% 100%;animation:sk 1.4s infinite linear;border-radius:var(--radius-sm)}
[data-motion=reduce] .p-sk{animation:none}
@keyframes sk{to{background-position:-200% 0}}
.p-empty{text-align:center;padding:var(--space-6) var(--space-4);color:var(--color-text-muted)}
.p-empty strong{display:block;color:var(--color-text);font-size:var(--text-lg);margin-bottom:6px}
.p-input{font:inherit;font-size:var(--text-md);width:100%;min-height:48px;padding:var(--space-3);border-radius:var(--radius-md);border:var(--border-w) solid var(--color-border);background:var(--color-bg);color:var(--color-text);resize:none}
.p-stale{opacity:.55}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============ VARIANT A: Caption stage ============ */
.va{height:100%;display:flex;flex-direction:column;background:var(--color-caption-bg)}
.va-hd{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-3) var(--space-4);border-bottom:var(--border-w) solid var(--color-border);background:var(--color-bg)}
.va-title{font-weight:700;font-size:var(--text-sm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.va-caps{flex:1;overflow:auto;padding:var(--space-5) var(--space-5) var(--space-7);position:relative}
.va-dock{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-2);padding:var(--space-2) var(--space-3) var(--space-4);border-top:var(--border-w) solid var(--color-border);background:var(--color-bg)}
.va-dock .p-btn{flex-direction:column;min-height:60px;font-size:var(--text-xs);padding:4px;gap:3px;position:relative}
.va-badge{position:absolute;top:4px;right:10px;background:var(--color-accent);color:var(--color-on-accent);border-radius:var(--radius-pill);font-size:11px;padding:0 6px;min-width:20px}
@container (min-width:900px){.va{display:grid;grid-template-columns:1fr 400px;grid-template-rows:auto 1fr auto}.va-hd{grid-column:1/-1}.va-caps{grid-row:2/4}.va-dock{grid-column:2;grid-row:3}.va-side{display:block!important;grid-column:2;grid-row:2;overflow:auto;padding:var(--space-4);background:var(--color-bg);border-left:var(--border-w) solid var(--color-border)}.va-dock{border-left:var(--border-w) solid var(--color-border)}}

/* ============ VARIANT B: Tabs ============ */
.vb{height:100%;display:flex;flex-direction:column}
.vb-hd{padding:var(--space-3) var(--space-4) 0;background:var(--color-surface)}
.vb-hd h1{font-size:var(--text-lg);margin:6px 0 2px;line-height:1.25}
.vb-tabs{display:flex;gap:0;margin-top:var(--space-3)}
.vb-tab{font:inherit;flex:1;min-height:48px;background:none;border:0;border-bottom:3px solid transparent;color:var(--color-text-muted);font-weight:700;cursor:pointer;font-size:var(--text-md)}
.vb-tab[aria-selected=true]{color:var(--color-text);border-bottom-color:var(--color-accent)}
.vb-panel{flex:1;overflow:auto;padding:var(--space-4);position:relative}
.vb-panel.caps{background:var(--color-caption-bg);padding:var(--space-5)}
.vb-foot{padding:var(--space-2) var(--space-3) var(--space-4);background:var(--color-surface);border-top:var(--border-w) solid var(--color-border)}
.vb-fab{position:absolute;right:var(--space-4);bottom:var(--space-4)}
@container (min-width:900px){.vb-body{display:grid!important;grid-template-columns:1.4fr 1fr;flex:1;min-height:0}.vb-tabs{display:none}.vb-body>.vb-panel{display:block!important;border-left:var(--border-w) solid var(--color-border)}}

/* ============ VARIANT C: One feed ============ */
.vc{height:100%;display:flex;flex-direction:column}
.vc-hd{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-3) var(--space-4);border-bottom:var(--border-w) solid var(--color-border)}
.vc-feed{flex:1;overflow:auto;padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3);position:relative;background:var(--color-caption-bg)}
.vc-cap{font-size:var(--caption-size);line-height:var(--readable-leading,1.35);color:var(--color-caption-text);max-width:34ch}
.vc-evt{align-self:center;font-size:var(--text-sm);color:var(--color-text-muted);display:flex;gap:6px;align-items:center;padding:4px 12px;border-radius:var(--radius-pill);border:var(--border-w) dashed var(--color-border)}
.vc-q{align-self:flex-end;max-width:85%;background:var(--color-surface-2);border-radius:var(--radius-lg) var(--radius-lg) 4px var(--radius-lg);padding:var(--space-3);font-size:var(--text-md);border:var(--border-w) solid var(--color-border)}
.vc-q.mine{background:var(--color-accent);color:var(--color-on-accent)}
.vc-comp{display:flex;gap:var(--space-2);padding:var(--space-2) var(--space-3) var(--space-4);border-top:var(--border-w) solid var(--color-border);background:var(--color-surface);align-items:flex-end}
.vc-quick{display:flex;gap:6px;overflow:auto;padding:var(--space-2) var(--space-3) 0;background:var(--color-surface)}
.vc-quick .p-btn{min-height:40px;font-size:var(--text-sm);white-space:nowrap;padding:0 12px}
.vc-quick .p-btn[aria-pressed=true]{background:var(--color-accent);color:var(--color-on-accent)}

/* ============ VARIANT D: Split ============ */
.vd{height:100%;display:flex;flex-direction:column}
.vd-hd{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-4);background:var(--color-surface);border-bottom:var(--border-w) solid var(--color-border);font-size:var(--text-sm)}
.vd-caps{flex:0 0 44%;overflow:auto;padding:var(--space-4) var(--space-5);background:var(--color-caption-bg);position:relative;border-bottom:var(--border-w) solid var(--color-border)}
.vd-low{flex:1;overflow:auto;padding:var(--space-3);display:flex;flex-direction:column;gap:var(--space-3)}
.vd-ask{display:flex;gap:var(--space-2)}
.vd-sec{display:flex;justify-content:space-between;align-items:baseline;margin:var(--space-2) 0 0}
.vd-sec h2{font-size:var(--text-md);margin:0}
@container (min-width:900px){.vd{display:grid;grid-template-columns:1.5fr 1fr;grid-template-rows:auto 1fr}.vd-hd{grid-column:1/-1}.vd-caps{border-bottom:0;border-right:var(--border-w) solid var(--color-border);padding:var(--space-6)}}

/* ============ VARIANT E: Remote control ============ */
.ve{height:100%;display:flex;flex-direction:column}
.ve-tick{background:var(--color-caption-bg);padding:var(--space-3) var(--space-4);border-bottom:var(--border-w) solid var(--color-border);cursor:pointer}
.ve-tick .p-caps{font-size:min(var(--caption-size),1.25rem);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ve-tick .p-caps p{margin:0;max-width:none}
.ve-main{flex:1;overflow:auto;padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-4)}
.ve-main h1{font-size:var(--text-xl);margin:0;line-height:1.2}
.ve-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3)}
.ve-grid .p-sigb{min-height:96px;font-size:var(--text-md);border-radius:var(--radius-lg)}
.ve-grid .p-sigb svg{width:30px;height:30px}
.ve-grid .p-sigb:last-child{grid-column:1/-1;min-height:72px;flex-direction:row;gap:10px}
.ve-ask{min-height:64px;font-size:var(--text-lg);border-radius:var(--radius-lg)}
@container (min-width:900px){.ve-main{display:grid;grid-template-columns:1fr 1fr;align-content:start}.ve-main h1{grid-column:1/-1}}
</style>
</head>
<body>
<form class="h-bar" id="ctl" aria-label="Prototype controls">
  <fieldset><legend>Variant</legend>
    <label><input type="radio" name="v" value="a" checked>A Caption stage</label>
    <label><input type="radio" name="v" value="b">B Tabs</label>
    <label><input type="radio" name="v" value="c">C One feed</label>
    <label><input type="radio" name="v" value="d">D Split</label>
    <label><input type="radio" name="v" value="e">E Remote</label>
  </fieldset>
  <fieldset><legend>State</legend>
    <label><input type="radio" name="s" value="live" checked>Live</label>
    <label><input type="radio" name="s" value="loading">Loading</label>
    <label><input type="radio" name="s" value="empty">Empty</label>
    <label><input type="radio" name="s" value="error">Error</label>
    <label><input type="radio" name="s" value="lots">Too much</label>
  </fieldset>
  <fieldset><legend>Width</legend>
    <label><input type="radio" name="w" value="phone" checked>Phone</label>
    <label><input type="radio" name="w" value="desk">Desktop</label>
  </fieldset>
  <fieldset><legend>Theme</legend>
    <label><input type="radio" name="t" value="dark" checked>Dark</label>
    <label><input type="radio" name="t" value="light">Light</label>
    <label><input type="radio" name="t" value="contrast">High contrast</label>
  </fieldset>
  <fieldset><legend>Caption</legend>
    <label><input type="radio" name="cs" value="s">S</label>
    <label><input type="radio" name="cs" value="m">M</label>
    <label><input type="radio" name="cs" value="l" checked>L</label>
    <label><input type="radio" name="cs" value="xl">XL</label>
    <label><input type="radio" name="cs" value="xxl">XXL</label>
  </fieldset>
  <fieldset><legend>Access</legend>
    <label><input type="checkbox" name="rd">Readable</label>
    <label><input type="checkbox" name="rm">Reduce motion</label>
  </fieldset>
</form>
<div class="h-belief" id="belief"></div>
<div class="h-stage"><div class="frame" id="frame"></div></div>

<script>
const BELIEFS={
 a:"<b>A · Caption stage.</b> Reading is the job. Captions own the whole screen; ask, questions, react and catch-up are one thumb away in sheets. Bet: most people in the room just want to follow along.",
 b:"<b>B · Tabs.</b> Familiar app shape. Captions / Questions / Catch-up each get the full screen; signals are a permanent strip so they're never more than 0 taps away.",
 c:"<b>C · One feed.</b> The room is a conversation. Captions, merged questions and crowd signals interleave in one chat-like stream with a messenger composer. (Pushback candidate: mixes reading with noise.)",
 d:"<b>D · Split.</b> No navigation at all. Captions fixed on top, ask + signals + live question list underneath. Dense, everything visible, nothing hidden.",
 e:"<b>E · Remote control.</b> Participation first. Your phone is a remote for the room: giant signal buttons and Ask; captions shrink to a 2-line ticker you tap to expand. (Deliberately crosses the 'captions are the centrepiece' rule.)"
};
const IC={
