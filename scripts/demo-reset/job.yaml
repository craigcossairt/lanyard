# One-off demo reset Job (not in deploy/, so Argo CD neither owns nor prunes it).
# The cluster's Valkey is reachable only in-cluster, so this runs scripts/demo-reset.mjs
# inside the app image (which has Node 22 and node_modules). Script from ConfigMap
# demo-reset-script. Rename metadata.name per run (demo-reset-001, -002, ...).
# ARGS: "--apply" wipes; drop it for a dry run (counts only). See README.md.
apiVersion: batch/v1
kind: Job
metadata:
  name: demo-reset-001
  namespace: team-lanyard
  labels:
    app: demo-reset
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: demo-reset
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reset
          image: ghcr.io/craigcossairt/lanyard:latest
          workingDir: /app
          command: [node, /reset/demo-reset.mjs, --apply]
          env:
            - name: VALKEY_URL
              value: 'redis://valkey:6379'
            - name: ES_URL
              valueFrom:
                secretKeyRef: { name: app-credentials, key: ES_URL }
            - name: ES_API_KEY
              valueFrom:
                secretKeyRef: { name: app-credentials, key: ES_API_KEY }
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: script
              mountPath: /reset
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: demo-reset-script
